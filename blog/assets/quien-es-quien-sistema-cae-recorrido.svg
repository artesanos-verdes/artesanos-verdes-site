<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 644" width="720" height="644" role="img" aria-labelledby="rec-title rec-desc" font-family="'Source Sans 3', Arial, sans-serif">
  <title id="rec-title">El recorrido de un ahorro en el sistema CAE</title>
  <desc id="rec-desc">Seis pasos: 1, el propietario del ahorro invierte en la obra y cede el ahorro a cambio de una contraprestación; 2, el sujeto delegado, acreditado por el Coordinador Nacional, firma el convenio CAE, pasa a ser dueño del ahorro y prepara el expediente; 3, un verificador acreditado por ENAC revisa la documentación y el ahorro y emite un dictamen; 4, el gestor autonómico valida el expediente, emite los CAE y los preinscribe; 5, el Coordinador Nacional los inscribe en el Registro Nacional, a razón de 1 CAE por kWh de ahorro anual; 6, los CAE se liquidan para cumplir parte de la obligación anual de ahorro del sujeto obligado, por él o, en su nombre, por el sujeto delegado. El obligado puede encargar los ahorros a un sujeto delegado mediante un contrato de delegación, pero la obligación sigue siendo suya.</desc>
  <rect width="720" height="644" fill="#f7f7f5"/>
  <text x="20" y="44" fill="#1a4d30" font-family="'Source Serif 4', Georgia, serif" font-size="24" font-weight="700">El recorrido de un ahorro en el sistema CAE</text>
  <text x="20" y="70" fill="#5a6b4a" font-size="15">Quién interviene en cada paso, según el Real Decreto 36/2023</text>
  <g>
    <rect x="20" y="92" width="326" height="124" rx="14" fill="#e9f2ec" stroke="#22a044" stroke-width="2.5"/>
    <circle cx="49" cy="121" r="15" fill="#158035"/>
    <text x="49" y="126.5" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">1</text>
    <text x="76" y="127" fill="#1a4d30" font-family="'Source Serif 4', Georgia, serif" font-size="18" font-weight="700">Propietario del ahorro</text>
    <text x="40" y="158" fill="#2b3a2f" font-size="14">Inviertes en la obra (desván, cubierta,</text>
    <text x="40" y="179" fill="#2b3a2f" font-size="14">bomba de calor) y cedes el ahorro a</text>
    <text x="40" y="200" fill="#2b3a2f" font-size="14">cambio de una contraprestación.</text>
  </g>
  <g>
    <rect x="374" y="92" width="326" height="124" rx="14" fill="#ffffff" stroke="#1a4d30" stroke-width="2"/>
    <circle cx="403" cy="121" r="15" fill="#1a4d30"/>
    <text x="403" y="126.5" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">2</text>
    <text x="430" y="127" fill="#1a4d30" font-family="'Source Serif 4', Georgia, serif" font-size="18" font-weight="700">Sujeto delegado</text>
    <text x="394" y="158" fill="#2b3a2f" font-size="14">Acreditado por el Coordinador Nacional.</text>
    <text x="394" y="179" fill="#2b3a2f" font-size="14">Firma el convenio CAE, pasa a ser dueño</text>
    <text x="394" y="200" fill="#2b3a2f" font-size="14">del ahorro y prepara el expediente.</text>
  </g>
  <g>
    <rect x="374" y="254" width="326" height="124" rx="14" fill="#ffffff" stroke="#1a4d30" stroke-width="2"/>
    <circle cx="403" cy="283" r="15" fill="#1a4d30"/>
    <text x="403" y="288.5" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">3</text>
    <text x="430" y="289" fill="#1a4d30" font-family="'Source Serif 4', Georgia, serif" font-size="18" font-weight="700">Verificador</text>
    <text x="394" y="320" fill="#2b3a2f" font-size="14">Entidad acreditada por ENAC. Revisa la</text>
    <text x="394" y="341" fill="#2b3a2f" font-size="14">documentación y el ahorro según la ficha</text>
    <text x="394" y="362" fill="#2b3a2f" font-size="14">y emite un dictamen.</text>
  </g>
  <g>
    <rect x="20" y="254" width="326" height="124" rx="14" fill="#ffffff" stroke="#1a4d30" stroke-width="2"/>
    <circle cx="49" cy="283" r="15" fill="#1a4d30"/>
    <text x="49" y="288.5" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">4</text>
    <text x="76" y="289" fill="#1a4d30" font-family="'Source Serif 4', Georgia, serif" font-size="18" font-weight="700">Gestor autonómico</text>
    <text x="40" y="320" fill="#2b3a2f" font-size="14">Órgano de tu comunidad autónoma. Valida</text>
    <text x="40" y="341" fill="#2b3a2f" font-size="14">el expediente, emite los CAE y los</text>
    <text x="40" y="362" fill="#2b3a2f" font-size="14">preinscribe en el Registro Nacional.</text>
  </g>
  <g>
    <rect x="20" y="416" width="326" height="124" rx="14" fill="#ffffff" stroke="#1a4d30" stroke-width="2"/>
    <circle cx="49" cy="445" r="15" fill="#1a4d30"/>
    <text x="49" y="450.5" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">5</text>
    <text x="76" y="451" fill="#1a4d30" font-family="'Source Serif 4', Georgia, serif" font-size="18" font-weight="700">Coordinador Nacional</text>
    <text x="40" y="482" fill="#2b3a2f" font-size="14">Órgano del MITECO. Inscribe los CAE en</text>
    <text x="40" y="503" fill="#2b3a2f" font-size="14">el Registro Nacional. Cada CAE equivale</text>
    <text x="40" y="524" fill="#2b3a2f" font-size="14">a 1 kWh de ahorro anual de energía final.</text>
  </g>
  <g>
    <rect x="374" y="416" width="326" height="124" rx="14" fill="#ffffff" stroke="#1a4d30" stroke-width="2"/>
    <circle cx="403" cy="445" r="15" fill="#1a4d30"/>
    <text x="403" y="450.5" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">6</text>
    <text x="430" y="451" fill="#1a4d30" font-family="'Source Serif 4', Georgia, serif" font-size="18" font-weight="700">Sujeto obligado</text>
    <text x="394" y="482" fill="#2b3a2f" font-size="14">Cumple con los CAE parte de su obligación</text>
    <text x="394" y="503" fill="#2b3a2f" font-size="14">anual de ahorro. Los liquida él o, en su</text>
    <text x="394" y="524" fill="#2b3a2f" font-size="14">nombre, el sujeto delegado.</text>
  </g>
  <line x1="350" y1="158" x2="361" y2="158" stroke="#22a044" stroke-width="3" stroke-linecap="round"/>
  <path d="M370,158 L361,152 L361,164 Z" fill="#22a044"/>
  <line x1="537" y1="221" x2="537" y2="240" stroke="#22a044" stroke-width="3" stroke-linecap="round"/>
  <path d="M537,249 L531,240 L543,240 Z" fill="#22a044"/>
  <line x1="370" y1="320" x2="359" y2="320" stroke="#22a044" stroke-width="3" stroke-linecap="round"/>
  <path d="M350,320 L359,314 L359,326 Z" fill="#22a044"/>
  <line x1="183" y1="383" x2="183" y2="402" stroke="#22a044" stroke-width="3" stroke-linecap="round"/>
  <path d="M183,411 L177,402 L189,402 Z" fill="#22a044"/>
  <line x1="350" y1="482" x2="361" y2="482" stroke="#22a044" stroke-width="3" stroke-linecap="round"/>
  <path d="M370,482 L361,476 L361,488 Z" fill="#22a044"/>
  <rect x="20" y="564" width="680" height="62" rx="10" fill="#e9f2ec"/>
  <text x="38" y="590" fill="#1a4d30" font-size="14.5"><tspan font-weight="700">Contrato de delegación:</tspan> el obligado puede encargar los ahorros a un sujeto delegado,</text>
  <text x="38" y="611" fill="#1a4d30" font-size="14.5">pero la obligación sigue siendo suya.</text>
</svg>
