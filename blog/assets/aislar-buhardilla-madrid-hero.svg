<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Aislar la buhardilla en Madrid: la zona climática depende de la altitud del municipio</title>
  <desc id="hero-desc">Esquema visual, no cartográfico, de la Comunidad de Madrid por bandas de altitud. De abajo arriba: la vega del Tajo, con Aranjuez, en una de las cotas más bajas de la Comunidad, con la zona de la capital, D3, o una menos fría según el tramo de altitud; la capital y la corona metropolitana, con Madrid, Alcalá de Henares, Móstoles y Getafe, en zona D3; el pie de sierra, con Colmenar Viejo y Collado Villalba, D3 o una zona más fría según su altitud; y la sierra de Guadarrama, con Guadarrama y Cercedilla, donde la tabla llega a la zona E1. Debajo, la regla: la tabla a-Anejo B del DB-HE asigna la zona por provincia y tramo de altitud. A la derecha, la sección de una vivienda con 220 milímetros de lana mineral insuflada sobre el suelo del desván no habitable y la nota de que la ficha RES022 del sistema CAE se aplica en las zonas C, D y E.</desc>

  <rect x="0" y="0" width="1600" height="1000" fill="#f5efe1"/>

  <!-- Título -->
  <text x="80" y="92" font-family="'Source Serif 4', Georgia, serif" font-size="54" font-weight="700" fill="#1a2e1f">Aislar la buhardilla en Madrid</text>
  <text x="80" y="140" font-family="'Source Sans 3', Arial, sans-serif" font-size="30" fill="#2d5a3d">La zona climática del CTE depende de la altitud del municipio (Anejo B del DB-HE)</text>

  <!-- Perfil del terreno: del sur (izquierda, vega del Tajo) a la sierra (derecha) -->
  <path d="M 80 880 L 80 760 C 240 760 300 740 420 700 C 540 660 600 620 760 560 C 880 520 930 440 1010 330 C 1050 280 1080 250 1120 240 L 1120 880 Z" fill="#22a044" opacity="0.18"/>
  <path d="M 80 880 L 80 790 C 260 790 330 770 460 735 C 600 700 680 650 820 590 C 920 545 980 470 1040 380 C 1070 335 1095 300 1120 290 L 1120 880 Z" fill="#22a044" opacity="0.28"/>
  <path d="M 80 880 L 80 820 C 280 820 380 800 520 770 C 660 740 760 690 880 630 C 960 590 1020 520 1070 450 C 1090 420 1105 400 1120 390 L 1120 880 Z" fill="#1a2e1f" opacity="0.55"/>
  <line x1="80" y1="880" x2="1120" y2="880" stroke="#1a2e1f" stroke-width="3"/>

  <!-- Bandas de altitud (líneas de referencia) -->
  <line x1="80" y1="700" x2="1120" y2="700" stroke="#b8733a" stroke-width="2" stroke-dasharray="10 8"/>
  <line x1="80" y1="520" x2="1120" y2="520" stroke="#b8733a" stroke-width="2" stroke-dasharray="10 8"/>
  <line x1="80" y1="340" x2="1120" y2="340" stroke="#b8733a" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- Banda 1: vega del Tajo -->
  <text x="100" y="748" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#1a2e1f">Vega del Tajo</text>
  <text x="100" y="786" font-family="'Source Sans 3', Arial, sans-serif" font-size="27" fill="#1a2e1f">Aranjuez · una de las cotas más bajas</text>
  <rect x="88" y="796" width="560" height="38" rx="8" fill="#f5efe1" opacity="0.92"/>
  <text x="100" y="822" font-family="'Source Sans 3', Arial, sans-serif" font-size="27" font-weight="700" fill="#b8733a">Zona de la capital, D3, o una menos fría</text>

  <!-- Banda 2: capital y corona metropolitana -->
  <text x="100" y="568" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#1a2e1f">Capital y corona metropolitana</text>
  <text x="100" y="606" font-family="'Source Sans 3', Arial, sans-serif" font-size="27" fill="#1a2e1f">Madrid · Alcalá de Henares · Móstoles · Getafe</text>
  <text x="100" y="642" font-family="'Source Sans 3', Arial, sans-serif" font-size="27" font-weight="700" fill="#b8733a">Zona D3</text>

  <!-- Banda 3: pie de sierra -->
  <text x="100" y="388" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#1a2e1f">Pie de sierra</text>
  <text x="100" y="426" font-family="'Source Sans 3', Arial, sans-serif" font-size="27" fill="#1a2e1f">Colmenar Viejo · Collado Villalba</text>
  <text x="100" y="462" font-family="'Source Sans 3', Arial, sans-serif" font-size="27" font-weight="700" fill="#b8733a">D3 o una zona más fría, según la altitud</text>

  <!-- Banda 4: sierra de Guadarrama -->
  <text x="100" y="212" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#1a2e1f">Sierra de Guadarrama</text>
  <text x="100" y="250" font-family="'Source Sans 3', Arial, sans-serif" font-size="27" fill="#1a2e1f">Guadarrama · Cercedilla</text>
  <text x="100" y="286" font-family="'Source Sans 3', Arial, sans-serif" font-size="27" font-weight="700" fill="#b8733a">La tabla llega a la E1</text>

  <!-- Regla del Anejo B -->
  <rect x="80" y="910" width="1040" height="60" rx="12" fill="#1a2e1f"/>
  <text x="600" y="949" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" fill="#f5efe1">Tabla a-Anejo B del DB-HE: la zona se asigna por provincia y tramo de altitud</text>

  <!-- Panel derecho: sección de la vivienda -->
  <rect x="1180" y="190" width="340" height="790" rx="18" fill="#ffffff" stroke="#22a044" stroke-width="3"/>
  <text x="1350" y="244" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#1a2e1f">Desván no habitable</text>

  <!-- Tejado -->
  <path d="M 1215 470 L 1350 330 L 1485 470 Z" fill="#b8733a"/>
  <path d="M 1232 470 L 1350 348 L 1468 470 Z" fill="#f5efe1"/>
  <!-- Capa de lana mineral sobre el forjado -->
  <rect x="1240" y="446" width="220" height="26" fill="#22a044"/>
  <rect x="1240" y="472" width="220" height="12" fill="#1a2e1f"/>
  <!-- Última planta -->
  <rect x="1240" y="484" width="220" height="110" fill="#ffffff" stroke="#1a2e1f" stroke-width="3"/>
  <rect x="1270" y="510" width="44" height="54" fill="#f5efe1" stroke="#1a2e1f" stroke-width="2"/>
  <rect x="1386" y="510" width="44" height="54" fill="#f5efe1" stroke="#1a2e1f" stroke-width="2"/>
  <!-- Planta inferior -->
  <rect x="1240" y="594" width="220" height="110" fill="#ffffff" stroke="#1a2e1f" stroke-width="3"/>
  <rect x="1270" y="620" width="44" height="54" fill="#f5efe1" stroke="#1a2e1f" stroke-width="2"/>
  <rect x="1386" y="620" width="44" height="54" fill="#f5efe1" stroke="#1a2e1f" stroke-width="2"/>
  <line x1="1215" y1="704" x2="1485" y2="704" stroke="#1a2e1f" stroke-width="4"/>

  <text x="1350" y="760" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="27" font-weight="700" fill="#22a044">220 mm de lana mineral</text>
  <text x="1350" y="796" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" fill="#1a2e1f">insuflada sobre el forjado</text>
  <text x="1350" y="852" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" fill="#1a2e1f">Ficha RES022 del CAE:</text>
  <text x="1350" y="886" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" fill="#1a2e1f">zonas climáticas C, D y E</text>
  <text x="1350" y="930" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="27" font-weight="700" fill="#b8733a">Toda la Comunidad</text>
  <text x="1350" y="964" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="27" font-weight="700" fill="#b8733a">de Madrid</text>
</svg>
