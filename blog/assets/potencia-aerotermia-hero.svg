<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Qué potencia de aerotermia necesito: los cuatro datos que la fijan y la diferencia entre kW de calor y kW eléctricos</title>
  <desc id="hero-desc">Infografía en dos partes. A la izquierda, cuatro tarjetas numeradas con los datos que fijan la potencia de calor de una bomba de calor aire-agua. Uno: la temperatura exterior de proyecto, la de tu municipio, que depende del clima y de la altitud y no es la mínima histórica. Dos: las pérdidas de la casa, por el aislamiento, las ventanas, las fugas de aire y la superficie; el certificado energético da una pista. Tres: la temperatura de impulsión que piden los emisores, suelo radiante o radiadores; cuanto más caliente sale el agua, menor es el COP. Cuatro: el agua caliente sanitaria, según las personas, sus hábitos y el tamaño del depósito, que la bomba también produce. A la derecha, un recuadro: los kW de calor son los kW eléctricos multiplicados por el COP; el COP baja con más frío y con el agua más caliente; una resistencia de apoyo da 1 kW de calor por cada kW eléctrico; y la potencia contratada suma los kW eléctricos que funcionan a la vez. Abajo: no hay una cifra por metro cuadrado; la potencia se calcula para cada casa y cada municipio.</desc>

  <rect width="1600" height="1000" fill="#f5efe1"/>
  <text x="800" y="94" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="54" font-weight="700" fill="#1a2e1f">¿Qué potencia de aerotermia necesito?</text>
  <text x="800" y="146" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="29" font-weight="600" fill="#22a044">Cuatro datos fijan los kW de calor; el COP los convierte en kW eléctricos</text>
  <line x1="60" y1="178" x2="1540" y2="178" stroke="#1a2e1f" stroke-opacity="0.18" stroke-width="2"/>

  <!-- 1. Temperatura exterior de proyecto -->
  <rect x="60" y="206" width="495" height="320" rx="18" fill="#ffffff" stroke="#22a044" stroke-width="3"/>
  <circle cx="116" cy="266" r="30" fill="#22a044"/>
  <text x="116" y="277" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#ffffff">1</text>
  <text x="180" y="262" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#1a2e1f">Temperatura exterior</text>
  <text x="180" y="300" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#1a2e1f">de proyecto</text>
  <text x="180" y="366" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" fill="#1a2e1f">La de tu municipio: depende</text>
  <text x="180" y="404" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" fill="#1a2e1f">del clima y de la altitud.</text>
  <text x="180" y="442" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" fill="#1a2e1f">No es la mínima histórica.</text>
  <rect x="104" y="334" width="24" height="128" rx="12" fill="#ffffff" stroke="#1a2e1f" stroke-width="3"/>
  <rect x="110" y="406" width="12" height="62" fill="#b8733a"/>
  <circle cx="116" cy="474" r="22" fill="#b8733a" stroke="#1a2e1f" stroke-width="3"/>
  <line x1="132" y1="356" x2="144" y2="356" stroke="#1a2e1f" stroke-width="2"/>
  <line x1="132" y1="382" x2="144" y2="382" stroke="#1a2e1f" stroke-width="2"/>
  <line x1="132" y1="408" x2="144" y2="408" stroke="#1a2e1f" stroke-width="2"/>
  <line x1="132" y1="434" x2="144" y2="434" stroke="#1a2e1f" stroke-width="2"/>

  <!-- 2. Pérdidas de la casa -->
  <rect x="585" y="206" width="495" height="320" rx="18" fill="#ffffff" stroke="#22a044" stroke-width="3"/>
  <circle cx="641" cy="266" r="30" fill="#22a044"/>
  <text x="641" y="277" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#ffffff">2</text>
  <text x="705" y="262" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#1a2e1f">Pérdidas</text>
  <text x="705" y="300" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#1a2e1f">de la casa</text>
  <text x="705" y="366" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" fill="#1a2e1f">Aislamiento, ventanas,</text>
  <text x="705" y="404" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" fill="#1a2e1f">fugas de aire y superficie.</text>
  <text x="705" y="442" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" fill="#1a2e1f">El certificado da una pista.</text>
  <line x1="621" y1="352" x2="621" y2="330" stroke="#b8733a" stroke-width="4" stroke-linecap="round"/>
  <polygon points="613,334 621,320 629,334" fill="#b8733a"/>
  <line x1="641" y1="340" x2="641" y2="318" stroke="#b8733a" stroke-width="4" stroke-linecap="round"/>
  <polygon points="633,322 641,308 649,322" fill="#b8733a"/>
  <line x1="661" y1="352" x2="661" y2="330" stroke="#b8733a" stroke-width="4" stroke-linecap="round"/>
  <polygon points="653,334 661,320 669,334" fill="#b8733a"/>
  <polygon points="599,404 641,360 683,404" fill="#1a2e1f"/>
  <rect x="609" y="404" width="64" height="78" fill="#ffffff" stroke="#1a2e1f" stroke-width="3"/>
  <rect x="631" y="444" width="20" height="38" fill="#22a044"/>

  <!-- 3. Temperatura de impulsión -->
  <rect x="60" y="556" width="495" height="320" rx="18" fill="#ffffff" stroke="#22a044" stroke-width="3"/>
  <circle cx="116" cy="616" r="30" fill="#22a044"/>
  <text x="116" y="627" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#ffffff">3</text>
  <text x="180" y="612" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#1a2e1f">Temperatura</text>
  <text x="180" y="650" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#1a2e1f">de impulsión</text>
  <text x="180" y="716" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" fill="#1a2e1f">La que piden tus emisores:</text>
  <text x="180" y="754" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" fill="#1a2e1f">suelo radiante o radiadores.</text>
  <text x="180" y="792" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" fill="#1a2e1f">Más caliente, menos COP.</text>
  <path d="M90 700 q 7 -8 0 -16 q -7 -8 0 -16" fill="none" stroke="#b8733a" stroke-width="4" stroke-linecap="round"/>
  <path d="M116 700 q 7 -8 0 -16 q -7 -8 0 -16" fill="none" stroke="#b8733a" stroke-width="4" stroke-linecap="round"/>
  <path d="M142 700 q 7 -8 0 -16 q -7 -8 0 -16" fill="none" stroke="#b8733a" stroke-width="4" stroke-linecap="round"/>
  <rect x="78" y="714" width="16" height="104" rx="7" fill="#ffffff" stroke="#1a2e1f" stroke-width="3"/>
  <rect x="98" y="714" width="16" height="104" rx="7" fill="#ffffff" stroke="#1a2e1f" stroke-width="3"/>
  <rect x="118" y="714" width="16" height="104" rx="7" fill="#ffffff" stroke="#1a2e1f" stroke-width="3"/>
  <rect x="138" y="714" width="16" height="104" rx="7" fill="#ffffff" stroke="#1a2e1f" stroke-width="3"/>
  <line x1="72" y1="830" x2="160" y2="830" stroke="#1a2e1f" stroke-width="4" stroke-linecap="round"/>

  <!-- 4. Agua caliente sanitaria -->
  <rect x="585" y="556" width="495" height="320" rx="18" fill="#ffffff" stroke="#22a044" stroke-width="3"/>
  <circle cx="641" cy="616" r="30" fill="#22a044"/>
  <text x="641" y="627" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#ffffff">4</text>
  <text x="705" y="612" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#1a2e1f">Agua caliente</text>
  <text x="705" y="650" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#1a2e1f">sanitaria (ACS)</text>
  <text x="705" y="716" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" fill="#1a2e1f">Personas, hábitos</text>
  <text x="705" y="754" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" fill="#1a2e1f">y tamaño del depósito.</text>
  <text x="705" y="792" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" fill="#1a2e1f">La bomba también la produce.</text>
  <line x1="641" y1="690" x2="641" y2="672" stroke="#1a2e1f" stroke-width="4" stroke-linecap="round"/>
  <line x1="641" y1="672" x2="671" y2="672" stroke="#1a2e1f" stroke-width="4" stroke-linecap="round"/>
  <rect x="611" y="690" width="60" height="140" rx="26" fill="#ffffff" stroke="#1a2e1f" stroke-width="3"/>
  <path d="M641 724 C641 724 625 748 625 760 A16 16 0 0 0 657 760 C657 748 641 724 641 724 Z" fill="#22a044"/>

  <!-- kW de calor y kW eléctricos -->
  <rect x="1110" y="206" width="430" height="670" rx="18" fill="#1a2e1f"/>
  <text x="1145" y="264" font-family="'Source Serif 4', Georgia, serif" font-size="34" font-weight="700" fill="#f5efe1">kW de calor</text>
  <text x="1145" y="306" font-family="'Source Serif 4', Georgia, serif" font-size="34" font-weight="700" fill="#f5efe1">y kW eléctricos</text>
  <line x1="1145" y1="334" x2="1505" y2="334" stroke="#22a044" stroke-width="3"/>
  <rect x="1145" y="356" width="360" height="122" rx="14" fill="#f5efe1"/>
  <text x="1325" y="406" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="30" font-weight="700" fill="#1a2e1f">kW de calor =</text>
  <text x="1325" y="452" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="30" font-weight="700" fill="#1a2e1f">kW eléctricos × COP</text>
  <text x="1145" y="530" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" fill="#f5efe1">El COP baja con más frío</text>
  <text x="1145" y="564" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" fill="#f5efe1">y con el agua más caliente.</text>
  <line x1="1145" y1="596" x2="1505" y2="596" stroke="#f5efe1" stroke-opacity="0.3" stroke-width="2"/>
  <text x="1145" y="638" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" font-weight="700" fill="#f5efe1">Resistencias de apoyo:</text>
  <text x="1145" y="672" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" fill="#f5efe1">1 kW eléctrico da 1 kW de calor.</text>
  <line x1="1145" y1="704" x2="1505" y2="704" stroke="#f5efe1" stroke-opacity="0.3" stroke-width="2"/>
  <text x="1145" y="746" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" font-weight="700" fill="#f5efe1">Potencia contratada:</text>
  <text x="1145" y="780" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" fill="#f5efe1">suma los kW eléctricos</text>
  <text x="1145" y="814" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" fill="#f5efe1">que funcionan a la vez.</text>

  <text x="800" y="944" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="28" font-weight="600" fill="#1a2e1f">No hay una cifra por m²: la potencia se calcula para tu casa y tu municipio</text>
</svg>
