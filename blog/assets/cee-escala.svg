<svg font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" width="820" height="600" viewBox="0 0 820 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cee-title cee-desc">
  <title id="cee-title">La escala del certificado de eficiencia energética, de la A a la G</title>
  <desc id="cee-desc">Escala de siete niveles del certificado de eficiencia energética. La letra A, en verde, corresponde a la vivienda más eficiente y con menos emisiones; la letra G, en rojo, a la menos eficiente. La calificación depende del consumo de energía primaria no renovable en kilovatios hora por metro cuadrado y año y de las emisiones de dióxido de carbono por metro cuadrado y año.</desc>

  <!-- Background -->
  <rect x="0" y="0" width="820" height="600" fill="#f7f7f5" rx="16"/>

  <!-- Header -->
  <text x="410" y="52" text-anchor="middle" font-family="Fraunces, serif" font-size="26" font-weight="700" fill="#1a4d30">La escala del certificado energ&#233;tico</text>
  <text x="410" y="82" text-anchor="middle" font-family="Manrope, sans-serif" font-size="15" fill="#5a6358">De la A (m&#225;s eficiente) a la G (menos eficiente)</text>

  <!-- Divider -->
  <line x1="90" y1="104" x2="730" y2="104" stroke="#d4d9d2" stroke-width="1"/>

  <!-- Bars -->
  <!-- A -->
  <rect x="110" y="130" width="150" height="40" rx="8" fill="#1a7a3c"/>
  <text x="132" y="156" font-family="Fraunces, serif" font-size="22" font-weight="700" fill="#ffffff">A</text>
  <text x="520" y="150" font-family="Manrope, sans-serif" font-size="14" font-weight="600" fill="#1a4d30">M&#225;s eficiente &#183; menor consumo</text>

  <!-- B -->
  <rect x="110" y="188" width="190" height="40" rx="8" fill="#4faa46"/>
  <text x="132" y="214" font-family="Fraunces, serif" font-size="22" font-weight="700" fill="#ffffff">B</text>

  <!-- C -->
  <rect x="110" y="246" width="230" height="40" rx="8" fill="#a2c516"/>
  <text x="132" y="272" font-family="Fraunces, serif" font-size="22" font-weight="700" fill="#ffffff">C</text>

  <!-- D -->
  <rect x="110" y="304" width="270" height="40" rx="8" fill="#f6d100"/>
  <text x="132" y="330" font-family="Fraunces, serif" font-size="22" font-weight="700" fill="#3a3320">D</text>

  <!-- E -->
  <rect x="110" y="362" width="310" height="40" rx="8" fill="#f39200"/>
  <text x="132" y="388" font-family="Fraunces, serif" font-size="22" font-weight="700" fill="#ffffff">E</text>

  <!-- F -->
  <rect x="110" y="420" width="350" height="40" rx="8" fill="#ea6b1f"/>
  <text x="132" y="446" font-family="Fraunces, serif" font-size="22" font-weight="700" fill="#ffffff">F</text>

  <!-- G -->
  <rect x="110" y="478" width="390" height="40" rx="8" fill="#e30613"/>
  <text x="132" y="504" font-family="Fraunces, serif" font-size="22" font-weight="700" fill="#ffffff">G</text>
  <text x="520" y="502" font-family="Manrope, sans-serif" font-size="14" font-weight="600" fill="#b3260f">Menos eficiente &#183; mayor consumo</text>

  <!-- Footer note -->
  <text x="110" y="556" font-family="Manrope, sans-serif" font-size="13" fill="#5a6358">Dos indicadores: consumo de energ&#237;a primaria no renovable (kWh/m&#178;&#183;a&#241;o)</text>
  <text x="110" y="576" font-family="Manrope, sans-serif" font-size="13" fill="#5a6358">y emisiones de CO&#8322; (kg CO&#8322;/m&#178;&#183;a&#241;o).</text>
</svg>
