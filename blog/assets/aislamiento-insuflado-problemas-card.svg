<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="insc-title insc-desc" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif">
  <title id="insc-title">Problemas del aislamiento insuflado y cómo evitarlos</title>
  <desc id="insc-desc">Sección de una vivienda con lana mineral soplada sobre el suelo del desván, regla de espesor, deflectores en los aleros, trampilla aislada y separación alrededor de un conducto de humos.</desc>

  <defs>
    <marker id="insc-ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22a044"/>
    </marker>
  </defs>

  <!-- ===== FONDO + ESCENARIO ===== -->
  <rect width="640" height="420" fill="#f7f7f5"/>
  <circle cx="320" cy="180" r="150" fill="#e9f2ec"/>

  <g transform="translate(-16.4,-23.8) scale(0.56)">
    <!-- ===== VIVIENDA (planta bajo el desván) ===== -->
    <rect x="240" y="430" width="720" height="130" fill="#ffffff" stroke="#1a4d30" stroke-width="4" stroke-linejoin="round"/>

    <!-- ===== MANTA DE LANA SOPLADA SOBRE EL FORJADO ===== -->
    <path d="M256,428 L256,411.6 L294.6,385 Q345.5,377 396.4,385 Q447.3,377 498.2,385 Q549.1,377 600,385 Q650.9,377 701.8,385 Q752.7,377 803.6,385 Q854.5,377 905.4,385 L944,411.6 L944,428 Z" fill="#a8c4b0" stroke="#1a4d30" stroke-width="2.5" stroke-linejoin="round"/>
    <g fill="#1a4d30" opacity="0.22">
      <circle cx="300" cy="410" r="2.6"/><circle cx="332" cy="398" r="2.2"/><circle cx="360" cy="414" r="2.6"/>
      <circle cx="438" cy="402" r="2.4"/><circle cx="470" cy="416" r="2.2"/><circle cx="512" cy="398" r="2.6"/>
      <circle cx="548" cy="414" r="2.2"/><circle cx="578" cy="400" r="2.4"/><circle cx="700" cy="410" r="2.6"/>
      <circle cx="730" cy="396" r="2.2"/><circle cx="764" cy="414" r="2.4"/><circle cx="790" cy="400" r="2.2"/>
      <circle cx="866" cy="412" r="2.6"/><circle cx="896" cy="398" r="2.2"/><circle cx="920" cy="414" r="2.4"/>
    </g>

    <!-- ===== TRAMPILLA: cerco rígido + tapa con panel aislante ===== -->
    <rect x="620" y="373" width="70" height="55" fill="#e9f2ec"/>
    <g stroke="#1a4d30" stroke-linejoin="round">
      <rect x="614" y="378" width="6" height="52" fill="#ffffff" stroke-width="2.5"/>
      <rect x="690" y="378" width="6" height="52" fill="#ffffff" stroke-width="2.5"/>
      <rect x="626" y="404" width="58" height="20" rx="3" fill="#a8c4b0" stroke-width="2.5"/>
      <rect x="622" y="424" width="66" height="8" fill="#ffffff" stroke-width="2.5"/>
    </g>

    <!-- ===== FOCO EMPOTRADO CON PROTECCIÓN ===== -->
    <g stroke="#1a4d30" stroke-linejoin="round" stroke-linecap="round">
      <path d="M482,429 L482,412 Q500,398 518,412 L518,429 Z" fill="#ffffff" stroke-width="2.5"/>
      <path d="M490,432 L510,432 L506,440 L494,440 Z" fill="#ffffff" stroke-width="2.5"/>
    </g>
    <g stroke="#a8c4b0" stroke-width="3" stroke-linecap="round">
      <line x1="500" y1="448" x2="500" y2="460"/>
      <line x1="486" y1="446" x2="480" y2="456"/>
      <line x1="514" y1="446" x2="520" y2="456"/>
    </g>

    <!-- ===== CONDUCTO DE HUMOS: cerco y separación sin lana ===== -->
    <rect x="802" y="373" width="36" height="55" fill="#e9f2ec"/>
    <g stroke="#1a4d30" stroke-linejoin="round">
      <rect x="796" y="378" width="6" height="52" fill="#ffffff" stroke-width="2.5"/>
      <rect x="838" y="378" width="6" height="52" fill="#ffffff" stroke-width="2.5"/>
      <rect x="790" y="505" width="60" height="55" rx="6" fill="#ffffff" stroke-width="3.5"/>
      <rect x="810" y="268" width="20" height="237" fill="#ffffff" stroke-width="3.5"/>
      <rect x="805" y="258" width="30" height="10" rx="2" fill="#ffffff" stroke-width="3"/>
    </g>
    <rect x="802" y="522" width="36" height="22" rx="4" fill="#a8c4b0"/>

    <!-- ===== REGLA GRADUADA DE ESPESOR ===== -->
    <g stroke="#1a4d30" stroke-linecap="round">
      <rect x="394" y="338" width="14" height="92" fill="#ffffff" stroke-width="2.5"/>
      <g stroke-width="2">
        <line x1="394" y1="350" x2="401" y2="350"/>
        <line x1="394" y1="360" x2="404" y2="360"/>
        <line x1="394" y1="370" x2="401" y2="370"/>
        <line x1="394" y1="380" x2="404" y2="380"/>
        <line x1="394" y1="390" x2="401" y2="390"/>
        <line x1="394" y1="400" x2="404" y2="400"/>
        <line x1="394" y1="410" x2="401" y2="410"/>
        <line x1="394" y1="420" x2="404" y2="420"/>
      </g>
    </g>
    <line x1="384" y1="385" x2="418" y2="385" stroke="#22a044" stroke-width="4" stroke-linecap="round"/>

    <!-- ===== DEFLECTORES EN LOS ALEROS ===== -->
    <g stroke="#1a4d30" stroke-width="5" stroke-linecap="round">
      <line x1="256" y1="411.6" x2="322" y2="366"/>
      <line x1="944" y1="411.6" x2="878" y2="366"/>
    </g>

    <!-- ===== VENTILACIÓN: entra por los aleros, sale por la cumbrera ===== -->
    <g fill="none" stroke="#22a044" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M132,452 Q196,446 232,414.5 L322,353 L356,330" marker-end="url(#insc-ah)"/>
      <path d="M1068,452 Q1004,446 968,414.5 L878,353 L844,330" marker-end="url(#insc-ah)"/>
      <path d="M600,214 L600,104" marker-end="url(#insc-ah)"/>
    </g>

    <!-- ===== TEJADO ===== -->
    <path d="M180,440 L600,150 L1020,440" fill="none" stroke="#1a4d30" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- ===== SUELO ===== -->
    <line x1="160" y1="562" x2="1040" y2="562" stroke="#a8c4b0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ===== ETIQUETA ===== -->
  <line x1="306" y1="344" x2="334" y2="344" stroke="#22a044" stroke-width="4" stroke-linecap="round"/>
  <text x="320" y="378" fill="#1a4d30" font-size="26" font-weight="700" letter-spacing="5" text-anchor="middle">INSUFLADO</text>
</svg>
