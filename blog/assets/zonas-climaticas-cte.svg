<svg font-family="'Source Sans 3', Arial, sans-serif" width="800" height="520" viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="zc-title zc-desc">
  <title id="zc-title">Zonas climáticas del CTE y elegibilidad del aislamiento por el sistema CAE</title>
  <desc id="zc-desc">Escala de las seis zonas climáticas de invierno del Código Técnico de la Edificación, ordenadas de la más suave a la más rigurosa: alfa, A, B, C, D y E. Las zonas alfa, A y B aparecen en gris y no son elegibles para el aislamiento por el sistema CAE. Las zonas C, D y E aparecen en verde y sí son elegibles.</desc>

  <!-- Background panel -->
  <rect x="0" y="0" width="800" height="520" fill="#f7f7f5" rx="16"/>

  <!-- Title -->
  <text x="400" y="48" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="21" font-weight="700" fill="#1a4d30">Zonas clim&#225;ticas del CTE y elegibilidad del aislamiento</text>
  <text x="400" y="72" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="13" fill="#5a6358">La letra indica la severidad del invierno &#183; de la m&#225;s suave a la m&#225;s rigurosa</text>

  <!-- Gradient axis -->
  <line x1="60" y1="106" x2="740" y2="106" stroke="#d4d9d2" stroke-width="1.5"/>
  <text x="60" y="96" text-anchor="start" font-family="'Source Sans 3', Arial, sans-serif" font-size="11" fill="#9a9388">Invierno suave</text>
  <text x="740" y="96" text-anchor="end" font-family="'Source Sans 3', Arial, sans-serif" font-size="11" fill="#1a4d30">Invierno riguroso</text>

  <!-- Zone alfa -->
  <rect x="60" y="130" width="100" height="110" rx="10" fill="#e6e4df" stroke="#d4d9d2" stroke-width="1"/>
  <text x="110" y="196" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="38" font-weight="700" fill="#9a9388">&#945;</text>
  <text x="110" y="222" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="11" fill="#9a9388">muy suave</text>

  <!-- Zone A -->
  <rect x="176" y="130" width="100" height="110" rx="10" fill="#e6e4df" stroke="#d4d9d2" stroke-width="1"/>
  <text x="226" y="196" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="38" font-weight="700" fill="#9a9388">A</text>
  <text x="226" y="222" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="11" fill="#9a9388">suave</text>

  <!-- Zone B -->
  <rect x="292" y="130" width="100" height="110" rx="10" fill="#e6e4df" stroke="#d4d9d2" stroke-width="1"/>
  <text x="342" y="196" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="38" font-weight="700" fill="#9a9388">B</text>
  <text x="342" y="222" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="11" fill="#9a9388">templado</text>

  <!-- Zone C -->
  <rect x="408" y="130" width="100" height="110" rx="10" fill="#3f7a53"/>
  <text x="458" y="196" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="38" font-weight="700" fill="#ffffff">C</text>
  <text x="458" y="222" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="11" fill="#c9e4d2">fr&#237;o moderado</text>

  <!-- Zone D -->
  <rect x="524" y="130" width="100" height="110" rx="10" fill="#2d5a3d"/>
  <text x="574" y="196" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="38" font-weight="700" fill="#ffffff">D</text>
  <text x="574" y="222" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="11" fill="#c9e4d2">fr&#237;o</text>

  <!-- Zone E -->
  <rect x="640" y="130" width="100" height="110" rx="10" fill="#1a4d30"/>
  <text x="690" y="196" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="38" font-weight="700" fill="#ffffff">E</text>
  <text x="690" y="222" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="11" fill="#c9e4d2">muy fr&#237;o</text>

  <!-- Eligibility brackets -->
  <rect x="60" y="266" width="332" height="38" rx="9" fill="#e6e4df" stroke="#d4d9d2" stroke-width="1"/>
  <text x="226" y="291" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="600" fill="#7d766b">Aislamiento NO elegible</text>

  <rect x="408" y="266" width="332" height="38" rx="9" fill="#2d5a3d"/>
  <text x="574" y="291" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Aislamiento elegible con el CAE</text>

  <!-- Explanatory lines -->
  <text x="400" y="352" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" fill="#2d3a32">El aislamiento de desv&#225;n y de cubierta inclinada solo entra en el cat&#225;logo</text>
  <text x="400" y="374" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" fill="#2d3a32">del Real Decreto 36/2023 en las zonas <tspan font-weight="600" fill="#1a4d30">C, D y E</tspan>.</text>

  <text x="400" y="418" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" fill="#2d3a32">Las <tspan font-weight="600" fill="#1a4d30">13 provincias</tspan> del norte y del centro de España en las que intervenimos</text>
  <text x="400" y="440" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="14" fill="#2d3a32">se sit&#250;an todas en zona C, D o E.</text>

  <text x="400" y="486" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="11" fill="#9a9388">El n&#250;mero que acompa&#241;a a la letra (D1, D2&#8230;) indica la severidad del verano &#183; la zona exacta depende del municipio y de su altitud</text>
</svg>
