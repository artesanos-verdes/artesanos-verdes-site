<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Curva de calefacción de la aerotermia: el efecto de la pendiente y del desplazamiento</title>
  <desc id="hero-desc">Infografía con dos gráficos esquemáticos, sin cifras de ningún fabricante, de la temperatura del agua de impulsión frente a la temperatura exterior, de templado a frío. A la izquierda, la pendiente: las dos curvas salen del mismo punto los días templados y se separan cuanto más frío hace; la curva con más pendiente llega a agua más caliente. A la derecha, el desplazamiento: la curva desplazada queda por encima de la inicial en la misma medida con cualquier tiempo. Líneas de referencia de la ficha CAE: W35 para suelo radiante, W45 para radiadores de baja temperatura o fancoils y W55 para radiadores. Mensaje final: busca la curva más baja que mantenga tu casa a la temperatura que quieres.</desc>

  <rect width="1600" height="1000" fill="#f5efe1"/>
  <text x="800" y="92" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="54" font-weight="700" fill="#1a2e1f">La curva de calefacción de la aerotermia</text>
  <text x="800" y="142" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="29" font-weight="600" fill="#22a044">Más frío fuera, agua más caliente hacia los radiadores o el suelo radiante</text>
  <line x1="60" y1="172" x2="1540" y2="172" stroke="#1a2e1f" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Panel A: pendiente -->
  <rect x="60" y="200" width="720" height="650" rx="18" fill="#ffffff" stroke="#22a044" stroke-width="3"/>
  <text x="100" y="256" font-family="'Source Serif 4', Georgia, serif" font-size="38" font-weight="700" fill="#1a2e1f">Pendiente</text>
  <text x="100" y="294" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f">Cuánto sube el agua por cada grado que baja fuera</text>

  <line x1="200" y1="420" x2="740" y2="420" stroke="#1a2e1f" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="10 8"/>
  <line x1="200" y1="530" x2="740" y2="530" stroke="#1a2e1f" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="10 8"/>
  <line x1="200" y1="640" x2="740" y2="640" stroke="#1a2e1f" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="188" y="428" text-anchor="end" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" font-weight="700" fill="#1a2e1f">W55</text>
  <text x="188" y="538" text-anchor="end" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" font-weight="700" fill="#1a2e1f">W45</text>
  <text x="188" y="648" text-anchor="end" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" font-weight="700" fill="#1a2e1f">W35</text>

  <line x1="200" y1="740" x2="200" y2="346" stroke="#1a2e1f" stroke-width="3"/>
  <polygon points="192,348 200,330 208,348" fill="#1a2e1f"/>
  <line x1="200" y1="740" x2="734" y2="740" stroke="#1a2e1f" stroke-width="3"/>
  <polygon points="732,732 750,740 732,748" fill="#1a2e1f"/>
  <text x="112" y="535" text-anchor="middle" transform="rotate(-90 112 535)" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" fill="#1a2e1f">Agua de impulsión</text>
  <text x="210" y="774" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" fill="#1a2e1f">Templado</text>
  <text x="470" y="774" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" font-weight="700" fill="#1a2e1f">Temperatura exterior</text>
  <text x="740" y="774" text-anchor="end" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" fill="#1a2e1f">Frío</text>

  <line x1="300" y1="364" x2="344" y2="364" stroke="#22a044" stroke-width="6" stroke-linecap="round"/>
  <text x="354" y="372" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" fill="#1a2e1f">Curva inicial</text>
  <line x1="520" y1="364" x2="564" y2="364" stroke="#b8733a" stroke-width="6" stroke-linecap="round"/>
  <text x="574" y="372" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" fill="#1a2e1f">Más pendiente</text>

  <path d="M240 700 Q 450 590 720 530" fill="none" stroke="#22a044" stroke-width="6" stroke-linecap="round"/>
  <path d="M240 700 Q 430 560 720 420" fill="none" stroke="#b8733a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="240" cy="700" r="9" fill="#1a2e1f"/>
  <circle cx="720" cy="530" r="9" fill="#22a044"/>
  <circle cx="720" cy="420" r="9" fill="#b8733a"/>
  <line x1="754" y1="518" x2="754" y2="446" stroke="#b8733a" stroke-width="4" stroke-linecap="round"/>
  <polygon points="746,448 754,432 762,448" fill="#b8733a"/>
  <text x="420" y="822" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" font-weight="700" fill="#b8733a">La diferencia crece cuanto más frío hace</text>

  <!-- Panel B: desplazamiento -->
  <rect x="820" y="200" width="720" height="650" rx="18" fill="#ffffff" stroke="#22a044" stroke-width="3"/>
  <text x="860" y="256" font-family="'Source Serif 4', Georgia, serif" font-size="38" font-weight="700" fill="#1a2e1f">Desplazamiento</text>
  <text x="860" y="294" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f">Mueve toda la curva hacia arriba o hacia abajo</text>

  <line x1="960" y1="420" x2="1500" y2="420" stroke="#1a2e1f" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="10 8"/>
  <line x1="960" y1="530" x2="1500" y2="530" stroke="#1a2e1f" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="10 8"/>
  <line x1="960" y1="640" x2="1500" y2="640" stroke="#1a2e1f" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="948" y="428" text-anchor="end" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" font-weight="700" fill="#1a2e1f">W55</text>
  <text x="948" y="538" text-anchor="end" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" font-weight="700" fill="#1a2e1f">W45</text>
  <text x="948" y="648" text-anchor="end" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" font-weight="700" fill="#1a2e1f">W35</text>

  <line x1="960" y1="740" x2="960" y2="346" stroke="#1a2e1f" stroke-width="3"/>
  <polygon points="952,348 960,330 968,348" fill="#1a2e1f"/>
  <line x1="960" y1="740" x2="1494" y2="740" stroke="#1a2e1f" stroke-width="3"/>
  <polygon points="1492,732 1510,740 1492,748" fill="#1a2e1f"/>
  <text x="872" y="535" text-anchor="middle" transform="rotate(-90 872 535)" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" fill="#1a2e1f">Agua de impulsión</text>
  <text x="970" y="774" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" fill="#1a2e1f">Templado</text>
  <text x="1230" y="774" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" font-weight="700" fill="#1a2e1f">Temperatura exterior</text>
  <text x="1500" y="774" text-anchor="end" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" fill="#1a2e1f">Frío</text>

  <line x1="1060" y1="364" x2="1104" y2="364" stroke="#22a044" stroke-width="6" stroke-linecap="round"/>
  <text x="1114" y="372" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" fill="#1a2e1f">Curva inicial</text>
  <line x1="1280" y1="364" x2="1324" y2="364" stroke="#b8733a" stroke-width="6" stroke-linecap="round"/>
  <text x="1334" y="372" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" fill="#1a2e1f">Desplazada</text>

  <path d="M1000 700 Q 1210 590 1480 530" fill="none" stroke="#22a044" stroke-width="6" stroke-linecap="round"/>
  <path d="M1000 630 Q 1210 520 1480 460" fill="none" stroke="#b8733a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="1000" cy="700" r="9" fill="#22a044"/>
  <circle cx="1480" cy="530" r="9" fill="#22a044"/>
  <circle cx="1000" cy="630" r="9" fill="#b8733a"/>
  <circle cx="1480" cy="460" r="9" fill="#b8733a"/>
  <line x1="1086" y1="646" x2="1086" y2="608" stroke="#b8733a" stroke-width="4" stroke-linecap="round"/>
  <polygon points="1078,610 1086,594 1094,610" fill="#b8733a"/>
  <line x1="1374" y1="544" x2="1374" y2="506" stroke="#b8733a" stroke-width="4" stroke-linecap="round"/>
  <polygon points="1366,508 1374,492 1382,508" fill="#b8733a"/>
  <text x="1180" y="822" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" font-weight="700" fill="#b8733a">El mismo cambio, haga el tiempo que haga</text>

  <!-- Referencias y mensaje -->
  <text x="800" y="896" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f">Referencias de la ficha CAE: W35 suelo radiante · W45 radiadores de baja temperatura o fancoils · W55 radiadores</text>
  <text x="800" y="948" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="28" font-weight="600" fill="#1a2e1f">Busca la curva más baja que mantenga tu casa a la temperatura que quieres</text>
</svg>
