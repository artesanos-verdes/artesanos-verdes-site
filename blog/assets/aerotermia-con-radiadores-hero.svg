<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="rad-title rad-desc" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif">
  <title id="rad-title">Aerotermia con radiadores</title>
  <desc id="rad-desc">Unidad exterior de aerotermia conectada por la ida y el retorno a un radiador de agua, con ondas de calor y un termómetro que marca la referencia de 55 grados.</desc>

  <!-- ===== FONDO + ESCENARIO ===== -->
  <rect width="640" height="420" fill="#f7f7f5"/>
  <circle cx="320" cy="180" r="150" fill="#e9f2ec"/>

  <!-- ===== PARED INTERIOR (detrás del radiador) ===== -->
  <line x1="280" y1="120" x2="280" y2="300" stroke="#a8c4b0" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 10"/>

  <!-- ===== TUBERÍAS: IDA (verde) Y RETORNO ===== -->
  <path d="M236,214 L268,214 C280,214 284,206 296,198 L304,198" fill="none" stroke="#1a4d30" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M236,214 L268,214 C280,214 284,206 296,198 L304,198" fill="none" stroke="#22a044" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M236,256 L268,256 C280,256 284,266 296,272 L304,272" fill="none" stroke="#1a4d30" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M236,256 L268,256 C280,256 284,266 296,272 L304,272" fill="none" stroke="#a8c4b0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== UNIDAD EXTERIOR ===== -->
  <rect x="100" y="188" width="136" height="100" rx="13" fill="#ffffff" stroke="#1a4d30" stroke-width="4"/>
  <g stroke="#a8c4b0" stroke-width="4.5" stroke-linecap="round">
    <line x1="114" y1="214" x2="142" y2="214"/>
    <line x1="114" y1="228" x2="142" y2="228"/>
    <line x1="114" y1="242" x2="142" y2="242"/>
    <line x1="114" y1="256" x2="142" y2="256"/>
  </g>
  <circle cx="190" cy="238" r="34" fill="#f7f7f5" stroke="#1a4d30" stroke-width="3"/>
  <g transform="translate(190,238)" fill="#a8c4b0" stroke="#1a4d30" stroke-width="1.5" stroke-linejoin="round">
    <path d="M0,0 C5,-9 2,-21 -5,-27 C1,-17 -2,-8 0,0 Z" transform="rotate(10)"/>
    <path d="M0,0 C5,-9 2,-21 -5,-27 C1,-17 -2,-8 0,0 Z" transform="rotate(130)"/>
    <path d="M0,0 C5,-9 2,-21 -5,-27 C1,-17 -2,-8 0,0 Z" transform="rotate(250)"/>
  </g>
  <circle cx="190" cy="238" r="6" fill="#22a044" stroke="#1a4d30" stroke-width="1.5"/>
  <g stroke="#1a4d30" stroke-width="5" stroke-linecap="round">
    <line x1="122" y1="288" x2="122" y2="300"/>
    <line x1="214" y1="288" x2="214" y2="300"/>
  </g>

  <!-- ===== RADIADOR DE ELEMENTOS ===== -->
  <g fill="#ffffff" stroke="#1a4d30" stroke-width="3.5" stroke-linejoin="round">
    <rect x="304" y="182" width="22" height="104" rx="9"/>
    <rect x="330" y="182" width="22" height="104" rx="9"/>
    <rect x="356" y="182" width="22" height="104" rx="9"/>
    <rect x="382" y="182" width="22" height="104" rx="9"/>
    <rect x="408" y="182" width="22" height="104" rx="9"/>
    <rect x="434" y="182" width="22" height="104" rx="9"/>
  </g>
  <g stroke="#a8c4b0" stroke-width="3" stroke-linecap="round">
    <line x1="315" y1="196" x2="315" y2="272"/>
    <line x1="341" y1="196" x2="341" y2="272"/>
    <line x1="367" y1="196" x2="367" y2="272"/>
    <line x1="393" y1="196" x2="393" y2="272"/>
    <line x1="419" y1="196" x2="419" y2="272"/>
    <line x1="445" y1="196" x2="445" y2="272"/>
  </g>
  <!-- válvula termostática -->
  <rect x="458" y="190" width="12" height="16" rx="3" fill="#a8c4b0" stroke="#1a4d30" stroke-width="2.5"/>
  <!-- patas -->
  <g stroke="#1a4d30" stroke-width="5" stroke-linecap="round">
    <line x1="318" y1="286" x2="318" y2="300"/>
    <line x1="442" y1="286" x2="442" y2="300"/>
  </g>

  <!-- ===== ONDAS DE CALOR ===== -->
  <g fill="none" stroke-linecap="round">
    <path d="M350,166 q10,-12 0,-24 q-10,-12 0,-24" stroke="#a8c4b0" stroke-width="3.5"/>
    <path d="M380,164 q11,-13 0,-26 q-11,-13 0,-26" stroke="#22a044" stroke-width="4"/>
    <path d="M410,166 q10,-12 0,-24 q-10,-12 0,-24" stroke="#a8c4b0" stroke-width="3.5"/>
  </g>

  <!-- ===== TERMÓMETRO (referencia 55 °C) ===== -->
  <rect x="506" y="122" width="20" height="150" rx="10" fill="#ffffff" stroke="#1a4d30" stroke-width="3.5"/>
  <rect x="512" y="196" width="8" height="84" rx="4" fill="#22a044"/>
  <circle cx="516" cy="286" r="18" fill="#22a044" stroke="#1a4d30" stroke-width="3.5"/>
  <g stroke="#1a4d30" stroke-width="2.5" stroke-linecap="round">
    <line x1="526" y1="146" x2="534" y2="146"/>
    <line x1="526" y1="171" x2="534" y2="171"/>
    <line x1="526" y1="221" x2="534" y2="221"/>
    <line x1="526" y1="246" x2="534" y2="246"/>
  </g>
  <line x1="526" y1="196" x2="540" y2="196" stroke="#22a044" stroke-width="3.5" stroke-linecap="round"/>
  <text x="546" y="203" fill="#1a4d30" font-size="20" font-weight="700">55&#160;°C</text>

  <!-- ===== SUELO ===== -->
  <line x1="84" y1="300" x2="556" y2="300" stroke="#a8c4b0" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== ETIQUETA ===== -->
  <line x1="306" y1="344" x2="334" y2="344" stroke="#22a044" stroke-width="4" stroke-linecap="round"/>
  <text x="320" y="378" fill="#1a4d30" font-size="26" font-weight="700" letter-spacing="5" text-anchor="middle">RADIADORES</text>
</svg>
