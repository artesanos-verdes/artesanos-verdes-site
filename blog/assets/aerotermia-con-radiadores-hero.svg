<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Aerotermia con radiadores: la temperatura del agua decide</title>
  <desc id="hero-desc">Infografía en dos partes. A la izquierda, la potencia de un mismo radiador según la temperatura del agua, con la habitación a 20 °C: con agua a 75/65 °C, las condiciones de catálogo de la norma UNE-EN 442, da el 100 %; a 65/55 °C, en torno al 75 %; a 55/45 °C, en torno al 51 %. Es un cálculo propio con un exponente de 1,3; el exponente real depende del modelo. A la derecha, la temperatura de impulsión a la que la ficha RES060_FM del sistema CAE toma el SCOP del fabricante: W35 con suelo radiante, W45 con radiadores de baja temperatura o fancoils y W55 con radiadores. Debajo, las tres salidas si los radiadores no llegan: cambiar los que limitan, aislar la casa o una bomba de calor de alta temperatura.</desc>

  <!-- Fondo -->
  <rect width="1600" height="1000" fill="#f5efe1"/>

  <!-- Título -->
  <text x="800" y="92" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="48" font-weight="700" fill="#1a2e1f">Aerotermia con radiadores: la temperatura del agua decide</text>
  <text x="800" y="142" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="30" fill="#158035">Potencia de un mismo radiador y temperatura de cálculo del CAE</text>
  <line x1="80" y1="174" x2="1520" y2="174" stroke="#c1d9cc" stroke-width="2"/>

  <!-- Panel izquierdo: potencia del radiador -->
  <rect x="80" y="204" width="820" height="672" rx="18" fill="#ffffff" stroke="#22a044" stroke-width="3"/>
  <text x="120" y="262" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#1a2e1f">Un mismo radiador, agua menos caliente</text>
  <text x="120" y="300" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f">Potencia respecto a la de catálogo</text>

  <!-- Fila 1: 75/65 °C -->
  <text x="120" y="368" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" font-weight="700" fill="#1a2e1f">Agua a 75/65 °C · condiciones de catálogo</text>
  <rect x="120" y="384" width="560" height="56" rx="10" fill="#1a2e1f"/>
  <text x="698" y="424" font-family="'Source Serif 4', Georgia, serif" font-size="34" font-weight="700" fill="#1a2e1f">100 %</text>

  <!-- Fila 2: 65/55 °C -->
  <text x="120" y="502" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" font-weight="700" fill="#1a2e1f">Agua a 65/55 °C</text>
  <rect x="120" y="518" width="420" height="56" rx="10" fill="#22a044"/>
  <text x="558" y="558" font-family="'Source Serif 4', Georgia, serif" font-size="34" font-weight="700" fill="#1a2e1f">≈ 75 %</text>

  <!-- Fila 3: 55/45 °C -->
  <text x="120" y="636" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" font-weight="700" fill="#1a2e1f">Agua a 55/45 °C</text>
  <rect x="120" y="652" width="286" height="56" rx="10" fill="#b8733a"/>
  <text x="424" y="692" font-family="'Source Serif 4', Georgia, serif" font-size="34" font-weight="700" fill="#1a2e1f">≈ 51 %</text>

  <!-- Nota del panel izquierdo -->
  <line x1="120" y1="742" x2="860" y2="742" stroke="#c1d9cc" stroke-width="2"/>
  <text x="120" y="786" font-family="'Source Sans 3', Arial, sans-serif" font-size="23" fill="#1a2e1f">Habitación a 20 °C · curva de la norma UNE-EN 442</text>
  <text x="120" y="820" font-family="'Source Sans 3', Arial, sans-serif" font-size="23" fill="#1a2e1f">Cálculo propio con un exponente de 1,3</text>
  <text x="120" y="854" font-family="'Source Sans 3', Arial, sans-serif" font-size="23" fill="#1a2e1f">El exponente real depende del modelo</text>

  <!-- Panel derecho: temperatura de cálculo del CAE -->
  <rect x="940" y="204" width="580" height="672" rx="18" fill="#1a2e1f"/>
  <text x="980" y="262" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#f5efe1">Temperatura de cálculo del CAE</text>
  <text x="980" y="300" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#f5efe1">Ficha RES060_FM, anexo I</text>

  <!-- W35 -->
  <rect x="980" y="344" width="150" height="72" rx="36" fill="#22a044"/>
  <text x="1055" y="393" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="36" font-weight="700" fill="#ffffff">W35</text>
  <text x="1156" y="390" font-family="'Source Sans 3', Arial, sans-serif" font-size="28" fill="#f5efe1">Suelo radiante</text>

  <!-- W45 -->
  <rect x="980" y="470" width="150" height="72" rx="36" fill="#22a044"/>
  <text x="1055" y="519" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="36" font-weight="700" fill="#ffffff">W45</text>
  <text x="1156" y="500" font-family="'Source Sans 3', Arial, sans-serif" font-size="28" fill="#f5efe1">Radiadores de baja</text>
  <text x="1156" y="536" font-family="'Source Sans 3', Arial, sans-serif" font-size="28" fill="#f5efe1">temperatura o fancoils</text>

  <!-- W55 -->
  <rect x="980" y="596" width="150" height="72" rx="36" fill="#b8733a"/>
  <text x="1055" y="645" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="36" font-weight="700" fill="#ffffff">W55</text>
  <text x="1156" y="642" font-family="'Source Sans 3', Arial, sans-serif" font-size="28" fill="#f5efe1">Radiadores</text>

  <!-- Nota del panel derecho -->
  <line x1="980" y1="716" x2="1480" y2="716" stroke="#f5efe1" stroke-opacity="0.3" stroke-width="2"/>
  <text x="980" y="764" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#f5efe1">Cuenta el SCOP del fabricante</text>
  <text x="980" y="798" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#f5efe1">a la temperatura de impulsión</text>
  <text x="980" y="832" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#f5efe1">que necesitan tus emisores</text>

  <!-- Franja inferior: si no llegan -->
  <text x="800" y="942" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" fill="#1a2e1f"><tspan font-weight="700">Si no llegan:</tspan> cambiar los radiadores que limitan, aislar la casa o una bomba de alta temperatura</text>
</svg>
