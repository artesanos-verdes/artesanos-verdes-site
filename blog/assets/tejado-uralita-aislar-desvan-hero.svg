<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="'Source Sans 3', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Tejado de uralita: se aísla el suelo del desván y las placas no se tocan</title>
  <desc id="d">Sección esquemática de una casa con tejado a dos aguas de placas de fibrocemento intactas. Justo debajo de las placas, una franja rayada marcada «no tocar». El desván no habitable queda ventilado y sobre su suelo, el forjado que hace de techo de la vivienda, hay una capa de lana mineral insuflada. A la derecha, dos listas. Lo que se hace: insuflar lana sobre el suelo del desván, sellar la trampilla y los pasos de instalaciones y mantener el desván ventilado. Lo que no se hace: taladrar, cortar o lijar las placas, fijar nada a la cubierta y aislar los rampantes bajo uralita. Una nota indica que retirar o encapsular las placas corresponde a una empresa inscrita en el RERA.</desc>
  <defs>
    <pattern id="wool" width="20" height="12" patternUnits="userSpaceOnUse">
      <rect width="20" height="12" fill="#ffffff"/>
      <path d="M0,8 q5,-8 10,0 t10,0" fill="none" stroke="#b8733a" stroke-width="2.4"/>
    </pattern>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#fbe9d8"/>
      <rect width="5" height="14" fill="#b8733a" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Fondo -->
  <rect width="1600" height="1000" fill="#f5efe1"/>

  <!-- Título -->
  <text x="70" y="92" font-size="22" font-weight="700" letter-spacing="3" fill="#22a044">TEJADO DE URALITA</text>
  <text x="70" y="150" font-family="'Source Serif 4', Georgia, serif" font-size="56" font-weight="700" fill="#1a2e1f">Se aísla el suelo, no las placas</text>
  <rect x="70" y="168" width="80" height="5" rx="2" fill="#b8733a"/>
  <text x="70" y="214" font-size="22" fill="#1a2e1f" opacity="0.8">Desván no habitable: la lana va sobre el forjado y la cubierta no se toca</text>

  <!-- Suelo exterior -->
  <rect x="70" y="900" width="910" height="6" rx="3" fill="#1a2e1f" opacity="0.25"/>

  <!-- Vivienda -->
  <rect x="160.0" y="628.0" width="740.0" height="272.0" fill="#ffffff"/>
  <rect x="160.0" y="628.0" width="24" height="272.0" fill="#1a2e1f" opacity="0.85"/>
  <rect x="876.0" y="628.0" width="24" height="272.0" fill="#1a2e1f" opacity="0.85"/>
  <rect x="260" y="700" width="110" height="120" rx="6" fill="#f5efe1" stroke="#1a2e1f" stroke-opacity="0.35" stroke-width="3"/>
  <line x1="315" y1="700" x2="315" y2="820" stroke="#1a2e1f" stroke-opacity="0.35" stroke-width="3"/>
  <rect x="690" y="700" width="110" height="120" rx="6" fill="#f5efe1" stroke="#1a2e1f" stroke-opacity="0.35" stroke-width="3"/>
  <line x1="745" y1="700" x2="745" y2="820" stroke="#1a2e1f" stroke-opacity="0.35" stroke-width="3"/>
  <text x="530" y="770" text-anchor="middle" font-size="26" font-weight="700" fill="#1a2e1f">Vivienda</text>
  <text x="530" y="802" text-anchor="middle" font-size="20" fill="#1a2e1f" opacity="0.75">la casa calefactada</text>

  <!-- Desván -->
  <polygon points="160.0,600.0 530.0,290.0 900.0,600.0" fill="#fffdf8"/>

  <!-- Franja «no tocar» bajo las placas -->
  <polygon points="222.1,548.0 530.0,290.0 837.9,548.0 785.0,548.0 530.0,334.4 275.0,548.0" fill="url(#hatch)" stroke="#b8733a" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="417.7" y="412.2" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#8a4f22" transform="rotate(-39.96 417.7 406.2)">NO TOCAR</text>
  <text x="319.2" y="494.8" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#8a4f22" transform="rotate(-39.96 319.2 488.8)">NO TOCAR</text>
  <text x="642.3" y="412.2" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#8a4f22" transform="rotate(39.96 642.3 406.2)">NO TOCAR</text>
  <text x="740.8" y="494.8" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#8a4f22" transform="rotate(39.96 740.8 488.8)">NO TOCAR</text>

