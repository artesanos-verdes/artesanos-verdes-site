  <polygon points="488,306 530,252 572,306 561,314 530,276 499,314" fill="#9c988a" stroke="#1a2e1f" stroke-opacity="0.55" stroke-width="2" stroke-linejoin="round"/>

  <!-- Lana mineral sobre el forjado -->
  <polygon points="160.0,600.0 207.7,560.0 852.3,560.0 900.0,600.0" fill="url(#wool)" stroke="#b8733a" stroke-width="2"/>
  <rect x="160.0" y="600.0" width="740.0" height="28" fill="#1a2e1f"/>

  <!-- Rótulos del desván -->
  <text x="530" y="462" text-anchor="middle" font-size="24" font-weight="700" fill="#1a2e1f">Desván no habitable</text>
  <text x="530" y="492" text-anchor="middle" font-size="20" fill="#1a2e1f" opacity="0.75">ventilado, más frío tras aislar</text>
  <rect x="335" y="518" width="390" height="34" rx="17" fill="#ffffff" stroke="#b8733a" stroke-width="2"/>
  <text x="530" y="542" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2e1f">Lana mineral sobre el forjado</text>

  <!-- Ventilación en los aleros -->
  <path d="M92,684 Q139,678 186,566" fill="none" stroke="#22a044" stroke-width="4" stroke-linecap="round"/>
  <path d="M968,684 Q921,678 874,566" fill="none" stroke="#22a044" stroke-width="4" stroke-linecap="round"/>
  <polygon points="188,562 172,580 194,582" fill="#22a044"/>
  <polygon points="872,562 888,580 866,582" fill="#22a044"/>

  <!-- Llamada a las placas -->
  <text x="90" y="300" font-size="24" font-weight="700" fill="#1a2e1f">Placas de fibrocemento</text>
  <text x="90" y="330" font-size="22" fill="#1a2e1f" opacity="0.8">intactas: se quedan como están</text>
  <line x1="200" y1="346" x2="268" y2="470" stroke="#1a2e1f" stroke-opacity="0.55" stroke-width="2.5"/>
  <circle cx="268" cy="470" r="6" fill="#1a2e1f" opacity="0.7"/>

  <!-- Lo que se hace / lo que no se hace -->
  <rect x="1010" y="250" width="520" height="270" rx="14" fill="#ffffff" stroke="#1a2e1f" stroke-opacity="0.15"/>
  <circle cx="1050" cy="294" r="20" fill="#22a044"/>
  <path d="M1040,295 l7,8 l14,-16" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1084" y="303" font-size="28" font-weight="700" fill="#1a2e1f">Lo que se hace</text>
  <path d="M1040,350 l6,7 l12,-13" fill="none" stroke="#22a044" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1072" y="358" font-size="22" fill="#1a2e1f">Insuflar lana sobre el suelo del desván</text>
  <path d="M1040,402 l6,7 l12,-13" fill="none" stroke="#22a044" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1072" y="410" font-size="22" fill="#1a2e1f">Sellar trampilla y pasos de instalaciones</text>
  <path d="M1040,454 l6,7 l12,-13" fill="none" stroke="#22a044" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1072" y="462" font-size="22" fill="#1a2e1f">Mantener el desván ventilado</text>
  <rect x="1010" y="548" width="520" height="270" rx="14" fill="#ffffff" stroke="#1a2e1f" stroke-opacity="0.15"/>
  <circle cx="1050" cy="592" r="20" fill="#b8733a"/>
  <path d="M1042,584 l16,16 M1058,584 l-16,16" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text x="1084" y="601" font-size="28" font-weight="700" fill="#1a2e1f">Lo que no se hace</text>
  <path d="M1041,640 l12,12 M1053,640 l-12,12" fill="none" stroke="#b8733a" stroke-width="3.5" stroke-linecap="round"/>
  <text x="1072" y="656" font-size="22" fill="#1a2e1f">Taladrar, cortar o lijar las placas</text>
  <path d="M1041,692 l12,12 M1053,692 l-12,12" fill="none" stroke="#b8733a" stroke-width="3.5" stroke-linecap="round"/>
  <text x="1072" y="708" font-size="22" fill="#1a2e1f">Fijar nada a la cubierta</text>
  <path d="M1041,744 l12,12 M1053,744 l-12,12" fill="none" stroke="#b8733a" stroke-width="3.5" stroke-linecap="round"/>
  <text x="1072" y="760" font-size="22" fill="#1a2e1f">Aislar los rampantes bajo uralita</text>
  <text x="1010" y="868" font-size="20" font-weight="700" fill="#1a2e1f">Retirar o encapsular las placas:</text>
  <text x="1010" y="896" font-size="20" fill="#1a2e1f" opacity="0.8">empresa inscrita en el RERA</text>
</svg>
