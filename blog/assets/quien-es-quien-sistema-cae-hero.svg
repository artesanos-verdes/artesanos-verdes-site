<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="qeq-title qeq-desc" font-family="'Source Sans 3', Arial, sans-serif">
  <title id="qeq-title">Quién es quién en el sistema CAE</title>
  <desc id="qeq-desc">Ilustración de una vivienda en el centro, unida por líneas discontinuas a cuatro actores del sistema CAE: la empresa energética obligada, el sujeto delegado, el verificador acreditado y la Administración que registra los certificados.</desc>

  <!-- ===== FONDO + ESCENARIO ===== -->
  <rect width="640" height="420" fill="#f7f7f5"/>
  <circle cx="320" cy="186" r="150" fill="#e9f2ec"/>

  <!-- ===== CONEXIONES ===== -->
  <g stroke="#a8c4b0" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9" fill="none">
    <line x1="296" y1="168" x2="220" y2="128"/>
    <line x1="344" y1="168" x2="420" y2="128"/>
    <line x1="296" y1="214" x2="220" y2="250"/>
    <line x1="344" y1="214" x2="420" y2="250"/>
  </g>

  <!-- ===== VIVIENDA (propietario del ahorro) ===== -->
  <rect x="284" y="170" width="72" height="58" fill="#ffffff" stroke="#1a4d30" stroke-width="4" stroke-linejoin="round"/>
  <path d="M272,172 L320,134 L368,172" fill="none" stroke="#1a4d30" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M292,170 C292,163 304,158 320,158 C336,158 348,163 348,170 Z" fill="#a8c4b0" stroke="#1a4d30" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M310,228 L310,204 Q320,196 330,204 L330,228" fill="#ffffff" stroke="#1a4d30" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="320" cy="148" r="5" fill="#22a044" stroke="#1a4d30" stroke-width="1.5"/>

  <!-- ===== SUJETO OBLIGADO (energía) ===== -->
  <circle cx="190" cy="112" r="36" fill="#ffffff" stroke="#1a4d30" stroke-width="3.5"/>
  <path d="M196,90 L178,116 L190,116 L184,134 L204,106 L192,106 Z" fill="#a8c4b0" stroke="#1a4d30" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- ===== SUJETO DELEGADO (gestión) ===== -->
  <circle cx="450" cy="112" r="36" fill="#ffffff" stroke="#1a4d30" stroke-width="3.5"/>
  <path d="M442,102 L442,96 Q442,93 445,93 L455,93 Q458,93 458,96 L458,102" fill="none" stroke="#1a4d30" stroke-width="3" stroke-linejoin="round"/>
  <rect x="429" y="102" width="42" height="28" rx="5" fill="#a8c4b0" stroke="#1a4d30" stroke-width="3" stroke-linejoin="round"/>
  <line x1="429" y1="114" x2="471" y2="114" stroke="#1a4d30" stroke-width="2.5"/>
  <rect x="445" y="110" width="10" height="8" rx="2" fill="#ffffff" stroke="#1a4d30" stroke-width="2"/>

  <!-- ===== VERIFICADOR (lupa) ===== -->
  <circle cx="190" cy="262" r="36" fill="#ffffff" stroke="#1a4d30" stroke-width="3.5"/>
  <circle cx="185" cy="256" r="14" fill="#e9f2ec" stroke="#1a4d30" stroke-width="3"/>
  <line x1="195" y1="266" x2="207" y2="278" stroke="#1a4d30" stroke-width="5" stroke-linecap="round"/>
  <path d="M178,256 L183,261 L192,250" fill="none" stroke="#22a044" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== ADMINISTRACIÓN (registro) ===== -->
  <circle cx="450" cy="262" r="36" fill="#ffffff" stroke="#1a4d30" stroke-width="3.5"/>
  <path d="M428,256 L450,242 L472,256 Z" fill="#a8c4b0" stroke="#1a4d30" stroke-width="2.5" stroke-linejoin="round"/>
  <g stroke="#1a4d30" stroke-width="3" stroke-linecap="round">
    <line x1="436" y1="261" x2="436" y2="276"/>
    <line x1="450" y1="261" x2="450" y2="276"/>
    <line x1="464" y1="261" x2="464" y2="276"/>
  </g>
  <line x1="428" y1="281" x2="472" y2="281" stroke="#1a4d30" stroke-width="3.5" stroke-linecap="round"/>

  <!-- ===== SUELO ===== -->
  <line x1="150" y1="310" x2="490" y2="310" stroke="#a8c4b0" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== ETIQUETA ===== -->
  <line x1="306" y1="344" x2="334" y2="344" stroke="#22a044" stroke-width="4" stroke-linecap="round"/>
  <text x="320" y="378" fill="#1a4d30" font-size="26" font-weight="700" letter-spacing="5" text-anchor="middle">QUIÉN ES QUIÉN</text>
</svg>
