<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="cae-title cae-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="cae-title">Qué cambia el sistema CAE en el presupuesto de tu obra</title>
  <desc id="cae-desc">Sin CAE, el presupuesto completo de la obra queda a tu cargo. Con la financiación privada del sistema CAE, la prima CAE se descuenta del presupuesto y el importe a tu cargo se indica por escrito antes de firmar: el sistema CAE puede cubrir gran parte de la inversión. Importe sujeto a estudio técnico previo y a la normativa CAE vigente (RD 36/2023); primas sujetas a verificación del ahorro por una entidad acreditada por ENAC.</desc>

  <rect width="1200" height="520" fill="#f7f7f5"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="70" fill="#1a4d30"/>
  <text x="60" y="30" fill="#a8c4b0" font-size="11" font-weight="700" letter-spacing="2.5">SISTEMA CAE · FINANCIACIÓN PRIVADA</text>
  <text x="60" y="55" fill="#ffffff" font-size="22" font-weight="700">Qué cambia el sistema CAE en el presupuesto de tu obra</text>

  <!-- LEFT: Sin CAE -->
  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="400" height="270" rx="14" fill="#ffffff" stroke="#d8d4c8" stroke-width="2"/>
    <text x="200" y="44" fill="#888888" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">SIN CAE</text>
    <text x="200" y="104" fill="#2b2b2b" font-size="40" font-weight="800" text-anchor="middle">Coste íntegro</text>
    <text x="200" y="138" fill="#666666" font-size="15" text-anchor="middle">El presupuesto completo, a tu cargo</text>
    <line x1="60" y1="168" x2="340" y2="168" stroke="#e6e2d8" stroke-width="2"/>
    <!-- bullets -->
    <g font-size="14" fill="#777777">
      <g transform="translate(70, 204)">
        <circle cx="0" cy="-5" r="9" fill="#efece4"/>
        <path d="M -4 -9 L 4 -1 M 4 -9 L -4 -1" stroke="#a65b3a" stroke-width="2" stroke-linecap="round"/>
        <text x="20" y="0">Pagas toda la obra de tu bolsillo</text>
      </g>
      <g transform="translate(70, 238)">
        <circle cx="0" cy="-5" r="9" fill="#efece4"/>
        <path d="M -4 -9 L 4 -1 M 4 -9 L -4 -1" stroke="#a65b3a" stroke-width="2" stroke-linecap="round"/>
        <text x="20" y="0">Sin financiación del sistema CAE</text>
      </g>
    </g>
  </g>

  <!-- Middle: CAE + arrow -->
  <g transform="translate(600, 245)">
    <circle cx="0" cy="0" r="52" fill="#1a4d30"/>
    <text x="0" y="2" fill="#ffffff" font-size="30" font-weight="800" text-anchor="middle">CAE</text>
    <text x="0" y="22" fill="#a8c4b0" font-size="10" font-weight="700" text-anchor="middle">RD 36/2023</text>
    <path d="M -110 0 L -64 0" stroke="#1a4d30" stroke-width="4" stroke-linecap="round"/>
    <path d="M 64 0 L 104 0" stroke="#1a4d30" stroke-width="4" stroke-linecap="round"/>
    <path d="M 96 -10 L 112 0 L 96 10 Z" fill="#1a4d30"/>
  </g>

  <!-- RIGHT: Con CAE -->
  <g transform="translate(730, 110)">
    <rect x="0" y="0" width="400" height="270" rx="14" fill="#1a4d30"/>
    <text x="200" y="44" fill="#a8c4b0" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">CON CAE</text>
    <text x="200" y="104" fill="#ffffff" font-size="40" font-weight="800" text-anchor="middle">Gran parte</text>
    <text x="200" y="138" fill="#d8eadf" font-size="15" text-anchor="middle">de la inversión puede quedar cubierta</text>
    <line x1="60" y1="168" x2="340" y2="168" stroke="#2d6a45" stroke-width="2"/>
    <g font-size="14" fill="#ffffff">
      <g transform="translate(40, 204)">
        <circle cx="0" cy="-5" r="9" fill="#2d7a4e"/>
        <path d="M -4 -5 L -1 -2 L 4 -9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="20" y="0">Prima CAE descontada del presupuesto</text>
      </g>
      <g transform="translate(40, 238)">
        <circle cx="0" cy="-5" r="9" fill="#2d7a4e"/>
        <path d="M -4 -5 L -1 -2 L 4 -9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="20" y="0">Importe a tu cargo, por escrito antes de firmar</text>
      </g>
    </g>
  </g>

  <!-- Mención legal -->
  <text x="600" y="425" fill="#555555" font-size="13" font-weight="600" text-anchor="middle">El sistema CAE puede cubrir gran parte de la inversión. Importe sujeto a estudio técnico previo y a la normativa CAE vigente (RD 36/2023).</text>
  <text x="600" y="449" fill="#777777" font-size="12" text-anchor="middle">Primas sujetas a verificación del ahorro por una entidad acreditada por ENAC.</text>

  <!-- Footer -->
  <text x="600" y="500" fill="#666" font-size="11" font-weight="600" text-anchor="middle">Financiación privada del sistema CAE · Sujeto delegado: GreenFlex · Los Artesanos Verdes</text>
</svg>
