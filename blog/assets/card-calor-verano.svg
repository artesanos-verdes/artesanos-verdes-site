<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="ver-title ver-desc" font-family="Manrope, -apple-system, sans-serif">
  <title id="ver-title">Calor en la buhardilla en verano</title>
  <desc id="ver-desc">Sección de una buhardilla habitable: el sol calienta el tejado y un aislante colocado bajo los rampantes devuelve el calor hacia el exterior.</desc>

  <!-- ===== FONDO + ESCENARIO ===== -->
  <rect width="640" height="420" fill="#f7f7f5"/>
  <circle cx="320" cy="180" r="150" fill="#e9f2ec"/>

  <!-- ===== SOL ===== -->
  <g transform="translate(176,92)">
    <circle cx="0" cy="0" r="24" fill="#f0c9a0" stroke="#c07856" stroke-width="3"/>
    <g stroke="#c07856" stroke-width="3.5" stroke-linecap="round">
      <line x1="0" y1="-36" x2="0" y2="-46"/>
      <line x1="0" y1="36" x2="0" y2="46"/>
      <line x1="-36" y1="0" x2="-46" y2="0"/>
      <line x1="36" y1="0" x2="46" y2="0"/>
      <line x1="-26" y1="-26" x2="-33" y2="-33"/>
      <line x1="26" y1="26" x2="33" y2="33"/>
      <line x1="-26" y1="26" x2="-33" y2="33"/>
      <line x1="26" y1="-26" x2="33" y2="-33"/>
    </g>
  </g>

  <!-- ===== BUHARDILLA HABITABLE (sección) ===== -->
  <path d="M206,298 L206,206 L320,108 L434,206 L434,298 Z" fill="#ffffff" stroke="#1a4d30" stroke-width="4" stroke-linejoin="round"/>
  <!-- cubierta (teja) -->
  <path d="M182,214 L320,94 L458,214" fill="none" stroke="#1a4d30" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- aislante bajo los rampantes -->
  <path d="M214,206 L320,115 L426,206" fill="none" stroke="#a8c4b0" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- ventana -->
  <rect x="298" y="190" width="44" height="44" rx="4" fill="#a8c4b0" stroke="#1a4d30" stroke-width="3"/>
  <line x1="320" y1="190" x2="320" y2="234" stroke="#1a4d30" stroke-width="2"/>
  <line x1="298" y1="212" x2="342" y2="212" stroke="#1a4d30" stroke-width="2"/>
  <!-- sofá -->
  <rect x="268" y="262" width="104" height="26" rx="8" fill="#e9f2ec" stroke="#1a4d30" stroke-width="3"/>

  <!-- ===== RAYO INCIDENTE Y REFLEJADO ===== -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M206,116 L252,142" stroke="#c07856" stroke-width="4"/>
    <path d="M262,140 L300,104" stroke="#22a044" stroke-width="4"/>
    <path d="M290,104 L302,102 L300,114" stroke="#22a044" stroke-width="4"/>
  </g>

  <!-- ===== ONDAS DE CALOR SOBRE EL TEJADO ===== -->
  <g fill="none" stroke="#c07856" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M392,120 q8,-9 0,-18 q-8,-9 0,-18"/>
    <path d="M414,136 q8,-9 0,-18 q-8,-9 0,-18"/>
  </g>

  <!-- ===== SUELO ===== -->
  <line x1="150" y1="300" x2="490" y2="300" stroke="#a8c4b0" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== ETIQUETA ===== -->
  <line x1="306" y1="344" x2="334" y2="344" stroke="#22a044" stroke-width="4" stroke-linecap="round"/>
  <text x="320" y="378" fill="#1a4d30" font-size="26" font-weight="800" letter-spacing="5" text-anchor="middle">VERANO</text>
</svg>
