<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Marcas de aerotermia: qué comparar entre dos propuestas</title>
  <desc id="hero-desc">Infografía. A la izquierda, seis datos para comparar dos propuestas de aerotermia: el SCOP a la temperatura de tus emisores (35 °C con suelo radiante, 55 °C con radiadores), la potencia calculada para tu casa, la impulsión máxima y la temperatura exterior mínima, el ruido en potencia sonora y no en presión sonora, la ficha del modelo en EPREL y el servicio técnico. A la derecha, la bomba de calor que instalamos, Thaleos Mont-blanc R290, según la ficha técnica del fabricante: R290 (propano), impulsión de hasta 80 °C en calefacción, clase A+++ a 35 y 55 °C, monobloc de 4 a 16 kW, bibloc hidráulico con depósito de 190 L y versión MAX de 26 a 40 kW. Abajo, un recordatorio: en el CAE no cuenta la marca; la ficha RES060_FM pide una bomba de calor hidrónica en lugar de una caldera de gas o gasóleo y calcula el ahorro con el SCOP del fabricante a 35, 45 o 55 °C.</desc>

  <!-- Fondo -->
  <rect width="1600" height="1000" fill="#f5efe1"/>

  <!-- Título -->
  <text x="800" y="82" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="52" font-weight="700" fill="#1a2e1f">Marcas de aerotermia: qué comparar</text>
  <text x="800" y="128" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="28" fill="#1a2e1f" fill-opacity="0.8">Los mismos datos, en las mismas condiciones, para cada propuesta</text>
  <line x1="80" y1="156" x2="1520" y2="156" stroke="#1a2e1f" stroke-opacity="0.15" stroke-width="2"/>

  <!-- ===== Tarjeta izquierda: seis datos ===== -->
  <rect x="80" y="186" width="820" height="604" rx="18" fill="#ffffff" stroke="#1a2e1f" stroke-opacity="0.25" stroke-width="2"/>
  <rect x="80" y="186" width="820" height="70" rx="18" fill="#1a2e1f"/>
  <rect x="80" y="232" width="820" height="24" fill="#1a2e1f"/>
  <text x="490" y="232" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#f5efe1">Seis datos para comparar dos propuestas</text>

  <!-- Fila 1 -->
  <circle cx="134" cy="304" r="22" fill="#b8733a"/>
  <text x="134" y="313" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">1</text>
  <text x="176" y="300" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" font-weight="700" fill="#1a2e1f">SCOP a la temperatura de tus emisores</text>
  <text x="176" y="330" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" fill="#1a2e1f" fill-opacity="0.75">35 °C con suelo radiante, 55 °C con radiadores</text>
  <line x1="120" y1="348" x2="860" y2="348" stroke="#1a2e1f" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Fila 2 -->
  <circle cx="134" cy="386" r="22" fill="#b8733a"/>
  <text x="134" y="395" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">2</text>
  <text x="176" y="382" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" font-weight="700" fill="#1a2e1f">Potencia calculada para tu casa</text>
  <text x="176" y="412" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" fill="#1a2e1f" fill-opacity="0.75">demanda de tu vivienda y temperatura de proyecto</text>
  <line x1="120" y1="430" x2="860" y2="430" stroke="#1a2e1f" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Fila 3 -->
  <circle cx="134" cy="468" r="22" fill="#b8733a"/>
  <text x="134" y="477" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">3</text>
  <text x="176" y="464" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" font-weight="700" fill="#1a2e1f">Impulsión máxima y temperatura exterior mínima</text>
  <text x="176" y="494" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" fill="#1a2e1f" fill-opacity="0.75">las dos vienen en la ficha técnica</text>
  <line x1="120" y1="512" x2="860" y2="512" stroke="#1a2e1f" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Fila 4 -->
  <circle cx="134" cy="550" r="22" fill="#b8733a"/>
  <text x="134" y="559" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">4</text>
  <text x="176" y="546" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" font-weight="700" fill="#1a2e1f">Ruido en potencia sonora (LWA)</text>
  <text x="176" y="576" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" fill="#1a2e1f" fill-opacity="0.75">no en presión sonora, que depende de la distancia</text>
  <line x1="120" y1="594" x2="860" y2="594" stroke="#1a2e1f" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Fila 5 -->
  <circle cx="134" cy="632" r="22" fill="#b8733a"/>
  <text x="134" y="641" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">5</text>
  <text x="176" y="628" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" font-weight="700" fill="#1a2e1f">Ficha del modelo en EPREL</text>
  <text x="176" y="658" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" fill="#1a2e1f" fill-opacity="0.75">base de datos europea del etiquetado energético</text>
  <line x1="120" y1="676" x2="860" y2="676" stroke="#1a2e1f" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Fila 6 -->
  <circle cx="134" cy="714" r="22" fill="#b8733a"/>
  <text x="134" y="723" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">6</text>
  <text x="176" y="710" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" font-weight="700" fill="#1a2e1f">Servicio técnico y mantenimiento</text>
  <text x="176" y="740" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" fill="#1a2e1f" fill-opacity="0.75">puesta en marcha, averías y revisiones</text>

  <!-- ===== Tarjeta derecha: el equipo que instalamos ===== -->
  <rect x="940" y="186" width="580" height="604" rx="18" fill="#ffffff" stroke="#22a044" stroke-opacity="0.6" stroke-width="3"/>
  <rect x="940" y="186" width="580" height="70" rx="18" fill="#22a044"/>
  <rect x="940" y="232" width="580" height="24" fill="#22a044"/>
  <text x="1230" y="232" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#ffffff">La que instalamos</text>

  <!-- Unidad exterior genérica (sin logotipo) -->
  <rect x="1100" y="276" width="260" height="144" rx="10" fill="#faf6ec" stroke="#1a2e1f" stroke-width="3"/>
  <circle cx="1180" cy="348" r="54" fill="none" stroke="#1a2e1f" stroke-width="3"/>
  <circle cx="1180" cy="348" r="36" fill="none" stroke="#1a2e1f" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="1180" cy="348" r="18" fill="none" stroke="#1a2e1f" stroke-opacity="0.45" stroke-width="2"/>
  <path d="M1126 348 H1234 M1180 294 V402" stroke="#1a2e1f" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M1262 300 H1340 M1262 318 H1340 M1262 336 H1340 M1262 354 H1340 M1262 372 H1340 M1262 390 H1340" stroke="#1a2e1f" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round"/>
  <rect x="1122" y="420" width="34" height="10" rx="3" fill="#1a2e1f" fill-opacity="0.6"/>
  <rect x="1304" y="420" width="34" height="10" rx="3" fill="#1a2e1f" fill-opacity="0.6"/>

  <text x="1230" y="474" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="32" font-weight="700" fill="#1a2e1f">Thaleos Mont-blanc R290</text>

  <circle cx="992" cy="510" r="7" fill="#22a044"/>
  <text x="1010" y="518" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f">R290 (propano), refrigerante natural</text>
  <circle cx="992" cy="548" r="7" fill="#22a044"/>
  <text x="1010" y="556" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f"><tspan font-weight="700">Hasta 80 °C</tspan> de impulsión en calefacción</text>
  <circle cx="992" cy="586" r="7" fill="#22a044"/>
  <text x="1010" y="594" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f"><tspan font-weight="700">Clase A+++</tspan> a 35 °C y a 55 °C</text>
  <circle cx="992" cy="624" r="7" fill="#22a044"/>
  <text x="1010" y="632" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f">Monobloc de 4 a 16 kW</text>
  <circle cx="992" cy="662" r="7" fill="#22a044"/>
  <text x="1010" y="670" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f">Bibloc hidráulico, depósito de 190 L</text>
  <circle cx="992" cy="700" r="7" fill="#22a044"/>
  <text x="1010" y="708" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f">Versión MAX de 26 a 40 kW</text>

  <text x="1230" y="756" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="20" font-style="italic" fill="#1a2e1f" fill-opacity="0.7">Según la ficha técnica del fabricante</text>

  <!-- ===== Franja inferior: el CAE ===== -->
  <rect x="80" y="820" width="1440" height="140" rx="18" fill="#1a2e1f"/>
  <text x="800" y="866" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#f5efe1">En el CAE no cuenta la marca</text>
  <text x="800" y="906" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#f5efe1" fill-opacity="0.9">La ficha RES060_FM pide una bomba de calor hidrónica en lugar de una caldera de gas o gasóleo</text>
  <text x="800" y="940" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#f5efe1" fill-opacity="0.9">y calcula el ahorro con el SCOP del fabricante a 35, 45 o 55 °C, según tus emisores</text>
</svg>
