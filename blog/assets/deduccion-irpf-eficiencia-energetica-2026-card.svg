<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="irpfc-title irpfc-desc" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif">
  <title id="irpfc-title">Deducción del IRPF por eficiencia energética</title>
  <desc id="irpfc-desc">Certificado de eficiencia energética con la calificación mejorada junto a un calendario que marca el 31 de diciembre.</desc>

  <!-- ===== FONDO + ESCENARIO ===== -->
  <rect width="640" height="420" fill="#f7f7f5"/>
  <circle cx="320" cy="180" r="150" fill="#e9f2ec"/>

  <!-- ===== CERTIFICADO ===== -->
  <g transform="translate(196,96) rotate(-4)">
    <rect x="0" y="0" width="140" height="190" rx="10" fill="#ffffff" stroke="#1a4d30" stroke-width="4"/>
    <text x="16" y="30" fill="#1a4d30" font-size="14" font-weight="700" letter-spacing="2.5">CEE</text>
    <rect x="16" y="46"  width="50"  height="12" rx="3" fill="#a8c4b0"/>
    <rect x="16" y="64"  width="62"  height="12" rx="3" fill="#22a044"/>
    <rect x="16" y="82"  width="74"  height="12" rx="3" fill="#a8c4b0"/>
    <rect x="16" y="100" width="86"  height="12" rx="3" fill="#a8c4b0"/>
    <rect x="16" y="118" width="98"  height="12" rx="3" fill="#a8c4b0"/>
    <rect x="16" y="136" width="108" height="12" rx="3" fill="#a8c4b0"/>
    <path d="M86,70 L100,63 L100,77 Z" fill="#22a044" stroke="#1a4d30" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="112" cy="166" r="13" fill="#e9f2ec" stroke="#1a4d30" stroke-width="2.5"/>
    <path d="M105,166 L110,171 L119,161" fill="none" stroke="#22a044" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== CALENDARIO ===== -->
  <g transform="translate(350,134)">
    <rect x="0" y="0" width="104" height="112" rx="10" fill="#ffffff" stroke="#1a4d30" stroke-width="4"/>
    <path d="M0,10 Q0,0 10,0 L94,0 Q104,0 104,10 L104,32 L0,32 Z" fill="#1a4d30"/>
    <text x="52" y="22" fill="#ffffff" font-size="13" font-weight="700" letter-spacing="2.5" text-anchor="middle">DIC</text>
    <text x="52" y="90" fill="#1a4d30" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" text-anchor="middle">31</text>
    <g stroke="#1a4d30" stroke-width="4.5" stroke-linecap="round">
      <line x1="28" y1="-8" x2="28" y2="8"/>
      <line x1="76" y1="-8" x2="76" y2="8"/>
    </g>
  </g>

  <!-- ===== SUELO ===== -->
  <line x1="150" y1="300" x2="490" y2="300" stroke="#a8c4b0" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== ETIQUETA ===== -->
  <line x1="306" y1="344" x2="334" y2="344" stroke="#22a044" stroke-width="4" stroke-linecap="round"/>
  <text x="320" y="378" fill="#1a4d30" font-size="26" font-weight="700" letter-spacing="5" text-anchor="middle">DEDUCCIÓN IRPF</text>
</svg>
