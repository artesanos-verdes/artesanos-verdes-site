<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="'Source Sans 3', Arial, sans-serif" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Provincia de Burgos, zona climática E1 a partir de 600 m y D1 por debajo: altitud de los principales municipios y desván aislado con 220 mm de lana mineral</title>
  <desc id="hero-desc">Esquema en dos partes, sin contorno geográfico. A la izquierda, una escala de altitud de 400 a 900 metros: la tabla a-Anejo B del Código Técnico asigna la zona por provincia y tramo de altitud, y en la fila de Burgos da D1 por debajo de 600 metros y E1 a partir de 600 metros. En la franja E1 aparecen Burgos, a unos 860 metros, Roa a 811, Aranda de Duero a 798, Briviesca a 718 y Medina de Pomar a 607; en la franja D1, Villarcayo a 596 y Miranda de Ebro a 474. Las dos franjas son elegibles para la ficha RES022 del sistema CAE. A la derecha, la sección de una casa con el desván no habitable sobre el último piso y una capa de 220 milímetros de lana mineral insuflada sobre el suelo del desván, con resistencia térmica de 4,75 metros cuadrados kelvin por vatio.</desc>

  <defs>
    <clipPath id="hero-insulation-clip">
      <rect x="1000" y="388" width="500" height="30"/>
    </clipPath>
  </defs>

  <!-- Fondo -->
  <rect width="1600" height="1000" fill="#f5efe1"/>

  <!-- Cabecera izquierda -->
  <text x="90" y="104" font-size="22" font-weight="700" letter-spacing="3" fill="#22a044">PROVINCIA DE BURGOS · CTE DB-HE</text>
  <text x="90" y="180" font-family="'Source Serif 4', Georgia, serif" font-size="68" font-weight="700" fill="#1a2e1f">Zona climática E1</text>
  <text x="90" y="226" font-size="28" fill="#1a2e1f" opacity="0.85">A partir de 600 m de altitud · por debajo de 600 m, zona D1</text>
  <rect x="90" y="248" width="80" height="5" rx="2" fill="#b8733a"/>

  <!-- Escala de altitud (400 a 900 m): 1,1 px por metro, 900 m en y=330 y 400 m en y=880 -->
  <line x1="170" y1="330" x2="170" y2="880" stroke="#1a2e1f" stroke-width="3"/>
  <line x1="160" y1="330" x2="180" y2="330" stroke="#1a2e1f" stroke-width="3"/>
  <line x1="160" y1="440" x2="180" y2="440" stroke="#1a2e1f" stroke-width="3"/>
  <line x1="160" y1="550" x2="180" y2="550" stroke="#1a2e1f" stroke-width="3"/>
  <line x1="160" y1="660" x2="180" y2="660" stroke="#1a2e1f" stroke-width="3"/>
  <line x1="160" y1="770" x2="180" y2="770" stroke="#1a2e1f" stroke-width="3"/>
  <line x1="160" y1="880" x2="180" y2="880" stroke="#1a2e1f" stroke-width="3"/>
  <text x="148" y="338" text-anchor="end" font-size="22" fill="#1a2e1f">900 m</text>
  <text x="148" y="448" text-anchor="end" font-size="22" fill="#1a2e1f">800 m</text>
  <text x="148" y="558" text-anchor="end" font-size="22" fill="#1a2e1f">700 m</text>
  <text x="148" y="668" text-anchor="end" font-size="22" fill="#1a2e1f">600 m</text>
  <text x="148" y="778" text-anchor="end" font-size="22" fill="#1a2e1f">500 m</text>
  <text x="148" y="888" text-anchor="end" font-size="22" fill="#1a2e1f">400 m</text>

  <!-- Franja E1: 600 m o más (y=330 a 660) -->
  <rect x="200" y="330" width="600" height="330" fill="#1a2e1f" opacity="0.10"/>
  <rect x="200" y="330" width="600" height="330" fill="none" stroke="#1a2e1f" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- Franja D1: por debajo de 600 m (y=660 a 880) -->
  <rect x="200" y="660" width="600" height="220" fill="#22a044" opacity="0.16"/>
  <rect x="200" y="660" width="600" height="220" fill="none" stroke="#22a044" stroke-width="3"/>
  <!-- Umbral de 600 m -->
  <line x1="200" y1="660" x2="800" y2="660" stroke="#b8733a" stroke-width="4"/>
  <text x="796" y="684" text-anchor="end" font-size="22" font-weight="700" fill="#b8733a">Umbral de 600 m</text>

  <!-- Etiquetas de las franjas -->
  <circle cx="750" cy="372" r="34" fill="#1a2e1f"/>
  <text x="750" y="384" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="32" font-weight="700" fill="#ffffff">E1</text>
  <circle cx="750" cy="840" r="34" fill="#22a044"/>
  <text x="750" y="852" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="32" font-weight="700" fill="#ffffff">D1</text>
  <text x="224" y="842" font-size="22" font-weight="700" fill="#1a2e1f">Por debajo de 600 m: zona D1</text>
  <text x="224" y="870" font-size="22" fill="#1a2e1f">También elegible · ficha RES022</text>
  <text x="224" y="352" font-size="22" font-weight="700" fill="#1a2e1f">A partir de 600 m: zona E1</text>

  <!-- Marcadores: y = 330 + (900 - altitud) × 1,1 -->
  <!-- Burgos, unos 860 m (y=373) -->
  <line x1="200" y1="373" x2="330" y2="373" stroke="#22a044" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="330" cy="373" r="11" fill="#22a044" stroke="#f5efe1" stroke-width="3"/>
  <text x="352" y="381" font-size="24" font-weight="700" fill="#1a2e1f">Burgos · unos 860 m</text>

  <!-- Roa 811 m (y=428) -->
  <line x1="200" y1="428" x2="600" y2="428" stroke="#1a2e1f" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="600" cy="428" r="9" fill="#1a2e1f"/>
  <text x="620" y="435" font-size="22" fill="#1a2e1f">Roa · 811 m</text>

  <!-- Aranda de Duero 798 m (y=442) -->
  <line x1="200" y1="442" x2="380" y2="442" stroke="#1a2e1f" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="380" cy="442" r="9" fill="#1a2e1f"/>
  <text x="400" y="470" font-size="24" font-weight="700" fill="#1a2e1f">Aranda de Duero · 798 m</text>

  <!-- Briviesca 718 m (y=530) -->
  <line x1="200" y1="530" x2="330" y2="530" stroke="#1a2e1f" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="330" cy="530" r="9" fill="#1a2e1f"/>
  <text x="352" y="538" font-size="22" fill="#1a2e1f">Briviesca · 718 m</text>

  <!-- Medina de Pomar 607 m (y=652) -->
  <line x1="200" y1="652" x2="520" y2="652" stroke="#1a2e1f" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="520" cy="652" r="9" fill="#1a2e1f"/>
  <text x="542" y="640" font-size="22" fill="#1a2e1f">Medina de Pomar · 607 m</text>

  <!-- Villarcayo 596 m (y=664) -->
  <line x1="200" y1="664" x2="330" y2="664" stroke="#1a2e1f" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="330" cy="664" r="9" fill="#1a2e1f"/>
  <text x="352" y="694" font-size="22" fill="#1a2e1f">Villarcayo · 596 m</text>

  <!-- Miranda de Ebro 474 m (y=799) -->
  <line x1="200" y1="799" x2="330" y2="799" stroke="#1a2e1f" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="330" cy="799" r="11" fill="#1a2e1f" stroke="#f5efe1" stroke-width="3"/>
  <text x="352" y="807" font-size="24" font-weight="700" fill="#1a2e1f">Miranda de Ebro · 474 m</text>

  <!-- Nota -->
  <text x="90" y="930" font-size="20" fill="#1a2e1f" opacity="0.8">Altitud del núcleo principal de cada municipio según AEMET; la de Burgos capital es aproximada.</text>
  <text x="90" y="960" font-size="20" fill="#1a2e1f" opacity="0.8">La cota del edificio se confirma en el estudio; las dos zonas entran en la ficha RES022.</text>

  <!-- Sección de la casa (derecha) -->
  <rect x="940" y="620" width="620" height="40" fill="#c1d9cc"/>
  <line x1="940" y1="620" x2="1560" y2="620" stroke="#2d7a4e" stroke-width="4"/>

  <!-- Cubierta y desván -->
  <polygon points="950,424 1250,196 1550,424" fill="#b8733a"/>
  <polygon points="1000,418 1250,232 1500,418" fill="#faf6ec"/>
  <text x="1250" y="364" font-size="28" fill="#1a2e1f" text-anchor="middle">Desván no habitable</text>

  <!-- Capa de aislamiento sobre el suelo del desván -->
  <rect x="1000" y="388" width="500" height="30" fill="#c1d9cc"/>
  <g clip-path="url(#hero-insulation-clip)">
    <path d="M1004 408 q10 -12 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="#2d7a4e" stroke-width="3" stroke-linecap="round"/>
  </g>
  <rect x="1000" y="388" width="500" height="30" fill="none" stroke="#1a4d30" stroke-width="3"/>

  <!-- Cota del espesor -->
  <line x1="1522" y1="388" x2="1522" y2="418" stroke="#1a2e1f" stroke-width="3"/>
  <line x1="1512" y1="388" x2="1532" y2="388" stroke="#1a2e1f" stroke-width="3"/>
  <line x1="1512" y1="418" x2="1532" y2="418" stroke="#1a2e1f" stroke-width="3"/>

  <!-- Último piso -->
  <rect x="980" y="420" width="540" height="200" fill="#ffffff" stroke="#1a4d30" stroke-width="6"/>
  <line x1="950" y1="420" x2="1550" y2="420" stroke="#1a4d30" stroke-width="6"/>
  <rect x="1040" y="470" width="96" height="76" rx="3" fill="#c1d9cc" stroke="#1a4d30" stroke-width="4"/>
  <line x1="1088" y1="470" x2="1088" y2="546" stroke="#1a4d30" stroke-width="3"/>
  <rect x="1364" y="470" width="96" height="76" rx="3" fill="#c1d9cc" stroke="#1a4d30" stroke-width="4"/>
  <line x1="1412" y1="470" x2="1412" y2="546" stroke="#1a4d30" stroke-width="3"/>
  <text x="1250" y="540" font-size="28" fill="#2d7a4e" text-anchor="middle">Último piso</text>

  <!-- Etiquetas del aislamiento -->
  <text x="1250" y="720" font-family="'Source Serif 4', Georgia, serif" font-size="34" font-weight="700" fill="#1a2e1f" text-anchor="middle">220 mm de lana mineral insuflada</text>
  <text x="1250" y="762" font-size="28" fill="#2d7a4e" text-anchor="middle">R = 4,75 m²·K/W · la ficha RES022 pide 4,7 en zona E</text>
  <text x="1250" y="804" font-size="24" fill="#1a2e1f" text-anchor="middle" opacity="0.85">El mismo espesor en Burgos, Aranda y Miranda</text>

  <!-- Firma -->
  <text x="1520" y="950" font-size="24" fill="#2d7a4e" text-anchor="end">artesanosverdes.com</text>
</svg>
