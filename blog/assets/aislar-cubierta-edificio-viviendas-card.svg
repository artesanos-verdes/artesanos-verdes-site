<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="ultimo-title ultimo-desc" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif">
  <title id="ultimo-title">Aislar la cubierta del edificio: el último piso</title>
  <desc id="ultimo-desc">Edificio de viviendas de cuatro plantas con una capa de lana mineral sobre el último forjado, bajo la cubierta; la última planta queda resaltada.</desc>

  <!-- ===== FONDO + ESCENARIO ===== -->
  <rect width="640" height="420" fill="#f7f7f5"/>
  <circle cx="320" cy="180" r="150" fill="#e9f2ec"/>

  <!-- ===== EDIFICIO (cuatro plantas) ===== -->
  <rect x="246" y="150" width="148" height="148" fill="#ffffff" stroke="#1a4d30" stroke-width="4" stroke-linejoin="round"/>
  <!-- última planta resaltada -->
  <rect x="250" y="154" width="140" height="31" fill="#f0c9a0" opacity="0.7"/>
  <!-- forjados -->
  <g stroke="#a8c4b0" stroke-width="2.5" stroke-linecap="round">
    <line x1="250" y1="187" x2="390" y2="187"/>
    <line x1="250" y1="224" x2="390" y2="224"/>
    <line x1="250" y1="261" x2="390" y2="261"/>
  </g>
  <!-- ventanas -->
  <g fill="#a8c4b0" stroke="#1a4d30" stroke-width="2.5">
    <rect x="262" y="159" width="24" height="21" rx="3"/>
    <rect x="308" y="159" width="24" height="21" rx="3"/>
    <rect x="354" y="159" width="24" height="21" rx="3"/>
    <rect x="262" y="196" width="24" height="21" rx="3"/>
    <rect x="308" y="196" width="24" height="21" rx="3"/>
    <rect x="354" y="196" width="24" height="21" rx="3"/>
    <rect x="262" y="233" width="24" height="21" rx="3"/>
    <rect x="308" y="233" width="24" height="21" rx="3"/>
    <rect x="354" y="233" width="24" height="21" rx="3"/>
    <rect x="262" y="270" width="24" height="21" rx="3"/>
    <rect x="354" y="270" width="24" height="21" rx="3"/>
  </g>
  <!-- portal -->
  <path d="M308,298 L308,274 Q320,264 332,274 L332,298" fill="#ffffff" stroke="#1a4d30" stroke-width="3" stroke-linejoin="round"/>

  <!-- ===== CUBIERTA ===== -->
  <path d="M220,150 L320,92 L420,150" fill="none" stroke="#1a4d30" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ===== LANA MINERAL SOBRE EL ÚLTIMO FORJADO ===== -->
  <path d="M256,150 C256,141 272,134 290,133 C304,132 310,127 320,127 C330,127 336,132 350,133 C368,134 384,141 384,150 Z" fill="#a8c4b0" stroke="#1a4d30" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="#1a4d30" opacity="0.22">
    <circle cx="276" cy="143" r="2"/>
    <circle cx="298" cy="139" r="2.2"/>
    <circle cx="320" cy="142" r="1.8"/>
    <circle cx="342" cy="138" r="2.2"/>
    <circle cx="364" cy="143" r="2"/>
  </g>

  <!-- ===== MARCA: LA ÚLTIMA PLANTA ===== -->
  <line x1="404" y1="170" x2="436" y2="170" stroke="#22a044" stroke-width="4" stroke-linecap="round"/>
  <circle cx="446" cy="170" r="7" fill="#22a044" stroke="#1a4d30" stroke-width="2"/>

  <!-- ===== SUELO ===== -->
  <line x1="150" y1="300" x2="490" y2="300" stroke="#a8c4b0" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== ETIQUETA ===== -->
  <line x1="306" y1="344" x2="334" y2="344" stroke="#22a044" stroke-width="4" stroke-linecap="round"/>
  <text x="320" y="378" fill="#1a4d30" font-size="26" font-weight="700" letter-spacing="5" text-anchor="middle">ÚLTIMO PISO</text>
</svg>
