<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600" role="img" aria-labelledby="esq-title esq-desc">
  <title id="esq-title">Dónde se aísla la cubierta de un edificio de viviendas con buhardilla</title>
  <desc id="esq-desc">Dos cortes de un mismo edificio de cuatro plantas con buhardilla no habitable. A la izquierda, sin aislar: el calor de las viviendas atraviesa el forjado bajo la buhardilla y sale por la cubierta. A la derecha, con 220 milímetros de lana mineral insuflada sobre el forjado: el calor queda frenado bajo la capa de aislante. Se accede a la buhardilla por una trampilla, sin obras en las viviendas. Esquema ilustrativo, sin escala.</desc>
  <defs>
    <marker id="esq-heat" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/>
    </marker>
    <pattern id="esq-lana" width="14" height="12" patternUnits="userSpaceOnUse">
      <rect width="14" height="12" fill="#ffffff"/>
      <circle cx="4" cy="4" r="2.6" fill="#d9cfb8"/>
      <circle cx="11" cy="9" r="2.2" fill="#d9cfb8"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="640" height="600" rx="18" fill="#faf6ec"/>
  <line x1="320" y1="70" x2="320" y2="580" stroke="#e3dccb" stroke-width="2"/>

  <g font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#1a2e1f" text-anchor="middle">
    <text x="160" y="48">Sin aislar</text>
    <text x="480" y="48">Buhardilla aislada</text>
  </g>

  <!-- ===== Panel izquierdo : sin aislar ===== -->
  <g>
    <polygon points="30,200 160,90 290,200" fill="#efe4cf"/>
    <polyline points="22,207 160,90 298,207" fill="none" stroke="#8a4f22" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="160" y="180" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="22" fill="#5a6b4a" text-anchor="middle">Buhardilla</text>
    <rect x="40" y="200" width="240" height="10" fill="#5a6b4a"/>
    <rect x="40" y="210" width="240" height="280" fill="#ffffff" stroke="#1a2e1f" stroke-width="2"/>
    <rect x="50" y="210" width="30" height="280" fill="#ebe5d6"/>
    <rect x="52" y="199" width="26" height="12" fill="#1a2e1f"/>
    <g stroke="#1a2e1f" stroke-opacity="0.25" stroke-width="2">
      <line x1="40" y1="280" x2="280" y2="280"/>
      <line x1="40" y1="350" x2="280" y2="350"/>
      <line x1="40" y1="420" x2="280" y2="420"/>
    </g>
    <g fill="#dfe9e0">
      <rect x="110" y="298" width="36" height="34" rx="3"/><rect x="214" y="298" width="36" height="34" rx="3"/>
      <rect x="110" y="368" width="36" height="34" rx="3"/><rect x="214" y="368" width="36" height="34" rx="3"/>
      <rect x="110" y="438" width="36" height="34" rx="3"/><rect x="214" y="438" width="36" height="34" rx="3"/>
    </g>
    <g stroke="#c2410c" stroke-width="5" stroke-linecap="round" marker-end="url(#esq-heat)">
      <line x1="90" y1="268" x2="90" y2="118"/>
      <line x1="230" y1="268" x2="230" y2="122"/>
      <line x1="262" y1="268" x2="262" y2="150"/>
    </g>
    <line x1="20" y1="490" x2="300" y2="490" stroke="#5a6b4a" stroke-width="3"/>
  </g>

  <!-- ===== Panel derecho : buhardilla aislada ===== -->
  <g>
    <polygon points="350,200 480,90 610,200" fill="#efe4cf"/>
    <polygon points="360,200 600,200 581.6,176 378.4,176" fill="url(#esq-lana)" stroke="#c8c2b0" stroke-width="1.5"/>
    <polyline points="342,207 480,90 618,207" fill="none" stroke="#8a4f22" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="480" y="168" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="22" fill="#5a6b4a" text-anchor="middle">Buhardilla</text>
    <rect x="360" y="200" width="240" height="10" fill="#5a6b4a"/>
    <rect x="360" y="210" width="240" height="280" fill="#ffffff" stroke="#1a2e1f" stroke-width="2"/>
    <rect x="370" y="210" width="30" height="280" fill="#ebe5d6"/>
    <rect x="372" y="199" width="26" height="12" fill="#1a2e1f"/>
    <g stroke="#1a2e1f" stroke-opacity="0.25" stroke-width="2">
      <line x1="360" y1="280" x2="600" y2="280"/>
      <line x1="360" y1="350" x2="600" y2="350"/>
      <line x1="360" y1="420" x2="600" y2="420"/>
    </g>
    <g fill="#dfe9e0">
      <rect x="430" y="298" width="36" height="34" rx="3"/><rect x="534" y="298" width="36" height="34" rx="3"/>
      <rect x="430" y="368" width="36" height="34" rx="3"/><rect x="534" y="368" width="36" height="34" rx="3"/>
      <rect x="430" y="438" width="36" height="34" rx="3"/><rect x="534" y="438" width="36" height="34" rx="3"/>
    </g>
    <g stroke="#c2410c" stroke-width="5" stroke-linecap="round" marker-end="url(#esq-heat)">
      <line x1="515" y1="268" x2="515" y2="222"/>
      <line x1="575" y1="268" x2="575" y2="222"/>
    </g>
    <text x="410" y="252" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="22" fill="#1a2e1f">Trampilla</text>
    <line x1="408" y1="236" x2="390" y2="212" stroke="#1a2e1f" stroke-width="2"/>
    <line x1="340" y1="490" x2="620" y2="490" stroke="#5a6b4a" stroke-width="3"/>
  </g>

  <g font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="24" fill="#1a2e1f" text-anchor="middle">
    <text x="160" y="532">El calor escapa</text>
    <text x="160" y="564">por la cubierta</text>
    <text x="480" y="532">220 mm de lana mineral</text>
    <text x="480" y="564">sobre el forjado</text>
  </g>
</svg>
