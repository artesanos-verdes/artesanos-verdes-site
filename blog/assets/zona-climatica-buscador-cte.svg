<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="zcb-title zcb-desc" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif">
  <title id="zcb-title">Buscador de zona climática por provincia y altitud</title>
  <desc id="zcb-desc">Ilustración de una montaña con curvas de nivel y una casa en la ladera. A la derecha, tres casillas C, D y E indican que la zona climática de invierno se vuelve más severa a medida que aumenta la altitud.</desc>

  <defs>
    <clipPath id="zcb-monte">
      <path d="M118,300 L196,214 L232,236 L300,132 L356,196 L384,178 L440,300 Z"/>
    </clipPath>
  </defs>

  <!-- ===== FONDO + ESCENARIO ===== -->
  <rect width="640" height="420" fill="#f7f7f5"/>
  <circle cx="320" cy="180" r="150" fill="#e9f2ec"/>

  <!-- ===== REGLA DE ALTITUD (h) ===== -->
  <g stroke="#1a4d30" stroke-linecap="round" fill="none">
    <line x1="82" y1="300" x2="82" y2="128" stroke-width="3"/>
    <path d="M74,140 L82,126 L90,140" stroke-width="3" stroke-linejoin="round"/>
    <line x1="76" y1="250" x2="88" y2="250" stroke-width="3"/>
    <line x1="76" y1="200" x2="88" y2="200" stroke-width="3"/>
  </g>
  <text x="82" y="112" fill="#1a4d30" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="700" font-style="italic" text-anchor="middle">h</text>

  <!-- ===== MONTAÑA ===== -->
  <path d="M118,300 L196,214 L232,236 L300,132 L356,196 L384,178 L440,300 Z" fill="#ffffff"/>
  <!-- curvas de nivel (dentro de la montaña) -->
  <g clip-path="url(#zcb-monte)" fill="none" stroke="#a8c4b0" stroke-width="3" stroke-dasharray="9 7" stroke-linecap="round">
    <line x1="110" y1="250" x2="450" y2="250"/>
    <line x1="110" y1="200" x2="450" y2="200"/>
    <line x1="110" y1="160" x2="450" y2="160"/>
  </g>
  <!-- nieve en la cumbre -->
  <path d="M281,161 L300,132 L319,154 L310,151 L301,160 L291,153 Z" fill="#e9f2ec" stroke="#1a4d30" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M118,300 L196,214 L232,236 L300,132 L356,196 L384,178 L440,300 Z" fill="none" stroke="#1a4d30" stroke-width="4" stroke-linejoin="round"/>

  <!-- prolongación de las curvas hacia las casillas -->
  <g fill="none" stroke="#a8c4b0" stroke-width="3" stroke-dasharray="9 7" stroke-linecap="round">
    <line x1="424" y1="250" x2="462" y2="250"/>
    <line x1="401" y1="200" x2="462" y2="200"/>
  </g>

  <!-- ===== CASA EN LA LADERA ===== -->
  <path d="M236,224 L276,224" stroke="#1a4d30" stroke-width="3" stroke-linecap="round"/>
  <rect x="244" y="204" width="26" height="20" fill="#ffffff" stroke="#1a4d30" stroke-width="3" stroke-linejoin="round"/>
  <path d="M239,206 L257,190 L275,206" fill="none" stroke="#1a4d30" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="253" y="212" width="8" height="12" fill="#a8c4b0" stroke="#1a4d30" stroke-width="2"/>

  <!-- marcador de ubicación -->
  <g transform="translate(257,150)">
    <path d="M0,28 C-6,18 -15,11 -15,0 A15,15 0 0 1 15,0 C15,11 6,18 0,28 Z" fill="#22a044" stroke="#1a4d30" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="5.5" fill="#ffffff"/>
  </g>

  <!-- ===== CASILLAS DE ZONA (C, D, E) ===== -->
  <rect x="470" y="255" width="64" height="40" rx="9" fill="#3f7a53"/>
  <rect x="470" y="205" width="64" height="40" rx="9" fill="#2d5a3d"/>
  <rect x="470" y="155" width="64" height="40" rx="9" fill="#1a4d30"/>
  <g fill="#ffffff" font-family="'Source Serif 4', Georgia, serif" font-size="25" font-weight="700" text-anchor="middle">
    <text x="502" y="284">C</text>
    <text x="502" y="234">D</text>
    <text x="502" y="184">E</text>
  </g>
  <!-- flecha: más frío con la altitud -->
  <g stroke="#1a4d30" stroke-linecap="round" fill="none">
    <line x1="552" y1="292" x2="552" y2="162" stroke-width="3"/>
    <path d="M545,174 L552,160 L559,174" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- ===== SUELO ===== -->
  <path d="M100,300 L540,300" fill="none" stroke="#a8c4b0" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== ETIQUETA ===== -->
  <line x1="306" y1="344" x2="334" y2="344" stroke="#22a044" stroke-width="4" stroke-linecap="round"/>
  <text x="320" y="378" fill="#1a4d30" font-size="24" font-weight="700" letter-spacing="4" text-anchor="middle">ZONA CLIMÁTICA</text>
</svg>
