<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Aerotermia y placas solares en un día de invierno</title>
  <desc id="hero-desc">Infografía esquemática, sin escala ni cifras, de un día de invierno. A la izquierda, un gráfico a lo largo del día, de la noche a la noche: la producción de las placas solares es una curva baja y estrecha centrada en el mediodía; el consumo de la bomba de calor sube en las horas frías de la mañana y de la noche y tiene un pico a mediodía, cuando se programa el agua caliente; donde la producción supera al consumo hay excedentes. Una flecha lleva la producción del mediodía al depósito de agua caliente sanitaria, a la derecha, que la guarda en forma de calor para la tarde y la noche. Abajo, un recuadro: la fórmula de la ficha RES060_FM no tiene ninguna variable fotovoltaica; usa la demanda, la superficie, el agua caliente, el rendimiento de la caldera, el SCOP y el coeficiente, así que el ahorro reconocido es el mismo con placas o sin ellas.</desc>
  <defs>
    <linearGradient id="agua-acs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8733a" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#b8733a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22a044" stop-opacity="0.15"/>
    </linearGradient>
    <marker id="flecha-calor" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#b8733a"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#f5efe1"/>
  <text x="800" y="84" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="50" font-weight="700" fill="#1a2e1f">Aerotermia y placas solares en un día de invierno</text>
  <text x="800" y="132" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="28" fill="#1a2e1f">Esquema sin escala: cuándo producen las placas y cuándo consume la bomba</text>
  <line x1="70" y1="164" x2="1530" y2="164" stroke="#22a044" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Gráfico del día -->
  <rect x="70" y="194" width="1000" height="560" rx="18" fill="#ffffff" stroke="#1a2e1f" stroke-width="3"/>
  <line x1="110" y1="240" x2="160" y2="240" stroke="#b8733a" stroke-width="8" stroke-linecap="round"/>
  <text x="176" y="248" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f">Producción de las placas</text>
  <line x1="520" y1="240" x2="570" y2="240" stroke="#22a044" stroke-width="8" stroke-linecap="round"/>
  <text x="586" y="248" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f">Consumo de la bomba de calor</text>

  <!-- Sol -->
  <g stroke="#b8733a" stroke-width="5" stroke-linecap="round">
    <line x1="570" y1="288" x2="570" y2="300"/>
    <line x1="570" y1="360" x2="570" y2="372"/>
    <line x1="528" y1="330" x2="540" y2="330"/>
    <line x1="600" y1="330" x2="612" y2="330"/>
    <line x1="540" y1="300" x2="549" y2="309"/>
    <line x1="591" y1="351" x2="600" y2="360"/>
    <line x1="600" y1="300" x2="591" y2="309"/>
    <line x1="549" y1="351" x2="540" y2="360"/>
  </g>
  <circle cx="570" cy="330" r="22" fill="#b8733a"/>

  <!-- Producción de las placas -->
  <path d="M 330 676 C 430 676 470 440 570 440 C 670 440 710 676 810 676 Z" fill="#b8733a" fill-opacity="0.18" stroke="#b8733a" stroke-width="6" stroke-linejoin="round"/>

  <!-- Consumo de la bomba de calor -->
  <path d="M 110 560 C 180 548 230 468 300 466 C 370 464 400 592 460 596 C 510 600 530 516 570 516 C 610 516 630 600 680 600 C 740 600 790 470 870 464 C 950 458 990 540 1030 556" fill="none" stroke="#22a044" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="570" cy="516" r="11" fill="#22a044" stroke="#ffffff" stroke-width="3"/>

  <!-- Eje del día -->
  <line x1="110" y1="676" x2="1030" y2="676" stroke="#1a2e1f" stroke-width="3"/>
  <text x="150" y="716" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" fill="#1a2e1f">Noche</text>
  <text x="330" y="716" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" fill="#1a2e1f">Mañana</text>
  <text x="570" y="716" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" fill="#1a2e1f">Mediodía</text>
  <text x="810" y="716" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" fill="#1a2e1f">Tarde</text>
  <text x="990" y="716" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" fill="#1a2e1f">Noche</text>

  <!-- Anotaciones -->
  <text x="300" y="446" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" font-weight="700" fill="#1a2e1f">Horas frías</text>
  <text x="870" y="444" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" font-weight="700" fill="#1a2e1f">Horas frías</text>
  <text x="570" y="640" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" font-weight="700" fill="#1a2e1f">Agua caliente a mediodía</text>
  <text x="400" y="398" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" font-weight="700" fill="#b8733a">Excedentes</text>
  <line x1="430" y1="408" x2="508" y2="500" stroke="#b8733a" stroke-width="2.5"/>

  <!-- Depósito de ACS -->
  <rect x="1110" y="194" width="420" height="560" rx="18" fill="#ffffff" stroke="#22a044" stroke-width="3"/>
  <rect x="1126" y="210" width="388" height="72" rx="12" fill="#1a2e1f"/>
  <text x="1320" y="257" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="32" font-weight="700" fill="#f5efe1">El depósito de ACS</text>
  <line x1="1222" y1="380" x2="1250" y2="380" stroke="#1a2e1f" stroke-width="6" stroke-linecap="round"/>
  <line x1="1222" y1="540" x2="1250" y2="540" stroke="#1a2e1f" stroke-width="6" stroke-linecap="round"/>
  <rect x="1250" y="320" width="140" height="260" rx="56" fill="url(#agua-acs)" stroke="#1a2e1f" stroke-width="4"/>
  <text x="1320" y="636" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f">Calentado con sol,</text>
  <text x="1320" y="668" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f">guarda el calor para</text>
  <text x="1320" y="700" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f">la tarde y la noche</text>

  <!-- Del mediodía al depósito -->
  <path d="M 640 470 C 800 360 1010 340 1236 446" fill="none" stroke="#b8733a" stroke-width="4" stroke-dasharray="12 9" marker-end="url(#flecha-calor)"/>
  <text x="940" y="338" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" font-weight="700" fill="#b8733a">Se guarda como calor</text>

  <!-- Recuadro CAE -->
  <rect x="70" y="784" width="1460" height="180" rx="18" fill="#1a2e1f"/>
  <text x="800" y="846" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="36" font-weight="700" fill="#f5efe1">La fórmula de la RES060_FM no tiene ninguna variable fotovoltaica</text>
  <text x="800" y="892" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" fill="#f5efe1">Demanda, superficie, agua caliente, rendimiento de la caldera, SCOP y coeficiente:</text>
  <text x="800" y="934" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" font-weight="700" fill="#f5efe1">el ahorro reconocido es el mismo con placas o sin ellas</text>
</svg>
