<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="frio-title frio-desc" font-family="'Source Sans 3', Arial, sans-serif">
  <title id="frio-title">Bomba de calor funcionando con frío</title>
  <desc id="frio-desc">Unidad exterior de aerotermia junto a una vivienda nevada, con copos de nieve alrededor y ondas de calor que llegan a la casa.</desc>

  <!-- ===== FONDO + ESCENARIO ===== -->
  <rect width="640" height="420" fill="#f7f7f5"/>
  <circle cx="320" cy="180" r="150" fill="#e9f2ec"/>

  <!-- ===== ESQUINA DE LA VIVIENDA (con nieve) ===== -->
  <rect x="176" y="176" width="76" height="122" fill="#ffffff" stroke="#1a4d30" stroke-width="4" stroke-linejoin="round"/>
  <path d="M168,176 L214,138 L260,176" fill="none" stroke="#1a4d30" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M176,168 L214,137 L252,168 Q236,162 222,166 Q206,160 190,166 Z" fill="#ffffff" stroke="#1a4d30" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="196" y="206" width="36" height="40" rx="4" fill="#a8c4b0" stroke="#1a4d30" stroke-width="3"/>
  <line x1="214" y1="206" x2="214" y2="246" stroke="#1a4d30" stroke-width="2"/>
  <line x1="196" y1="226" x2="232" y2="226" stroke="#1a4d30" stroke-width="2"/>

  <!-- ===== CONEXIONES ===== -->
  <path d="M288,214 C270,214 260,224 252,232" fill="none" stroke="#1a4d30" stroke-width="8" stroke-linecap="round"/>
  <path d="M288,214 C270,214 260,224 252,232" fill="none" stroke="#a8c4b0" stroke-width="4" stroke-linecap="round"/>

  <!-- ===== UNIDAD EXTERIOR ===== -->
  <rect x="288" y="176" width="180" height="112" rx="14" fill="#ffffff" stroke="#1a4d30" stroke-width="4"/>
  <!-- nieve sobre la unidad -->
  <path d="M292,178 Q296,164 314,166 Q326,158 342,166 Q360,158 376,166 Q392,158 408,166 Q426,158 442,166 Q462,164 464,178 Z" fill="#ffffff" stroke="#1a4d30" stroke-width="2.5" stroke-linejoin="round"/>
  <g stroke="#a8c4b0" stroke-width="5" stroke-linecap="round">
    <line x1="306" y1="206" x2="352" y2="206"/>
    <line x1="306" y1="220" x2="352" y2="220"/>
    <line x1="306" y1="234" x2="352" y2="234"/>
    <line x1="306" y1="248" x2="352" y2="248"/>
  </g>
  <circle cx="402" cy="232" r="44" fill="#f7f7f5" stroke="#1a4d30" stroke-width="3"/>
  <g transform="translate(402,232)" fill="#a8c4b0" stroke="#1a4d30" stroke-width="1.5" stroke-linejoin="round">
    <path d="M0,0 C6,-12 3,-28 -6,-36 C1,-22 -3,-10 0,0 Z" transform="rotate(10)"/>
    <path d="M0,0 C6,-12 3,-28 -6,-36 C1,-22 -3,-10 0,0 Z" transform="rotate(130)"/>
    <path d="M0,0 C6,-12 3,-28 -6,-36 C1,-22 -3,-10 0,0 Z" transform="rotate(250)"/>
  </g>
  <circle cx="402" cy="232" r="8" fill="#22a044" stroke="#1a4d30" stroke-width="1.5"/>
  <g stroke="#1a4d30" stroke-width="5" stroke-linecap="round">
    <line x1="316" y1="288" x2="316" y2="300"/>
    <line x1="440" y1="288" x2="440" y2="300"/>
  </g>

  <!-- ===== COPOS DE NIEVE ===== -->
  <g stroke="#1a4d30" stroke-width="2.5" stroke-linecap="round">
    <g transform="translate(300,104)">
      <line x1="0" y1="-12" x2="0" y2="12"/><line x1="-10" y1="-6" x2="10" y2="6"/><line x1="-10" y1="6" x2="10" y2="-6"/>
    </g>
    <g transform="translate(372,82)">
      <line x1="0" y1="-14" x2="0" y2="14"/><line x1="-12" y1="-7" x2="12" y2="7"/><line x1="-12" y1="7" x2="12" y2="-7"/>
    </g>
    <g transform="translate(444,120)">
      <line x1="0" y1="-10" x2="0" y2="10"/><line x1="-9" y1="-5" x2="9" y2="5"/><line x1="-9" y1="5" x2="9" y2="-5"/>
    </g>
    <g transform="translate(232,96)">
      <line x1="0" y1="-9" x2="0" y2="9"/><line x1="-8" y1="-4.5" x2="8" y2="4.5"/><line x1="-8" y1="4.5" x2="8" y2="-4.5"/>
    </g>
  </g>

  <!-- ===== ONDAS DE CALOR HACIA LA CASA ===== -->
  <g fill="none" stroke="#22a044" stroke-width="3.5" stroke-linecap="round">
    <path d="M276,262 q-6,6 -12,0 q-6,-6 -12,0"/>
    <path d="M276,276 q-6,6 -12,0 q-6,-6 -12,0"/>
  </g>

  <!-- ===== SUELO NEVADO ===== -->
  <path d="M150,300 Q200,292 250,298 Q300,292 350,298 Q400,292 450,298 L490,300" fill="none" stroke="#a8c4b0" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== ETIQUETA ===== -->
  <line x1="306" y1="344" x2="334" y2="344" stroke="#22a044" stroke-width="4" stroke-linecap="round"/>
  <text x="320" y="378" fill="#1a4d30" font-size="26" font-weight="700" letter-spacing="5" text-anchor="middle">FRÍO</text>
</svg>
