<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="cons-title cons-desc" font-family="'Source Sans 3', Arial, sans-serif">
  <title id="cons-title">Aerotermia y consumo eléctrico</title>
  <desc id="cons-desc">Unidad exterior de aerotermia conectada a un enchufe, con un rayo que representa el consumo de electricidad.</desc>

  <!-- ===== FONDO + ESCENARIO ===== -->
  <rect width="640" height="420" fill="#f7f7f5"/>
  <circle cx="320" cy="180" r="150" fill="#e9f2ec"/>

  <!-- ===== ENCHUFE ===== -->
  <rect x="180" y="190" width="64" height="72" rx="12" fill="#ffffff" stroke="#1a4d30" stroke-width="4"/>
  <circle cx="212" cy="226" r="20" fill="#f7f7f5" stroke="#1a4d30" stroke-width="3"/>
  <circle cx="204" cy="226" r="3.5" fill="#1a4d30"/>
  <circle cx="220" cy="226" r="3.5" fill="#1a4d30"/>

  <!-- ===== CABLE ===== -->
  <path d="M288,240 C268,240 262,226 244,226" fill="none" stroke="#1a4d30" stroke-width="8" stroke-linecap="round"/>
  <path d="M288,240 C268,240 262,226 244,226" fill="none" stroke="#a8c4b0" stroke-width="4" stroke-linecap="round"/>

  <!-- ===== RAYO (electricidad) ===== -->
  <g transform="translate(212,138)">
    <circle cx="0" cy="0" r="30" fill="#ffffff" stroke="#1a4d30" stroke-width="3"/>
    <path d="M4,-20 L-10,3 L0,3 L-4,20 L11,-4 L1,-4 Z" fill="#22a044" stroke="#1a4d30" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- ===== UNIDAD EXTERIOR ===== -->
  <rect x="288" y="176" width="180" height="112" rx="14" fill="#ffffff" stroke="#1a4d30" stroke-width="4"/>
  <g stroke="#a8c4b0" stroke-width="5" stroke-linecap="round">
    <line x1="306" y1="206" x2="352" y2="206"/>
    <line x1="306" y1="220" x2="352" y2="220"/>
    <line x1="306" y1="234" x2="352" y2="234"/>
    <line x1="306" y1="248" x2="352" y2="248"/>
  </g>
  <circle cx="402" cy="232" r="44" fill="#f7f7f5" stroke="#1a4d30" stroke-width="3"/>
  <g transform="translate(402,232)" fill="#a8c4b0" stroke="#1a4d30" stroke-width="1.5" stroke-linejoin="round">
    <path d="M0,0 C6,-12 3,-28 -6,-36 C1,-22 -3,-10 0,0 Z" transform="rotate(10)"/>
    <path d="M0,0 C6,-12 3,-28 -6,-36 C1,-22 -3,-10 0,0 Z" transform="rotate(130)"/>
    <path d="M0,0 C6,-12 3,-28 -6,-36 C1,-22 -3,-10 0,0 Z" transform="rotate(250)"/>
  </g>
  <circle cx="402" cy="232" r="8" fill="#22a044" stroke="#1a4d30" stroke-width="1.5"/>
  <g stroke="#1a4d30" stroke-width="5" stroke-linecap="round">
    <line x1="316" y1="288" x2="316" y2="300"/>
    <line x1="440" y1="288" x2="440" y2="300"/>
  </g>

  <!-- ===== ONDAS DE CALOR ===== -->
  <g fill="none" stroke-linecap="round">
    <path d="M372,160 q11,-13 0,-26 q-11,-13 0,-26" stroke="#a8c4b0" stroke-width="3.5"/>
    <path d="M402,158 q12,-14 0,-28 q-12,-14 0,-28" stroke="#22a044" stroke-width="4"/>
    <path d="M432,160 q11,-13 0,-26 q-11,-13 0,-26" stroke="#a8c4b0" stroke-width="3.5"/>
  </g>

  <!-- ===== SUELO ===== -->
  <line x1="150" y1="300" x2="490" y2="300" stroke="#a8c4b0" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== ETIQUETA ===== -->
  <line x1="306" y1="344" x2="334" y2="344" stroke="#22a044" stroke-width="4" stroke-linecap="round"/>
  <text x="320" y="378" fill="#1a4d30" font-size="26" font-weight="700" letter-spacing="5" text-anchor="middle">CONSUMO</text>
</svg>
