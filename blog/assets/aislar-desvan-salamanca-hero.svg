    <rect x="1010" y="394" width="480" height="40" fill="#c1d9cc"/>
    <path d="M1014 416 q10 -12 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="#2d7a4e" stroke-width="3" stroke-linecap="round"/>
    <line x1="1010" y1="394" x2="1490" y2="394" stroke="#1a4d30" stroke-width="3"/>
  </g>
  <rect x="1205" y="401" width="90" height="26" rx="13" fill="#f5efe1" stroke="#1a4d30" stroke-width="2"/>
  <text x="1250" y="420" font-size="18" font-weight="700" fill="#1a2e1f" text-anchor="middle">220 mm</text>

