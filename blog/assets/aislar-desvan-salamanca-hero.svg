  <rect x="990" y="440" width="520" height="270" fill="#ffffff" stroke="#1a4d30" stroke-width="6"/>
  <line x1="960" y1="440" x2="1540" y2="440" stroke="#1a4d30" stroke-width="6"/>
  <line x1="990" y1="530" x2="1510" y2="530" stroke="#1a4d30" stroke-width="3"/>
  <line x1="990" y1="620" x2="1510" y2="620" stroke="#1a4d30" stroke-width="3"/>
  <text x="1250" y="494" font-size="24" fill="#2d7a4e" text-anchor="middle">Último piso</text>
  <rect x="1040" y="462" width="80" height="48" rx="3" fill="#c1d9cc" stroke="#1a4d30" stroke-width="4"/>
  <rect x="1380" y="462" width="80" height="48" rx="3" fill="#c1d9cc" stroke="#1a4d30" stroke-width="4"/>
  <rect x="1040" y="552" width="80" height="48" rx="3" fill="#c1d9cc" stroke="#1a4d30" stroke-width="4"/>
  <rect x="1210" y="552" width="80" height="48" rx="3" fill="#c1d9cc" stroke="#1a4d30" stroke-width="4"/>
  <rect x="1380" y="552" width="80" height="48" rx="3" fill="#c1d9cc" stroke="#1a4d30" stroke-width="4"/>
  <rect x="1040" y="642" width="80" height="48" rx="3" fill="#c1d9cc" stroke="#1a4d30" stroke-width="4"/>
  <rect x="1210" y="642" width="80" height="68" rx="3" fill="#c1d9cc" stroke="#1a4d30" stroke-width="4"/>
  <rect x="1380" y="642" width="80" height="48" rx="3" fill="#c1d9cc" stroke="#1a4d30" stroke-width="4"/>

  <!-- Etiquetas del aislamiento -->
  <text x="1250" y="790" font-family="'Source Serif 4', Georgia, serif" font-size="34" font-weight="700" fill="#1a2e1f" text-anchor="middle">220 mm de lana mineral insuflada</text>
  <text x="1250" y="830" font-size="24" fill="#2d7a4e" text-anchor="middle">R = 4,75 m²·K/W · la ficha RES022 pide 4,7 en zona E</text>
  <text x="1250" y="868" font-size="22" fill="#1a2e1f" text-anchor="middle" opacity="0.85">El mismo espesor en la capital, en Béjar y en Ciudad Rodrigo</text>

  <!-- Firma -->
  <text x="1520" y="972" font-size="24" fill="#2d7a4e" text-anchor="end">artesanosverdes.com</text>
</svg>
