  <circle cx="770" cy="400" r="34" fill="#1a2e1f"/>
  <text x="770" y="412" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="32" font-weight="700" fill="#ffffff">E1</text>
  <text x="806" y="460" text-anchor="end" font-size="20" fill="#1a2e1f">desde 850 m</text>
  <circle cx="770" cy="860" r="34" fill="#22a044"/>
  <text x="770" y="872" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="32" font-weight="700" fill="#ffffff">D2</text>
  <text x="806" y="812" text-anchor="end" font-size="20" fill="#1a2e1f">por debajo de 850 m</text>

  <!-- Marcadores en su altitud real (x=240, y = 900 - (altitud - 600)); etiquetas separadas con línea de guía -->
