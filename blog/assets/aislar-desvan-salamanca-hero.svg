  <line x1="249" y1="664" x2="298" y2="672" stroke="#1a2e1f" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="310" y="680" font-size="22" fill="#1a2e1f">Alba de Tormes · 836 m</text>

  <!-- Salamanca 798 m (y=702) -->
  <circle cx="240" cy="702" r="11" fill="#22a044" stroke="#f5efe1" stroke-width="3"/>
  <line x1="251" y1="702" x2="298" y2="708" stroke="#22a044" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="310" y="716" font-size="24" font-weight="700" fill="#1a2e1f">Salamanca · 798 m</text>

  <!-- Santa Marta de Tormes 779 m (y=721) -->
  <circle cx="240" cy="721" r="9" fill="#1a2e1f"/>
  <line x1="249" y1="721" x2="298" y2="742" stroke="#1a2e1f" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="310" y="750" font-size="22" fill="#1a2e1f">Santa Marta de Tormes · 779 m</text>

  <!-- Vitigudino 769 m (y=731) -->
  <circle cx="240" cy="731" r="9" fill="#1a2e1f"/>
  <line x1="249" y1="731" x2="298" y2="776" stroke="#1a2e1f" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="310" y="784" font-size="22" fill="#1a2e1f">Vitigudino · 769 m</text>

  <!-- Ciudad Rodrigo 651 m (y=849) -->
  <circle cx="240" cy="849" r="11" fill="#1a2e1f" stroke="#f5efe1" stroke-width="3"/>
  <line x1="251" y1="849" x2="298" y2="849" stroke="#1a2e1f" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="310" y="857" font-size="24" font-weight="700" fill="#1a2e1f">Ciudad Rodrigo · 651 m</text>

  <!-- Nota -->
  <text x="90" y="944" font-size="20" fill="#1a2e1f" opacity="0.8">Altitud de la capital de cada municipio según AEMET; la de tu localidad se confirma en el estudio.</text>
  <text x="90" y="972" font-size="20" fill="#1a2e1f" opacity="0.8">Tabla a-Anejo B del DB-HE: las dos zonas entran en la ficha RES022 del sistema CAE.</text>

  <!-- Sección de un bloque de viviendas (derecha) -->
