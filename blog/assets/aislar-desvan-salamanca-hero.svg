  <line x1="249" y1="597" x2="298" y2="597" stroke="#1a2e1f" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="310" y="605" font-size="22" fill="#1a2e1f">Peñaranda de Bracamonte · 903 m</text>

