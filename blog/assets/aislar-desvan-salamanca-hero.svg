  <polygon points="960,440 1250,250 1540,440" fill="#b8733a"/>
  <polygon points="1010,434 1250,280 1490,434" fill="#faf6ec"/>
  <text x="1250" y="380" font-size="26" fill="#1a2e1f" text-anchor="middle">Desván no habitable</text>

  <!-- Capa de aislamiento sobre el suelo del desván (recortada por la cubierta) -->
