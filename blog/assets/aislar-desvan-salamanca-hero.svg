  <text x="90" y="180" font-family="'Source Serif 4', Georgia, serif" font-size="68" font-weight="700" fill="#1a2e1f">Zona climática D2</text>
  <text x="90" y="226" font-size="28" fill="#1a2e1f" opacity="0.85">Por debajo de 850 m de altitud · a partir de 850 m, zona E1</text>
  <rect x="90" y="248" width="80" height="5" rx="2" fill="#b8733a"/>

  <!-- Escala de altitud (600 a 1150 m): 1 px por metro, 1150 m en y=350 y 600 m en y=900 -->
  <line x1="170" y1="350" x2="170" y2="900" stroke="#1a2e1f" stroke-width="3"/>
  <line x1="160" y1="400" x2="180" y2="400" stroke="#1a2e1f" stroke-width="3"/>
  <line x1="160" y1="500" x2="180" y2="500" stroke="#1a2e1f" stroke-width="3"/>
  <line x1="160" y1="600" x2="180" y2="600" stroke="#1a2e1f" stroke-width="3"/>
  <line x1="160" y1="700" x2="180" y2="700" stroke="#1a2e1f" stroke-width="3"/>
  <line x1="160" y1="800" x2="180" y2="800" stroke="#1a2e1f" stroke-width="3"/>
  <line x1="160" y1="900" x2="180" y2="900" stroke="#1a2e1f" stroke-width="3"/>
  <text x="148" y="408" text-anchor="end" font-size="22" fill="#1a2e1f">1100 m</text>
  <text x="148" y="508" text-anchor="end" font-size="22" fill="#1a2e1f">1000 m</text>
  <text x="148" y="608" text-anchor="end" font-size="22" fill="#1a2e1f">900 m</text>
  <text x="148" y="708" text-anchor="end" font-size="22" fill="#1a2e1f">800 m</text>
  <text x="148" y="808" text-anchor="end" font-size="22" fill="#1a2e1f">700 m</text>
  <text x="148" y="908" text-anchor="end" font-size="22" fill="#1a2e1f">600 m</text>

  <!-- Franja E1: 850 m o más (y=350 a 650) -->
  <rect x="200" y="350" width="620" height="300" fill="#1a2e1f" opacity="0.10"/>
  <rect x="200" y="350" width="620" height="300" fill="none" stroke="#1a2e1f" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- Franja D2: por debajo de 850 m (y=650 a 900) -->
  <rect x="200" y="650" width="620" height="250" fill="#22a044" opacity="0.16"/>
  <rect x="200" y="650" width="620" height="250" fill="none" stroke="#22a044" stroke-width="3"/>
  <!-- Umbral de 850 m -->
