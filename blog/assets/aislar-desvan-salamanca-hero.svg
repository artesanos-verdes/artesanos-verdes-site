<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="'Source Sans 3', Arial, sans-serif" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Provincia de Salamanca, zona climática D2 por debajo de 850 m y E1 a partir de 850 m: altitud de los principales municipios y desván aislado con 220 mm de lana mineral</title>
  <desc id="hero-desc">Esquema en dos partes, sin contorno geográfico. A la izquierda, una escala de altitud de 600 a 1150 metros: la tabla a-Anejo B del Código Técnico asigna la zona por provincia y tramo de altitud, y en la fila de Salamanca da D2 por debajo de 850 metros y E1 a partir de 850 metros. En la franja E1 aparecen Candelario, a 1136 metros, La Alberca a 1044, Guijuelo a 1003, Béjar a 953 y Peñaranda de Bracamonte a 903; en la franja D2, Alba de Tormes a 836, Salamanca a 798, Santa Marta de Tormes a 779, Vitigudino a 769 y Ciudad Rodrigo a 651, según la altitud que AEMET publica para la capital de cada municipio. Las dos franjas son elegibles para la ficha RES022 del sistema CAE. A la derecha, la sección de un bloque de viviendas con el desván no habitable sobre el último piso y una capa de 220 milímetros de lana mineral insuflada sobre el suelo del desván, con una resistencia térmica de 4,75 metros cuadrados kelvin por vatio.</desc>

  <defs>
    <clipPath id="hero-desvan-clip">
      <polygon points="1010,434 1250,280 1490,434"/>
    </clipPath>
  </defs>

  <!-- Fondo -->
  <rect width="1600" height="1000" fill="#f5efe1"/>

  <!-- Cabecera izquierda -->
