    <rect x="832" y="542" width="72" height="50" rx="3"/>
    <rect x="948" y="542" width="72" height="50" rx="3"/>
    <rect x="600" y="654" width="72" height="50" rx="3"/>
    <rect x="716" y="654" width="72" height="50" rx="3"/>
