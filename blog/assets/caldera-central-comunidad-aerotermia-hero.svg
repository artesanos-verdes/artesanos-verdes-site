    <line x1="868" y1="318" x2="868" y2="368"/>
    <line x1="984" y1="318" x2="984" y2="368"/>
    <line x1="636" y1="430" x2="636" y2="480"/>
    <line x1="752" y1="430" x2="752" y2="480"/>
    <line x1="868" y1="430" x2="868" y2="480"/>
    <line x1="984" y1="430" x2="984" y2="480"/>
    <line x1="636" y1="542" x2="636" y2="592"/>
    <line x1="752" y1="542" x2="752" y2="592"/>
    <line x1="868" y1="542" x2="868" y2="592"/>
    <line x1="984" y1="542" x2="984" y2="592"/>
    <line x1="636" y1="654" x2="636" y2="704"/>
    <line x1="752" y1="654" x2="752" y2="704"/>
