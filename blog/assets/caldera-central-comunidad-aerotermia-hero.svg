    <line x1="520" y1="412" x2="1080" y2="412"/>
    <line x1="520" y1="524" x2="1080" y2="524"/>
    <line x1="520" y1="636" x2="1080" y2="636"/>
    <line x1="520" y1="748" x2="1080" y2="748"/>
  </g>
  <rect x="520" y="300" width="560" height="560" fill="none" stroke="#1a4d30" stroke-width="6"/>
  <rect x="504" y="288" width="592" height="16" rx="3" fill="#1a4d30"/>

