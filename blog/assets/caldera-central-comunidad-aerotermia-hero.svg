<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Calefacción central con bombas de calor en un edificio de viviendas</title>
  <desc id="hero-desc">Sección esquemática de un bloque de viviendas. Sobre la cubierta plana, tres bombas de calor aire-agua captan la energía del aire exterior. Dos tuberías bajan por un lateral del edificio hasta la sala de calderas del sótano, donde hay un depósito de inercia, un acumulador de agua caliente sanitaria y la caldera existente, dibujada con trazo discontinuo como apoyo opcional. Desde el depósito, el circuito sube por el otro lateral y alimenta los radiadores situados bajo las ventanas de cada planta.</desc>

  <!-- Fondo y terreno -->
  <rect width="1600" height="1000" fill="#f5efe1"/>
  <rect x="0" y="860" width="1600" height="140" fill="#c1d9cc"/>
  <line x1="0" y1="860" x2="1600" y2="860" stroke="#2d7a4e" stroke-width="4"/>

  <!-- Edificio: muros y forjados -->
  <rect x="520" y="300" width="560" height="560" fill="#ffffff"/>
