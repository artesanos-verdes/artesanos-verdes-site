  <text x="468" y="150" text-anchor="end" font-family="'Source Serif 4', serif" font-size="46" font-weight="700" fill="#1a4d30">Aire exterior</text>
  <text x="468" y="190" text-anchor="end" font-family="'Source Sans 3', sans-serif" font-size="28" fill="#2d7a4e">la energía que se capta</text>

  <text x="1132" y="190" font-family="'Source Serif 4', serif" font-size="46" font-weight="700" fill="#1a4d30">Bombas de calor</text>
  <text x="1132" y="230" font-family="'Source Sans 3', sans-serif" font-size="28" fill="#2d7a4e">aire-agua en cascada,</text>
  <text x="1132" y="266" font-family="'Source Sans 3', sans-serif" font-size="28" fill="#2d7a4e">sobre la cubierta</text>

  <text x="468" y="482" text-anchor="end" font-family="'Source Serif 4', serif" font-size="46" font-weight="700" fill="#1a4d30">Radiadores</text>
  <text x="468" y="522" text-anchor="end" font-family="'Source Sans 3', sans-serif" font-size="28" fill="#2d7a4e">el circuito existente,</text>
  <text x="468" y="558" text-anchor="end" font-family="'Source Sans 3', sans-serif" font-size="28" fill="#2d7a4e">si el estudio lo confirma</text>

  <text x="1132" y="904" font-family="'Source Serif 4', serif" font-size="46" font-weight="700" fill="#1a4d30">Sala de calderas</text>
  <text x="1132" y="942" font-family="'Source Sans 3', sans-serif" font-size="28" fill="#2d7a4e">depósito de inercia, ACS</text>
  <text x="1132" y="976" font-family="'Source Sans 3', sans-serif" font-size="28" fill="#2d7a4e">y caldera de apoyo opcional</text>
</svg>
