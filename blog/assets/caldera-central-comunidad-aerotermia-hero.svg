    <path d="M622 494 V506 M636 494 V506 M650 494 V506 M738 494 V506 M752 494 V506 M766 494 V506 M854 494 V506 M868 494 V506 M882 494 V506 M970 494 V506 M984 494 V506 M998 494 V506"/>
