  <g stroke="#1a4d30" stroke-width="3">
    <path d="M644 200 H680 M662 182 V218 M772 200 H808 M790 182 V218 M900 200 H936 M918 182 V218"/>
  </g>
  <g fill="#1a4d30">
    <circle cx="662" cy="200" r="6"/>
    <circle cx="790" cy="200" r="6"/>
    <circle cx="918" cy="200" r="6"/>
  </g>
  <g stroke="#c1d9cc" stroke-width="4" stroke-linecap="round">
    <path d="M622 238 H702 M622 246 H702 M750 238 H830 M750 246 H830 M878 238 H958 M878 246 H958"/>
  </g>

  <!-- Aire exterior -->
  <g fill="none" stroke="#22a044" stroke-width="4" stroke-linecap="round">
    <path d="M626 140 q12 -12 24 0 t24 0 t24 0"/>
    <path d="M754 140 q12 -12 24 0 t24 0 t24 0"/>
    <path d="M882 140 q12 -12 24 0 t24 0 t24 0"/>
  </g>

  <!-- Circuito de producción: de la cubierta a la sala de calderas -->
