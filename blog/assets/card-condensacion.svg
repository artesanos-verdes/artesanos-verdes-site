<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="cond-title cond-desc" font-family="'Source Sans 3', Arial, sans-serif">
  <title id="cond-title">Condensación y humedad en el desván</title>
  <desc id="cond-desc">Sección de una vivienda: gotas de condensación bajo el tejado del desván, aislamiento sobre el forjado y aire que entra por los aleros y sale por la cumbrera.</desc>

  <!-- ===== FONDO + ESCENARIO ===== -->
  <rect width="640" height="420" fill="#f7f7f5"/>
  <circle cx="320" cy="180" r="150" fill="#e9f2ec"/>

  <!-- ===== CASA (sección) ===== -->
  <path d="M196,190 L196,298 L444,298 L444,190" fill="#ffffff" stroke="#1a4d30" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="196" y1="190" x2="444" y2="190" stroke="#1a4d30" stroke-width="4" stroke-linecap="round"/>
  <path d="M168,190 L320,84 L472,190" fill="none" stroke="#1a4d30" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ===== AISLAMIENTO SOBRE EL FORJADO ===== -->
  <path d="M204,190 L204,178 L436,178 L436,190 Z" fill="#a8c4b0" stroke="#1a4d30" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- ===== GOTAS BAJO EL TEJADO ===== -->
  <g fill="#ffffff" stroke="#1a4d30" stroke-width="2.5" stroke-linejoin="round">
    <path transform="translate(262,140) scale(1.4)" d="M0,-11 C5,-4 8,0 8,4 A8,8 0 0 1 -8,4 C-8,0 -5,-4 0,-11 Z"/>
    <path transform="translate(294,118) scale(1.4)" d="M0,-11 C5,-4 8,0 8,4 A8,8 0 0 1 -8,4 C-8,0 -5,-4 0,-11 Z"/>
    <path transform="translate(354,126) scale(1.4)" d="M0,-11 C5,-4 8,0 8,4 A8,8 0 0 1 -8,4 C-8,0 -5,-4 0,-11 Z"/>
    <path transform="translate(388,148) scale(1.4)" d="M0,-11 C5,-4 8,0 8,4 A8,8 0 0 1 -8,4 C-8,0 -5,-4 0,-11 Z"/>
  </g>
  <g fill="#a8c4b0">
    <circle cx="262" cy="147" r="4"/>
    <circle cx="294" cy="125" r="4"/>
    <circle cx="354" cy="133" r="4"/>
    <circle cx="388" cy="155" r="4"/>
  </g>

  <!-- ===== VENTILACIÓN: entra por los aleros, sale por la cumbrera ===== -->
  <g fill="none" stroke="#22a044" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150,166 Q192,166 214,156"/>
    <path d="M206,148 L216,155 L204,162"/>
    <path d="M490,166 Q448,166 426,156"/>
    <path d="M434,148 L424,155 L436,162"/>
    <path d="M320,72 L320,40"/>
    <path d="M310,50 L320,38 L330,50"/>
  </g>

  <!-- ===== SUELO ===== -->
  <line x1="150" y1="300" x2="490" y2="300" stroke="#a8c4b0" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== ETIQUETA ===== -->
  <line x1="306" y1="344" x2="334" y2="344" stroke="#22a044" stroke-width="4" stroke-linecap="round"/>
  <text x="320" y="378" fill="#1a4d30" font-size="26" font-weight="700" letter-spacing="5" text-anchor="middle">CONDENSACIÓN</text>
</svg>
