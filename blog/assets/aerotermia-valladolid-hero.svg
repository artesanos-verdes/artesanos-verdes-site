<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Aerotermia en Valladolid: piso en la capital o casa en el alfoz, qué cambia en el CAE</title>
  <desc id="hero-desc">Infografía. A la izquierda, un bloque de pisos de la capital: en un piso, la demanda de calefacción del cálculo es la del certificado energético posterior a la obra, sin tope, porque la tabla de referencia de la ficha solo se usa en las casas; con calefacción individual y en la vivienda habitual, el coeficiente es 2,5. A la derecha, una casa del alfoz o de un pueblo: la demanda es la menor entre la del certificado y el doble de la referencia de Valladolid; para una casa de 1981 a 2007, la referencia es de 128,3 kWh por metro cuadrado y año y el tope, de 256,6 (cálculo propio); en una casa unifamiliar que es vivienda habitual, el coeficiente es 2. Abajo, en los dos casos, una caldera de gas natural, propano, butano o gasóleo se sustituye por una bomba de calor aire-agua que cubre toda la calefacción y el agua caliente; y un recuadro con la zona climática de la provincia según la tabla a-Anejo B del Código Técnico: D2 hasta 800 m de altitud y E1 por encima.</desc>

  <!-- Fondo -->
  <rect width="1600" height="1000" fill="#f5efe1"/>

  <!-- Título -->
  <text x="800" y="86" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="52" font-weight="700" fill="#1a2e1f">Aerotermia en Valladolid: piso o casa</text>
  <text x="800" y="132" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="28" fill="#1a2e1f">Ficha RES060_FM: qué demanda y qué coeficiente cuentan en el CAE</text>

  <!-- Panel izquierdo: piso en la capital -->
  <rect x="80" y="168" width="700" height="556" rx="18" fill="#ffffff" stroke="#22a044" stroke-width="3"/>
  <text x="120" y="226" font-family="'Source Serif 4', Georgia, serif" font-size="36" font-weight="700" fill="#1a2e1f">Piso en la capital</text>

  <!-- Bloque de pisos -->
  <rect x="130" y="262" width="170" height="250" fill="#f5efe1" stroke="#1a2e1f" stroke-width="3"/>
  <rect x="148" y="280" width="34" height="30" fill="#c1d9cc"/>
  <rect x="198" y="280" width="34" height="30" fill="#c1d9cc"/>
  <rect x="248" y="280" width="34" height="30" fill="#c1d9cc"/>
  <rect x="148" y="326" width="34" height="30" fill="#c1d9cc"/>
  <rect x="198" y="326" width="34" height="30" fill="#c1d9cc"/>
  <rect x="248" y="326" width="34" height="30" fill="#c1d9cc"/>
  <rect x="148" y="372" width="34" height="30" fill="#b8733a"/>
  <rect x="198" y="372" width="34" height="30" fill="#b8733a"/>
  <rect x="248" y="372" width="34" height="30" fill="#b8733a"/>
  <rect x="148" y="418" width="34" height="30" fill="#c1d9cc"/>
  <rect x="198" y="418" width="34" height="30" fill="#c1d9cc"/>
  <rect x="248" y="418" width="34" height="30" fill="#c1d9cc"/>
  <rect x="148" y="464" width="34" height="30" fill="#c1d9cc"/>
  <rect x="198" y="464" width="34" height="30" fill="#c1d9cc"/>
  <rect x="248" y="464" width="34" height="30" fill="#c1d9cc"/>
  <!-- Unidad exterior del piso -->
  <rect x="306" y="370" width="48" height="38" rx="4" fill="#ffffff" stroke="#1a2e1f" stroke-width="2"/>
  <circle cx="324" cy="389" r="11" fill="none" stroke="#1a2e1f" stroke-width="2"/>

  <text x="390" y="282" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" font-weight="700" fill="#1a2e1f">Demanda de calefacción</text>
  <text x="390" y="316" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" fill="#1a2e1f">la del certificado</text>
  <text x="390" y="350" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" fill="#1a2e1f">posterior a la obra</text>
  <text x="390" y="404" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" font-weight="700" fill="#b8733a">Sin tope de la tabla</text>
  <text x="390" y="450" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f">La tabla de la ficha</text>
  <text x="390" y="482" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f">solo se usa en las casas</text>

  <rect x="120" y="560" width="620" height="128" rx="14" fill="#22a044"/>
  <text x="150" y="650" font-family="'Source Serif 4', Georgia, serif" font-size="72" font-weight="700" fill="#ffffff">×2,5</text>
  <text x="330" y="614" font-family="'Source Sans 3', Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Calefacción individual</text>
  <text x="330" y="654" font-family="'Source Sans 3', Arial, sans-serif" font-size="28" fill="#ffffff">y vivienda habitual</text>

  <!-- Panel derecho: casa en el alfoz o en un pueblo -->
  <rect x="820" y="168" width="700" height="556" rx="18" fill="#1a2e1f"/>
  <text x="860" y="226" font-family="'Source Serif 4', Georgia, serif" font-size="36" font-weight="700" fill="#f5efe1">Casa en el alfoz o en un pueblo</text>

  <!-- Casa -->
  <polygon points="868,374 960,284 1052,374" fill="#b8733a"/>
  <rect x="884" y="374" width="152" height="138" fill="#f5efe1"/>
  <rect x="902" y="398" width="34" height="30" fill="#c1d9cc"/>
  <rect x="984" y="398" width="34" height="30" fill="#c1d9cc"/>
  <rect x="944" y="446" width="32" height="66" fill="#1a2e1f"/>
  <!-- Unidad exterior de la casa -->
  <rect x="1046" y="474" width="48" height="38" rx="4" fill="#ffffff" stroke="#f5efe1" stroke-width="2"/>
  <circle cx="1064" cy="493" r="11" fill="none" stroke="#1a2e1f" stroke-width="2"/>

  <text x="1120" y="282" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" font-weight="700" fill="#f5efe1">Demanda de calefacción</text>
  <text x="1120" y="316" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" fill="#f5efe1">la menor entre tu</text>
  <text x="1120" y="350" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" fill="#f5efe1">certificado y 2 × la</text>
  <text x="1120" y="384" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" fill="#f5efe1">referencia de Valladolid</text>
  <text x="1120" y="436" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" font-weight="700" fill="#f5efe1">Casa de 1981-2007:</text>
  <text x="1120" y="468" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#f5efe1">128,3 × 2 = 256,6</text>
  <text x="1120" y="500" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#f5efe1">kWh/m²·año de tope</text>

  <rect x="860" y="560" width="620" height="128" rx="14" fill="#b8733a"/>
  <text x="890" y="650" font-family="'Source Serif 4', Georgia, serif" font-size="72" font-weight="700" fill="#ffffff">×2</text>
  <text x="1070" y="614" font-family="'Source Sans 3', Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Casa unifamiliar</text>
  <text x="1070" y="654" font-family="'Source Sans 3', Arial, sans-serif" font-size="28" fill="#ffffff">y vivienda habitual</text>

  <!-- Banda inferior: en los dos casos -->
  <rect x="80" y="748" width="980" height="160" rx="18" fill="#ffffff" stroke="#22a044" stroke-width="3"/>
  <text x="120" y="798" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#1a2e1f">En los dos casos</text>
  <text x="120" y="840" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" fill="#1a2e1f">Caldera de gas natural, propano, butano o gasóleo</text>
  <text x="120" y="878" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" fill="#1a2e1f">→ bomba de calor aire-agua: calefacción y agua caliente</text>

  <!-- Recuadro: zona climática -->
  <rect x="1090" y="748" width="430" height="160" rx="18" fill="#ffffff" stroke="#1a2e1f" stroke-width="2"/>
  <text x="1120" y="786" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" font-weight="700" fill="#1a2e1f">Zona climática (CTE)</text>
  <rect x="1120" y="800" width="370" height="44" rx="8" fill="#b8733a"/>
  <text x="1140" y="830" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">E1 · por encima de 800 m</text>
  <line x1="1112" y1="848" x2="1498" y2="848" stroke="#1a2e1f" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="1120" y="852" width="370" height="44" rx="8" fill="#22a044"/>
  <text x="1140" y="882" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">D2 · hasta 800 m</text>

  <!-- Fuente -->
  <text x="800" y="956" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="21" fill="#1a2e1f">Fuentes: Resolución de 3-11-2026 (BOE de 7-11-2026), ficha RES060_FM · CTE DB-HE, tabla a-Anejo B · Tope: cálculo propio</text>
</svg>
