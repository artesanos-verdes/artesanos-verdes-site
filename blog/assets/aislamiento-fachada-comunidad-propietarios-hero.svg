<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="'Source Sans 3', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Tres formas de aislar la fachada de un edificio de viviendas</title>
  <desc id="d">Sección esquemática de un edificio de cinco plantas con tejado inclinado y desván aislado. La fachada de la izquierda, marcada con el número 1, lleva un sistema de aislamiento térmico por el exterior (SATE): una capa continua de aislante, con su acabado, que pasa por delante de todos los forjados. La fachada de la derecha, marcada con el número 2, es un muro de dos hojas de ladrillo con la cámara de aire rellena de aislante, que se interrumpe en cada forjado. La leyenda explica las tres técnicas: 1, SATE, aislante por el exterior que cubre forjados y pilares; 2, insuflado en la cámara, aislante dentro del muro entre forjado y forjado; 3, trasdosado interior, aislante por dentro, vivienda a vivienda.</desc>
  <defs>
    <pattern id="ins" width="16" height="12" patternUnits="userSpaceOnUse">
      <rect width="16" height="12" fill="#ffffff"/>
      <path d="M0,8 q4,-7 8,0 t8,0" fill="none" stroke="#22a044" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Fondo y terreno -->
  <rect width="1600" height="1000" fill="#f5efe1"/>
  <rect x="40" y="900" width="980" height="6" rx="3" fill="#1a4d30" opacity="0.25"/>
  <text x="150" y="948" text-anchor="middle" font-size="24" fill="#1a4d30" opacity="0.7">Calle</text>

  <!-- Cubierta y desván -->
  <polygon points="240,330 609,112 978,330" fill="#2d7a4e"/>
  <polygon points="322,320 609,150 896,320" fill="#c1d9cc"/>
  <polygon points="328,320 892,320 865,302 355,302" fill="url(#ins)" stroke="#2d7a4e" stroke-width="1.5"/>
  <text x="609" y="262" text-anchor="middle" font-size="30" font-weight="700" fill="#1a4d30">Desván</text>

  <!-- Interior de las viviendas -->
  <rect x="328" y="334" width="564" height="566" fill="#ffffff"/>

  <!-- Fachada izquierda: muro existente + SATE continuo -->
  <rect x="300" y="334" width="28" height="566" fill="#b8733a" fill-opacity="0.55"/>
  <rect x="278" y="320" width="22" height="578" fill="url(#ins)" stroke="#2d7a4e" stroke-width="1.5"/>
  <rect x="274" y="320" width="4" height="578" fill="#2d7a4e"/>

  <!-- Fachada derecha: hoja interior, cámara rellena y hoja exterior -->
  <rect x="892" y="334" width="14" height="566" fill="#b8733a" fill-opacity="0.55"/>
  <rect x="906" y="334" width="14" height="566" fill="url(#ins)"/>
  <rect x="920" y="334" width="24" height="566" fill="#b8733a" fill-opacity="0.55"/>

  <!-- Forjados: en la izquierda quedan detrás del SATE; en la derecha llegan a la cara exterior y cortan la cámara -->
  <rect x="300" y="320" width="644" height="14" fill="#1a4d30"/>
  <rect x="300" y="436" width="644" height="12" fill="#1a4d30"/>
  <rect x="300" y="552" width="644" height="12" fill="#1a4d30"/>
  <rect x="300" y="668" width="644" height="12" fill="#1a4d30"/>
  <rect x="300" y="784" width="644" height="12" fill="#1a4d30"/>

  <!-- Rótulos de las plantas -->
  <text x="610" y="394" text-anchor="middle" font-size="26" fill="#1a4d30" opacity="0.7">Vivienda</text>
  <text x="610" y="510" text-anchor="middle" font-size="26" fill="#1a4d30" opacity="0.7">Vivienda</text>
  <text x="610" y="626" text-anchor="middle" font-size="26" fill="#1a4d30" opacity="0.7">Vivienda</text>
  <text x="610" y="742" text-anchor="middle" font-size="26" fill="#1a4d30" opacity="0.7">Vivienda</text>
  <text x="610" y="858" text-anchor="middle" font-size="26" fill="#1a4d30" opacity="0.7">Planta baja</text>

  <!-- Marca 1: SATE -->
  <line x1="250" y1="620" x2="274" y2="620" stroke="#1a4d30" stroke-width="3"/>
  <circle cx="226" cy="620" r="24" fill="#1a4d30"/>
  <text x="226" y="630" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">1</text>
  <text x="190" y="630" text-anchor="end" font-size="30" font-weight="700" fill="#1a4d30">SATE</text>

  <!-- Marca 2: cámara rellena -->
  <line x1="968" y1="620" x2="913" y2="620" stroke="#1a4d30" stroke-width="3"/>
  <circle cx="913" cy="620" r="5" fill="#1a4d30"/>
  <circle cx="992" cy="620" r="24" fill="#1a4d30"/>
  <text x="992" y="630" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">2</text>

  <!-- Leyenda -->
  <text x="1060" y="180" font-size="22" font-weight="700" letter-spacing="3" fill="#2d7a4e">AISLAMIENTO DE FACHADA</text>
  <text x="1060" y="248" font-family="'Source Serif 4', serif" font-size="52" font-weight="700" fill="#1a4d30">Tres formas de</text>
  <text x="1060" y="310" font-family="'Source Serif 4', serif" font-size="52" font-weight="700" fill="#1a4d30">aislar la fachada</text>
  <rect x="1060" y="336" width="80" height="5" rx="2" fill="#b8733a"/>

  <!-- 1. SATE -->
  <circle cx="1082" cy="420" r="22" fill="#1a4d30"/>
  <text x="1082" y="429" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">1</text>
  <rect x="1116" y="390" width="3" height="100" fill="#2d7a4e"/>
  <rect x="1119" y="390" width="16" height="100" fill="url(#ins)" stroke="#2d7a4e" stroke-width="1"/>
  <rect x="1135" y="390" width="31" height="100" fill="#b8733a" fill-opacity="0.55"/>
  <text x="1190" y="422" font-size="32" font-weight="700" fill="#1a4d30">SATE</text>
  <text x="1190" y="458" font-size="25" fill="#1a4d30" opacity="0.85">Aislante por el exterior:</text>
  <text x="1190" y="490" font-size="25" fill="#1a4d30" opacity="0.85">cubre forjados y pilares.</text>

  <!-- 2. Insuflado en la cámara -->
  <circle cx="1082" cy="590" r="22" fill="#1a4d30"/>
  <text x="1082" y="599" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">2</text>
  <rect x="1116" y="560" width="18" height="100" fill="#b8733a" fill-opacity="0.55"/>
  <rect x="1134" y="560" width="14" height="100" fill="url(#ins)" stroke="#2d7a4e" stroke-width="1"/>
  <rect x="1148" y="560" width="18" height="100" fill="#b8733a" fill-opacity="0.55"/>
  <text x="1190" y="592" font-size="32" font-weight="700" fill="#1a4d30">Insuflado en la cámara</text>
  <text x="1190" y="628" font-size="25" fill="#1a4d30" opacity="0.85">Aislante dentro del muro,</text>
  <text x="1190" y="660" font-size="25" fill="#1a4d30" opacity="0.85">entre forjado y forjado.</text>

  <!-- 3. Trasdosado interior -->
  <circle cx="1082" cy="760" r="22" fill="#1a4d30"/>
  <text x="1082" y="769" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">3</text>
  <rect x="1116" y="730" width="30" height="100" fill="#b8733a" fill-opacity="0.55"/>
  <rect x="1146" y="730" width="14" height="100" fill="url(#ins)" stroke="#2d7a4e" stroke-width="1"/>
  <rect x="1160" y="730" width="6" height="100" fill="#c1d9cc" stroke="#1a4d30" stroke-width="1"/>
  <text x="1190" y="762" font-size="32" font-weight="700" fill="#1a4d30">Trasdosado interior</text>
  <text x="1190" y="798" font-size="25" fill="#1a4d30" opacity="0.85">Aislante por dentro,</text>
  <text x="1190" y="830" font-size="25" fill="#1a4d30" opacity="0.85">vivienda a vivienda.</text>

  <rect x="1060" y="880" width="480" height="2" fill="#1a4d30" opacity="0.2"/>
  <text x="1060" y="922" font-size="24" fill="#1a4d30" opacity="0.75">Esquema simplificado, sin escala.</text>
  <text x="1060" y="954" font-size="24" fill="#1a4d30" opacity="0.75">En los iconos, exterior a la izquierda.</text>
</svg>
