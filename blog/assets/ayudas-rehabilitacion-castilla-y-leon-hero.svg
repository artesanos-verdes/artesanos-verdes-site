  <rect x="780" y="456" width="700" height="96" rx="14" fill="#ffffff" stroke="#c1d9cc" stroke-width="2"/>
  <rect x="796" y="484" width="150" height="40" rx="20" fill="#1a2e1f"/>
  <text x="871" y="511" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">CERRADO</text>
  <text x="968" y="498" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" font-weight="700" fill="#1a2e1f">PREE 5000 (reto demográfico)</text>
  <text x="968" y="530" font-family="'Source Sans 3', Arial, sans-serif" font-size="20" fill="#1a2e1f">Solicitudes cerradas; expedientes en tramitación</text>

  <rect x="780" y="566" width="700" height="96" rx="14" fill="#ffffff" stroke="#b8733a" stroke-width="3" stroke-dasharray="12 8"/>
