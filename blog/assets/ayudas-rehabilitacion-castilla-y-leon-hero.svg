  <rect x="120" y="366" width="180" height="110" rx="14" fill="#22a044"/>
  <text x="210" y="416" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="28" font-weight="700" fill="#ffffff">Zamora</text>
  <text x="210" y="450" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="20" fill="#ffffff">estudio gratuito</text>

  <rect x="320" y="366" width="180" height="110" rx="14" fill="#22a044"/>
  <text x="410" y="416" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="28" font-weight="700" fill="#ffffff">Valladolid</text>
  <text x="410" y="450" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="20" fill="#ffffff">estudio gratuito</text>

