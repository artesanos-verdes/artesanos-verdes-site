  <text x="410" y="706" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="21" fill="#1a2e1f">(CTE DB-HE 2019, tabla a-Anejo B):</text>
  <text x="410" y="738" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="21" fill="#1a2e1f">el desván entra, por zona, en la ficha RES022</text>

  <text x="120" y="816" font-family="'Source Sans 3', Arial, sans-serif" font-size="21" fill="#1a2e1f">Esquema orientativo, sin valor cartográfico.</text>
  <text x="120" y="850" font-family="'Source Sans 3', Arial, sans-serif" font-size="21" fill="#1a2e1f">Las vías de la derecha valen para las nueve provincias.</text>

