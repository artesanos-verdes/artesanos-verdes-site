<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Ayudas para rehabilitar en Castilla y León: estado de cada vía a 3 de noviembre de 2026</title>
  <desc id="hero-desc">A la izquierda, nueve recuadros con las provincias de Castilla y León en tres filas: León, Palencia y Burgos; Zamora, Valladolid y Soria; Salamanca, Ávila y Segovia. Ocho aparecen en verde con la mención «estudio gratuito»; Soria, en blanco con borde discontinuo y la mención «sin cobertura». Debajo, una nota: las nueve provincias están en zona climática D o E según el Código Técnico, así que el desván no habitable entra, por zona, en la ficha RES022. A la derecha, seis filas con el estado de cada vía: línea rural de la Junta, comprobar la orden en el BOCyL y los plazos; fondos NextGeneration, convocatorias cerradas y fondos agotados; PREE 5000, solicitudes cerradas y expedientes en tramitación; Plan Estatal de Vivienda 2026-2030, sin convocatoria en el BOCyL; deducción del IRPF, vigente para la vivienda hasta 2026 y para el edificio hasta 2027; y sistema CAE, financiación privada disponible sin convocatoria ni plazo, que no es una ayuda.</desc>

  <!-- Fondo -->
  <rect width="1600" height="1000" fill="#f5efe1"/>

  <!-- Título -->
  <text x="800" y="86" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="50" font-weight="700" fill="#1a2e1f">Ayudas para rehabilitar en Castilla y León</text>
  <text x="800" y="134" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="30" fill="#22a044">Estado de cada vía a 3 de noviembre de 2026 · las nueve provincias</text>
  <line x1="120" y1="166" x2="1480" y2="166" stroke="#c1d9cc" stroke-width="2"/>

  <!-- Provincias: esquema en recuadros, sin contornos geográficos -->
  <text x="120" y="214" font-family="'Source Sans 3', Arial, sans-serif" font-size="26" font-weight="600" fill="#1a2e1f">Nueve provincias, ocho con estudio gratuito</text>

  <rect x="120" y="236" width="180" height="110" rx="14" fill="#22a044"/>
