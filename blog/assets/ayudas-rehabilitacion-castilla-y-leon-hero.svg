  <text x="210" y="320" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="20" fill="#ffffff">estudio gratuito</text>

  <rect x="320" y="236" width="180" height="110" rx="14" fill="#22a044"/>
