<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Bombas de calor en un edificio de pisos con calderas individuales</title>
  <desc id="hero-desc">Esquema de la fachada de un edificio de viviendas de cuatro plantas sobre un bajo. En casi todas las terrazas hay una unidad exterior de bomba de calor colocada en el mismo sitio; dos terrazas no tienen ninguna. En la cubierta plana hay otras dos unidades exteriores, y una tubería discontinua baja por el borde de la fachada hasta una de las viviendas. A la derecha, un recuadro muestra el interior de un piso: un módulo interior con acumulador de agua caliente, conectado a un radiador y a la unidad exterior, y la silueta discontinua de la caldera de gas a la que sustituye. Los rótulos indican que la cubierta es un elemento común, que lo que se instala en las terrazas y en la fachada lo autoriza la junta y que lo que va dentro del piso lo decide cada propietario.</desc>

  <!-- Fondo y terreno -->
  <rect width="1600" height="1000" fill="#f5efe1"/>
  <rect x="0" y="880" width="1600" height="120" fill="#c1d9cc"/>
  <line x1="0" y1="880" x2="1600" y2="880" stroke="#2d7a4e" stroke-width="4"/>

  <!-- Edificio: fachada, forjados y peto de la cubierta -->
  <rect x="470" y="316" width="420" height="564" fill="#ffffff"/>
  <g stroke="#1a4d30" stroke-width="4">
    <line x1="470" y1="429" x2="890" y2="429"/>
    <line x1="470" y1="541" x2="890" y2="541"/>
    <line x1="470" y1="654" x2="890" y2="654"/>
    <line x1="470" y1="767" x2="890" y2="767"/>
  </g>
  <rect x="470" y="316" width="420" height="564" fill="none" stroke="#1a4d30" stroke-width="6"/>
  <rect x="456" y="300" width="448" height="16" rx="3" fill="#1a4d30"/>

  <!-- Puertas de las terrazas -->
  <g fill="#c1d9cc" stroke="#1a4d30" stroke-width="3">
    <rect x="502" y="330" width="56" height="84" rx="3"/>
    <rect x="702" y="330" width="56" height="84" rx="3"/>
    <rect x="502" y="443" width="56" height="84" rx="3"/>
    <rect x="702" y="443" width="56" height="84" rx="3"/>
    <rect x="502" y="555" width="56" height="84" rx="3"/>
    <rect x="702" y="555" width="56" height="84" rx="3"/>
    <rect x="502" y="668" width="56" height="84" rx="3"/>
    <rect x="702" y="668" width="56" height="84" rx="3"/>
  </g>
  <g stroke="#1a4d30" stroke-width="2">
    <line x1="530" y1="330" x2="530" y2="414"/>
    <line x1="730" y1="330" x2="730" y2="414"/>
    <line x1="530" y1="443" x2="530" y2="527"/>
    <line x1="730" y1="443" x2="730" y2="527"/>
    <line x1="530" y1="555" x2="530" y2="639"/>
    <line x1="730" y1="555" x2="730" y2="639"/>
    <line x1="530" y1="668" x2="530" y2="752"/>
    <line x1="730" y1="668" x2="730" y2="752"/>
  </g>

  <!-- Unidades exteriores en las terrazas, todas en el mismo sitio -->
  <g fill="#ffffff" stroke="#1a4d30" stroke-width="4">
    <rect x="584" y="360" width="74" height="54" rx="5"/>
    <rect x="784" y="360" width="74" height="54" rx="5"/>
    <rect x="584" y="473" width="74" height="54" rx="5"/>
    <rect x="784" y="585" width="74" height="54" rx="5"/>
    <rect x="584" y="698" width="74" height="54" rx="5"/>
    <rect x="784" y="698" width="74" height="54" rx="5"/>
  </g>
  <g fill="#c1d9cc" stroke="#1a4d30" stroke-width="3">
    <circle cx="611" cy="387" r="17"/>
    <circle cx="811" cy="387" r="17"/>
    <circle cx="611" cy="500" r="17"/>
    <circle cx="811" cy="612" r="17"/>
    <circle cx="611" cy="725" r="17"/>
    <circle cx="811" cy="725" r="17"/>
  </g>
  <g fill="#1a4d30">
    <circle cx="611" cy="387" r="4"/>
    <circle cx="811" cy="387" r="4"/>
    <circle cx="611" cy="500" r="4"/>
    <circle cx="811" cy="612" r="4"/>
    <circle cx="611" cy="725" r="4"/>
    <circle cx="811" cy="725" r="4"/>
  </g>

