  <g fill="none" stroke-width="5">
    <path d="M1290 702 H1220" stroke="#b8733a"/>
    <path d="M1290 744 H1220" stroke="#2d7a4e"/>
  </g>
  <rect x="1290" y="470" width="110" height="310" rx="16" fill="#c1d9cc" stroke="#1a4d30" stroke-width="4"/>
