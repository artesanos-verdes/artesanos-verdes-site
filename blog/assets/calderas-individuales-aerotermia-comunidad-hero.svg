    <rect x="486" y="414" width="188" height="10"/>
    <rect x="686" y="414" width="188" height="10"/>
    <rect x="486" y="527" width="188" height="10"/>
    <rect x="686" y="527" width="188" height="10"/>
    <rect x="486" y="639" width="188" height="10"/>
    <rect x="686" y="639" width="188" height="10"/>
    <rect x="486" y="752" width="188" height="10"/>
    <rect x="686" y="752" width="188" height="10"/>
  </g>
