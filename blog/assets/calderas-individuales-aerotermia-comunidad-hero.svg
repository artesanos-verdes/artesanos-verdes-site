  <g stroke="#1a4d30" stroke-width="3">
    <line x1="452" y1="250" x2="606" y2="262"/>
    <line x1="452" y1="500" x2="596" y2="500"/>
  </g>
  <g fill="#1a4d30">
    <circle cx="606" cy="262" r="7"/>
    <circle cx="596" cy="500" r="7"/>
  </g>

  <text x="440" y="242" text-anchor="end" font-family="'Source Serif 4', serif" font-size="40" font-weight="700" fill="#1a4d30">Cubierta</text>
  <text x="440" y="278" text-anchor="end" font-family="'Source Sans 3', sans-serif" font-size="26" fill="#2d7a4e">elemento común</text>

  <text x="440" y="492" text-anchor="end" font-family="'Source Serif 4', serif" font-size="38" font-weight="700" fill="#1a4d30">Terrazas y fachada</text>
  <text x="440" y="528" text-anchor="end" font-family="'Source Sans 3', sans-serif" font-size="26" fill="#2d7a4e">lo que se ve fuera</text>
  <text x="440" y="560" text-anchor="end" font-family="'Source Sans 3', sans-serif" font-size="26" fill="#2d7a4e">lo autoriza la junta</text>

  <text x="1010" y="300" font-family="'Source Serif 4', serif" font-size="40" font-weight="700" fill="#1a4d30">Dentro del piso</text>
  <text x="1010" y="338" font-family="'Source Sans 3', sans-serif" font-size="26" fill="#2d7a4e">lo decide cada propietario</text>
</svg>
