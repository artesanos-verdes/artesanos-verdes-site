    <rect x="740" y="236" width="90" height="64" rx="6"/>
  </g>
  <g fill="#c1d9cc" stroke="#1a4d30" stroke-width="3">
    <circle cx="635" cy="268" r="21"/>
    <circle cx="775" cy="268" r="21"/>
  </g>
  <g fill="#1a4d30">
    <circle cx="635" cy="268" r="5"/>
    <circle cx="775" cy="268" r="5"/>
  </g>
  <g fill="none" stroke="#22a044" stroke-width="4" stroke-linecap="round">
    <path d="M612 214 q11 -11 22 0 t22 0 t22 0"/>
    <path d="M752 214 q11 -11 22 0 t22 0 t22 0"/>
  </g>

  <!-- Tubería de una unidad de la cubierta hasta su vivienda -->
  <path d="M830 268 H884 V480 H760" fill="none" stroke="#b8733a" stroke-width="5" stroke-dasharray="10 8" stroke-linejoin="round"/>
  <circle cx="760" cy="480" r="6" fill="#b8733a"/>

  <!-- Detalle del interior de un piso -->
  <line x1="760" y1="580" x2="1010" y2="520" stroke="#1a4d30" stroke-width="3"/>
  <circle cx="760" cy="580" r="7" fill="#1a4d30"/>
  <rect x="1010" y="370" width="530" height="450" rx="18" fill="#ffffff" stroke="#1a4d30" stroke-width="4"/>
  <line x1="1012" y1="780" x2="1538" y2="780" stroke="#1a4d30" stroke-width="3"/>

  <!-- Conexión con la unidad exterior -->
  <g fill="none" stroke-width="5" stroke-linejoin="round">
    <path d="M1330 470 V412 H1012" stroke="#b8733a"/>
    <path d="M1362 470 V430 H1012" stroke="#2d7a4e"/>
  </g>

  <!-- Radiador -->
  <rect x="1060" y="680" width="160" height="80" rx="6" fill="#ffffff" stroke="#b8733a" stroke-width="4"/>
  <path d="M1084 690 V750 M1108 690 V750 M1132 690 V750 M1156 690 V750 M1180 690 V750 M1204 690 V750" stroke="#b8733a" stroke-width="3"/>
  <path d="M1076 760 V780 M1204 760 V780" stroke="#b8733a" stroke-width="4"/>

