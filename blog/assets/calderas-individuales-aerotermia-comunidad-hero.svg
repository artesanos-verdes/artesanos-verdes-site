    <line x1="490" y1="378" x2="670" y2="378"/>
    <line x1="690" y1="378" x2="870" y2="378"/>
    <line x1="490" y1="491" x2="670" y2="491"/>
    <line x1="690" y1="491" x2="870" y2="491"/>
    <line x1="490" y1="603" x2="670" y2="603"/>
    <line x1="690" y1="603" x2="870" y2="603"/>
    <line x1="490" y1="716" x2="670" y2="716"/>
    <line x1="690" y1="716" x2="870" y2="716"/>
  </g>
  <g stroke="#1a4d30" stroke-width="2">
    <path d="M500 378 V414 M520 378 V414 M540 378 V414 M560 378 V414 M580 378 V414 M600 378 V414 M620 378 V414 M640 378 V414 M660 378 V414"/>
    <path d="M700 378 V414 M720 378 V414 M740 378 V414 M760 378 V414 M780 378 V414 M800 378 V414 M820 378 V414 M840 378 V414 M860 378 V414"/>
    <path d="M500 491 V527 M520 491 V527 M540 491 V527 M560 491 V527 M580 491 V527 M600 491 V527 M620 491 V527 M640 491 V527 M660 491 V527"/>
    <path d="M700 491 V527 M720 491 V527 M740 491 V527 M760 491 V527 M780 491 V527 M800 491 V527 M820 491 V527 M840 491 V527 M860 491 V527"/>
    <path d="M500 603 V639 M520 603 V639 M540 603 V639 M560 603 V639 M580 603 V639 M600 603 V639 M620 603 V639 M640 603 V639 M660 603 V639"/>
    <path d="M700 603 V639 M720 603 V639 M740 603 V639 M760 603 V639 M780 603 V639 M800 603 V639 M820 603 V639 M840 603 V639 M860 603 V639"/>
    <path d="M500 716 V752 M520 716 V752 M540 716 V752 M560 716 V752 M580 716 V752 M600 716 V752 M620 716 V752 M640 716 V752 M660 716 V752"/>
    <path d="M700 716 V752 M720 716 V752 M740 716 V752 M760 716 V752 M780 716 V752 M800 716 V752 M820 716 V752 M840 716 V752 M860 716 V752"/>
  </g>

  <!-- Bajo: portal y ventanas -->
