<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Ocho pruebas que pedir a una empresa de aislamiento antes de firmar</title>
  <desc id="hero-desc">A la izquierda, una lista de comprobación con ocho casillas marcadas: producto con declaración de prestaciones y certificado ACERMI; espesor y kilos por metro cuadrado medidos al terminar; reglas graduadas y fotos de la obra; reacción al fuego según la declaración de prestaciones; sujeto delegado en el listado del MITECO; verificador acreditado por ENAC; garantía por escrito; y qué pasa si el ahorro no se verifica. A la derecha, la sección de un desván con la capa de lana insuflada sobre el forjado y una regla graduada que marca el espesor, tres fichas con los rótulos DoP, MITECO y ENAC, y un contrato de cesión del ahorro con un sello. Abajo, una banda recuerda que las ocho pruebas se piden por escrito, también a Los Artesanos Verdes.</desc>

  <rect width="1600" height="1000" fill="#f5efe1"/>

  <!-- Título -->
  <text x="80" y="104" font-family="'Source Serif 4', Georgia, serif" font-size="56" font-weight="700" fill="#1a2e1f">Elegir empresa de aislamiento</text>
  <text x="80" y="156" font-family="'Source Sans 3', Arial, sans-serif" font-size="32" fill="#1a2e1f" opacity="0.85">Ocho pruebas que pedir por escrito antes de firmar</text>

  <!-- Lista de comprobación -->
  <rect x="80" y="210" width="740" height="700" rx="24" fill="#ffffff" stroke="#d9d2c0" stroke-width="3"/>
  <rect x="380" y="190" width="140" height="44" rx="12" fill="#b8733a"/>

  <g font-family="'Source Sans 3', Arial, sans-serif" font-size="30" fill="#1a2e1f">
    <!-- 1 -->
    <circle cx="124" cy="290" r="20" fill="#1a2e1f"/>
    <text x="124" y="298" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <rect x="164" y="268" width="44" height="44" rx="8" fill="#22a044"/>
    <path d="M174 291 L183 300 L198 281" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="228" y="300">Producto con DoP y certificado ACERMI</text>
    <!-- 2 -->
    <circle cx="124" cy="368" r="20" fill="#1a2e1f"/>
    <text x="124" y="376" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <rect x="164" y="346" width="44" height="44" rx="8" fill="#22a044"/>
    <path d="M174 369 L183 378 L198 359" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="228" y="378">Espesor y kg/m² medidos al terminar</text>
    <!-- 3 -->
    <circle cx="124" cy="446" r="20" fill="#1a2e1f"/>
    <text x="124" y="454" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <rect x="164" y="424" width="44" height="44" rx="8" fill="#22a044"/>
    <path d="M174 447 L183 456 L198 437" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="228" y="456">Reglas graduadas y fotos de la obra</text>
    <!-- 4 -->
    <circle cx="124" cy="524" r="20" fill="#1a2e1f"/>
    <text x="124" y="532" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <rect x="164" y="502" width="44" height="44" rx="8" fill="#22a044"/>
    <path d="M174 525 L183 534 L198 515" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="228" y="534">Reacción al fuego según la DoP</text>
    <!-- 5 -->
    <circle cx="124" cy="602" r="20" fill="#1a2e1f"/>
    <text x="124" y="610" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <rect x="164" y="580" width="44" height="44" rx="8" fill="#22a044"/>
    <path d="M174 603 L183 612 L198 593" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="228" y="612">Sujeto delegado en el listado del MITECO</text>
    <!-- 6 -->
    <circle cx="124" cy="680" r="20" fill="#1a2e1f"/>
    <text x="124" y="688" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
    <rect x="164" y="658" width="44" height="44" rx="8" fill="#22a044"/>
    <path d="M174 681 L183 690 L198 671" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="228" y="690">Verificador acreditado por ENAC</text>
    <!-- 7 -->
    <circle cx="124" cy="758" r="20" fill="#1a2e1f"/>
    <text x="124" y="766" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
    <rect x="164" y="736" width="44" height="44" rx="8" fill="#22a044"/>
    <path d="M174 759 L183 768 L198 749" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="228" y="768">Garantía por escrito</text>
    <!-- 8 -->
    <circle cx="124" cy="836" r="20" fill="#b8733a"/>
    <text x="124" y="844" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
    <rect x="164" y="814" width="44" height="44" rx="8" fill="#b8733a"/>
    <path d="M174 837 L183 846 L198 827" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="228" y="846">Qué pasa si el ahorro no se verifica</text>
  </g>

  <!-- Panel derecho: desván -->
  <text x="1200" y="262" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#1a2e1f" text-anchor="middle">Lo que debe quedar documentado</text>

  <polygon points="900,470 1200,300 1500,470" fill="none" stroke="#1a2e1f" stroke-width="8" stroke-linejoin="round"/>
  <polygon points="922,468 994,424 1406,424 1478,468" fill="#22a044" opacity="0.28"/>
  <path d="M994 424 Q1019.75 412 1045.5 424 T1097 424 T1148.5 424 T1200 424 T1251.5 424 T1303 424 T1354.5 424 T1406 424" fill="none" stroke="#22a044" stroke-width="4"/>
  <rect x="920" y="470" width="560" height="18" fill="#1a2e1f"/>

  <!-- Regla graduada -->
  <rect x="1291" y="380" width="18" height="90" fill="#ffffff" stroke="#b8733a" stroke-width="3"/>
  <g stroke="#b8733a" stroke-width="2">
    <line x1="1291" y1="392" x2="1300" y2="392"/>
    <line x1="1291" y1="404" x2="1303" y2="404"/>
    <line x1="1291" y1="416" x2="1300" y2="416"/>
    <line x1="1291" y1="428" x2="1303" y2="428"/>
    <line x1="1291" y1="440" x2="1300" y2="440"/>
    <line x1="1291" y1="452" x2="1303" y2="452"/>
    <line x1="1291" y1="464" x2="1300" y2="464"/>
  </g>
  <text x="1200" y="526" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f" text-anchor="middle">Lana insuflada sobre el forjado y regla graduada:</text>
  <text x="1200" y="556" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f" text-anchor="middle">espesor medido y fotografiado</text>

  <!-- Tres fichas -->
  <g font-family="'Source Sans 3', Arial, sans-serif" text-anchor="middle">
    <rect x="900" y="584" width="190" height="124" rx="16" fill="#ffffff" stroke="#d9d2c0" stroke-width="3"/>
    <text x="995" y="630" font-size="34" font-weight="700" fill="#1a2e1f">DoP</text>
    <text x="995" y="662" font-size="19" fill="#1a2e1f" opacity="0.8">y certificado</text>
    <text x="995" y="688" font-size="19" fill="#1a2e1f" opacity="0.8">ACERMI</text>

    <rect x="1105" y="584" width="190" height="124" rx="16" fill="#ffffff" stroke="#d9d2c0" stroke-width="3"/>
    <text x="1200" y="630" font-size="34" font-weight="700" fill="#1a2e1f">MITECO</text>
    <text x="1200" y="662" font-size="19" fill="#1a2e1f" opacity="0.8">listado de</text>
    <text x="1200" y="688" font-size="19" fill="#1a2e1f" opacity="0.8">sujetos delegados</text>

    <rect x="1310" y="584" width="190" height="124" rx="16" fill="#ffffff" stroke="#d9d2c0" stroke-width="3"/>
    <text x="1405" y="630" font-size="34" font-weight="700" fill="#1a2e1f">ENAC</text>
    <text x="1405" y="662" font-size="19" fill="#1a2e1f" opacity="0.8">verificador</text>
    <text x="1405" y="688" font-size="19" fill="#1a2e1f" opacity="0.8">acreditado</text>
  </g>

  <!-- Contrato -->
  <rect x="900" y="726" width="600" height="190" rx="16" fill="#ffffff" stroke="#d9d2c0" stroke-width="3"/>
  <text x="930" y="772" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#1a2e1f">Contrato de cesión del ahorro</text>
  <text x="930" y="810" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" fill="#1a2e1f" opacity="0.85">Valor en €/kWh · un solo intermediario</text>
  <text x="930" y="842" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" fill="#1a2e1f" opacity="0.85">Ayudas declaradas · fecha de inicio</text>
  <text x="930" y="874" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" fill="#1a2e1f" opacity="0.85">Quién firma · efectos en el IRPF</text>
  <circle cx="1440" cy="818" r="36" fill="#22a044"/>
  <path d="M1422 820 L1435 833 L1460 804" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Banda inferior -->
  <rect x="0" y="932" width="1600" height="68" fill="#1a2e1f"/>
  <text x="800" y="976" font-family="'Source Sans 3', Arial, sans-serif" font-size="30" font-weight="700" fill="#f5efe1" text-anchor="middle">Las ocho pruebas se piden por escrito, también a Los Artesanos Verdes</text>
</svg>
