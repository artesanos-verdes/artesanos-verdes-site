  <text x="640" y="428" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" font-weight="600" fill="#1a2e1f">Tipología de la vivienda</text>
  <text x="640" y="456" font-family="'Source Sans 3', Arial, sans-serif" font-size="21" fill="#1a2e1f">Declaración del instalador</text>

  <circle cx="598" cy="514" r="24" fill="#22a044"/>
  <text x="598" y="522" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">3</text>
  <text x="640" y="510" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" font-weight="600" fill="#1a2e1f">Certificado de la instalación</text>
  <text x="640" y="538" font-family="'Source Sans 3', Arial, sans-serif" font-size="21" fill="#1a2e1f">Con la inercia: litros y l/kW</text>

  <circle cx="598" cy="596" r="24" fill="#22a044"/>
  <text x="598" y="604" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">6</text>
