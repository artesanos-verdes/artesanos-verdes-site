<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Documentación CAE de la aerotermia: los 13 documentos y quién los aporta</title>
  <desc id="hero-desc">Infografía en tres columnas con los 13 documentos que pide la ficha RES060_FM para cambiar la caldera por aerotermia con factor multiplicador. Columna «Tú»: facturas del invierno o curva de consumo horario (documento 4), anexo A sobre ayudas públicas (2), declaración responsable sobre ayudas públicas (5), consentimiento sobre el IRPF y el funcionamiento (12), firma de la oferta de mantenimiento (8) y, si procede, aviso sobre el aislamiento en zonas D y E con letra F o G (13). Columna «Empresa instaladora»: informe fotográfico antes y después (7), declaración de tipología (1), certificado de la instalación con la inercia en litros y l/kW (3), facturas de la obra con número de serie (6), boletín de baja tensión con el aumento de potencia (9), comunicación o acta de puesta en servicio (10) y oferta de mantenimiento de al menos 2 años (8). Columna «Técnico certificador»: certificado energético posterior a la obra, registrado (11). Cada documento está marcado según se prepare antes, durante o después de la obra. Un recuadro resume el invierno de referencia: del 1 de noviembre al 31 de marzo, sin huecos, con el CUPS visible, dirección igual a la catastral y más de 75 kWh al mes de media, o bien la curva horaria de la distribuidora.</desc>

  <!-- Fondo -->
  <rect width="1600" height="1000" fill="#f5efe1"/>

  <!-- Título -->
  <text x="800" y="84" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="50" font-weight="700" fill="#1a2e1f">Documentación CAE de la aerotermia</text>
  <text x="800" y="132" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="28" fill="#22a044">Los 13 documentos de la ficha RES060_FM: quién los aporta y cuándo</text>
  <line x1="80" y1="160" x2="1520" y2="160" stroke="#1a2e1f" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Leyenda: momentos -->
  <circle cx="314" cy="200" r="13" fill="#b8733a"/>
  <text x="336" y="208" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f">Antes de la obra</text>
  <circle cx="590" cy="200" r="13" fill="#22a044"/>
  <text x="612" y="208" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f">Durante la obra</text>
  <circle cx="856" cy="200" r="13" fill="#1a2e1f"/>
  <text x="878" y="208" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f">Después de la obra</text>
  <circle cx="1157" cy="200" r="12" fill="#f5efe1" stroke="#b8733a" stroke-width="3" stroke-dasharray="5 4"/>
  <text x="1179" y="208" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f">Si procede</text>

