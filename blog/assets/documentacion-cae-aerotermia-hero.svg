  <text x="640" y="620" font-family="'Source Sans 3', Arial, sans-serif" font-size="21" fill="#1a2e1f">Con número de serie</text>

  <circle cx="598" cy="678" r="24" fill="#22a044"/>
  <text x="598" y="686" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">9</text>
  <text x="640" y="674" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" font-weight="600" fill="#1a2e1f">Boletín de baja tensión</text>
  <text x="640" y="702" font-family="'Source Sans 3', Arial, sans-serif" font-size="21" fill="#1a2e1f">Con el aumento de potencia</text>

  <circle cx="598" cy="760" r="24" fill="#22a044"/>
