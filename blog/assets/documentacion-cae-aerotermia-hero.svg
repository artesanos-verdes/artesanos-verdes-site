  <rect x="60" y="240" width="470" height="680" rx="18" fill="#ffffff" stroke="#22a044" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="60" y="240" width="470" height="64" rx="18" fill="#1a2e1f"/>
  <rect x="60" y="280" width="470" height="24" fill="#1a2e1f"/>
  <text x="88" y="283" font-family="'Source Serif 4', Georgia, serif" font-size="30" font-weight="700" fill="#f5efe1">Tú</text>

  <circle cx="108" cy="350" r="24" fill="#b8733a"/>
  <text x="108" y="358" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">4</text>
  <text x="150" y="346" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" font-weight="600" fill="#1a2e1f">Facturas del invierno</text>
  <text x="150" y="374" font-family="'Source Sans 3', Arial, sans-serif" font-size="21" fill="#1a2e1f">O curva de consumo horario</text>

  <circle cx="108" cy="432" r="24" fill="#b8733a"/>
  <text x="108" y="440" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">2</text>
  <text x="150" y="428" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" font-weight="600" fill="#1a2e1f">Anexo A</text>
  <text x="150" y="456" font-family="'Source Sans 3', Arial, sans-serif" font-size="21" fill="#1a2e1f">Ayudas públicas</text>

  <circle cx="108" cy="514" r="24" fill="#b8733a"/>
  <text x="108" y="522" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">5</text>
  <text x="150" y="510" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" font-weight="600" fill="#1a2e1f">Declaración responsable</text>
  <text x="150" y="538" font-family="'Source Sans 3', Arial, sans-serif" font-size="21" fill="#1a2e1f">Ayudas públicas</text>

  <circle cx="108" cy="596" r="24" fill="#b8733a"/>
  <text x="108" y="604" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">12</text>
  <text x="150" y="592" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" font-weight="600" fill="#1a2e1f">Consentimiento</text>
  <text x="150" y="620" font-family="'Source Sans 3', Arial, sans-serif" font-size="21" fill="#1a2e1f">IRPF y funcionamiento</text>

  <circle cx="108" cy="678" r="24" fill="#22a044"/>
  <text x="108" y="686" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">8</text>
  <text x="150" y="674" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" font-weight="600" fill="#1a2e1f">Firma del mantenimiento</text>
  <text x="150" y="702" font-family="'Source Sans 3', Arial, sans-serif" font-size="21" fill="#1a2e1f">Aceptas o renuncias</text>

  <circle cx="108" cy="760" r="23" fill="#f5efe1" stroke="#b8733a" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="108" y="768" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" font-weight="700" fill="#b8733a">13</text>
  <text x="150" y="756" font-family="'Source Sans 3', Arial, sans-serif" font-size="25" font-weight="600" fill="#1a2e1f">Aviso sobre el aislamiento</text>
  <text x="150" y="784" font-family="'Source Sans 3', Arial, sans-serif" font-size="21" fill="#1a2e1f">Zonas D y E, letra F o G</text>

  <line x1="88" y1="830" x2="502" y2="830" stroke="#22a044" stroke-opacity="0.35" stroke-width="2"/>
  <text x="88" y="874" font-family="'Source Sans 3', Arial, sans-serif" font-size="22" font-weight="600" fill="#22a044">5 documentos, o 6 con el 13</text>

