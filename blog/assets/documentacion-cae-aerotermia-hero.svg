  <text x="1128" y="576" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f">Del 1 de noviembre al 31 de marzo</text>
  <circle cx="1108" cy="626" r="8" fill="#b8733a"/>
  <text x="1128" y="634" font-family="'Source Sans 3', Arial, sans-serif" font-size="24" fill="#1a2e1f">Sin huecos entre facturas</text>
