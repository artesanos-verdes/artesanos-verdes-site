  <!-- Pie -->
  <text x="800" y="968" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="20" fill="#1a2e1f">Ficha RES060_FM · Resolución de 3 de noviembre de 2026 (BOE de 7 de noviembre)</text>
</svg>
