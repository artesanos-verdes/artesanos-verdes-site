<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Tu edificio en Madrid: tres caminos para cambiar la caldera por aerotermia con el sistema CAE</title>
  <desc id="hero-desc">Tres edificios de viviendas, cada uno con su coeficiente del sistema CAE. Primero: en un edificio con calderas individuales, un piso cambia su caldera de gas por una bomba de calor propia, coeficiente 2,5 si es vivienda habitual (ficha RES060_FM). Segundo: un edificio con calefacción central sustituye la caldera central por bombas de calor en la cubierta y sigue con calefacción central, coeficiente 3 (ficha RES060_FM). Tercero: un edificio en el que cada piso tenía su caldera pasa a una bomba de calor central, coeficiente 4 (ficha RES062_FM). Notas al pie: coeficientes de la Resolución de 3 de noviembre de 2026, publicada en el BOE el 7 de noviembre; pasar de calefacción central a bombas individuales no tiene coeficiente; en una casa unifamiliar que es vivienda habitual, el coeficiente es 2. Un recuadro con montañas indica que la sierra, por encima de 1.000 m de altitud, es zona climática E1, y Madrid capital, D3.</desc>

