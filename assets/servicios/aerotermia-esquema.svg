<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ae-title ae-desc" font-family="Manrope, -apple-system, sans-serif">
  <title id="ae-title">Cómo funciona la aerotermia</title>
  <desc id="ae-desc">Esquema del funcionamiento de una bomba de calor aerotérmica en tres fases: capta la energía del aire exterior, la bomba de calor eleva la temperatura y distribuye calefacción y agua caliente sanitaria (ACS).</desc>

  <!-- ========== BACKGROUND ========== -->
  <rect width="1200" height="520" fill="#f7f7f5"/>

  <!-- ========== TOP BRAND BAR ========== -->
  <rect x="0" y="0" width="1200" height="70" fill="#1a4d30"/>
  <text x="60" y="30" fill="#a8c4b0" font-size="11" font-weight="700" letter-spacing="2.5">CÓMO FUNCIONA</text>
  <text x="60" y="55" fill="#ffffff" font-size="22" font-weight="700">El principio de la aerotermia — del aire a tu hogar</text>

  <!-- ================= STEP 1 · Capta energía del aire ================= -->
  <g>
    <rect x="60" y="120" width="300" height="300" rx="14" fill="#ffffff" stroke="#2d7a4e" stroke-width="2"/>
    <circle cx="100" cy="166" r="24" fill="#2d7a4e"/>
    <text x="100" y="175" fill="#ffffff" font-size="22" font-weight="800" text-anchor="middle">1</text>
    <text x="138" y="162" fill="#1a4d30" font-size="18" font-weight="800">Capta energía</text>
    <text x="138" y="184" fill="#1a4d30" font-size="18" font-weight="800">del aire</text>

    <!-- leaf (renovable) -->
    <path d="M 232 250 C 232 226 258 216 280 216 C 280 240 258 254 232 250 Z" fill="#22a044"/>
    <path d="M 240 246 Q 258 234 274 224" stroke="#ffffff" stroke-width="1.6" fill="none"/>
    <!-- wind swooshes -->
    <g fill="none" stroke="#2d7a4e" stroke-width="4" stroke-linecap="round">
      <path d="M 130 290 h 66 a 13 13 0 1 0 -13 -13"/>
      <path d="M 130 318 h 92 a 13 13 0 1 1 -13 13"/>
      <path d="M 130 346 h 52 a 11 11 0 1 0 -11 -11"/>
    </g>

    <text x="210" y="392" fill="#444" font-size="13" font-weight="700" text-anchor="middle">Energía aerotérmica renovable</text>
    <text x="210" y="410" fill="#888" font-size="11" font-weight="600" text-anchor="middle">del aire exterior, incluso con frío</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 378 250 L 416 270 L 378 290" fill="none" stroke="#22a044" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ================= STEP 2 · Bomba de calor ================= -->
  <g>
    <rect x="430" y="120" width="300" height="300" rx="14" fill="#ffffff" stroke="#2d7a4e" stroke-width="2"/>
    <circle cx="470" cy="166" r="24" fill="#2d7a4e"/>
    <text x="470" y="175" fill="#ffffff" font-size="22" font-weight="800" text-anchor="middle">2</text>
    <text x="508" y="173" fill="#1a4d30" font-size="18" font-weight="800">Bomba de calor</text>

    <!-- heat pump module -->
    <g transform="translate(505, 258)">
      <rect x="0" y="0" width="120" height="66" rx="10" fill="#e8f5ee" stroke="#2d7a4e" stroke-width="2"/>
      <g stroke="#a8c4b0" stroke-width="3" stroke-linecap="round">
        <line x1="14" y1="20" x2="52" y2="20"/>
        <line x1="14" y1="33" x2="52" y2="33"/>
        <line x1="14" y1="46" x2="52" y2="46"/>
      </g>
      <circle cx="90" cy="33" r="20" fill="#ffffff" stroke="#2d7a4e" stroke-width="2"/>
      <g stroke="#2d7a4e" stroke-width="2.5" stroke-linecap="round">
        <line x1="90" y1="33" x2="90" y2="17"/>
        <line x1="90" y1="33" x2="104" y2="41"/>
        <line x1="90" y1="33" x2="76" y2="41"/>
      </g>
      <circle cx="90" cy="33" r="3.5" fill="#2d7a4e"/>
    </g>
    <!-- temperature-up arrow -->
    <path d="M 662 322 V 268 M 653 280 L 662 268 L 671 280" fill="none" stroke="#c07856" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="580" y="392" fill="#444" font-size="13" font-weight="700" text-anchor="middle">El compresor eleva la temperatura</text>
    <text x="580" y="410" fill="#888" font-size="11" font-weight="600" text-anchor="middle">con un pequeño aporte eléctrico</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 748 250 L 786 270 L 748 290" fill="none" stroke="#22a044" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ================= STEP 3 · Calefacción + ACS ================= -->
  <g>
    <rect x="790" y="120" width="350" height="300" rx="14" fill="#e8f5ee" stroke="#2d7a4e" stroke-width="2.5"/>
    <circle cx="830" cy="166" r="24" fill="#2d7a4e"/>
    <text x="830" y="175" fill="#ffffff" font-size="22" font-weight="800" text-anchor="middle">3</text>
    <text x="868" y="173" fill="#1a4d30" font-size="18" font-weight="800">Calefacción + ACS</text>

    <!-- Row A: Calefacción -->
    <g transform="translate(818, 210)">
      <!-- radiator icon -->
      <g fill="#e7c3ac" stroke="#c07856" stroke-width="1.5">
        <rect x="0" y="2" width="8" height="46" rx="3"/>
        <rect x="12" y="2" width="8" height="46" rx="3"/>
        <rect x="24" y="2" width="8" height="46" rx="3"/>
        <rect x="36" y="2" width="8" height="46" rx="3"/>
      </g>
      <rect x="-3" y="-2" width="50" height="6" rx="3" fill="#c07856"/>
      <rect x="-3" y="46" width="50" height="6" rx="3" fill="#c07856"/>
      <text x="72" y="18" fill="#1a4d30" font-size="16" font-weight="800">Calefacción</text>
      <text x="72" y="40" fill="#4d6b58" font-size="12" font-weight="600">Emisores · suelo radiante</text>
    </g>

    <line x1="815" y1="290" x2="1115" y2="290" stroke="#c3d9cc" stroke-width="1.5"/>

    <!-- Row B: Agua caliente -->
    <g transform="translate(818, 318)">
      <!-- tank + droplet -->
      <rect x="6" y="2" width="34" height="52" rx="8" fill="#ffffff" stroke="#1a4d30" stroke-width="2"/>
      <ellipse cx="23" cy="4" rx="17" ry="4" fill="#e8f5ee" stroke="#1a4d30" stroke-width="2"/>
      <path d="M 23 18 C 15 28 15 37 23 37 C 31 37 31 28 23 18 Z" fill="#22a044"/>
      <text x="72" y="22" fill="#1a4d30" font-size="16" font-weight="800">Agua caliente · ACS</text>
      <text x="72" y="44" fill="#4d6b58" font-size="12" font-weight="600">para toda la vivienda</text>
    </g>
  </g>

  <!-- ========== FOOTER ========== -->
  <text x="600" y="500" fill="#666" font-size="12" font-weight="600" text-anchor="middle">Sistema aire-agua / aire-aire · La energía renovable del aire climatiza tu hogar · Ficha CAE RES060</text>
</svg>
