<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="aa-title aa-desc" font-family="Manrope, -apple-system, sans-serif">
  <title id="aa-title">Bomba de calor aire-aire</title>
  <desc id="aa-desc">Unidad interior de tipo split montada en la pared de una estancia, soplando aire, junto a la unidad exterior. Calefacción en invierno y refrigeración en verano.</desc>

  <!-- ===== FONDO + ESCENARIO ===== -->
  <rect width="640" height="420" fill="#f7f7f5"/>
  <circle cx="320" cy="180" r="150" fill="#e9f2ec"/>

  <!-- ===== PARED INTERIOR ===== -->
  <path d="M150,110 L150,300" fill="none" stroke="#a8c4b0" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== UNIDAD INTERIOR (SPLIT) ===== -->
  <rect x="172" y="140" width="188" height="54" rx="14" fill="#ffffff" stroke="#1a4d30" stroke-width="4"/>
  <!-- rejilla de salida -->
  <rect x="186" y="176" width="160" height="10" rx="5" fill="#a8c4b0" stroke="#1a4d30" stroke-width="2.5"/>
  <!-- piloto -->
  <circle cx="340" cy="158" r="5" fill="#22a044" stroke="#1a4d30" stroke-width="1.5"/>

  <!-- ===== FLUJO DE AIRE ===== -->
  <g fill="none" stroke-linecap="round">
    <path d="M206,206 q26,22 52,10 q26,-12 52,10" stroke="#22a044" stroke-width="4"/>
    <path d="M200,232 q30,26 60,12 q30,-14 60,12" stroke="#a8c4b0" stroke-width="3.5"/>
    <path d="M212,258 q22,18 44,8 q22,-10 44,8" stroke="#a8c4b0" stroke-width="3"/>
  </g>

  <!-- ===== INVIERNO / VERANO ===== -->
  <!-- sol -->
  <g transform="translate(196,112)">
    <circle r="13" fill="#ffffff" stroke="#1a4d30" stroke-width="3"/>
    <g stroke="#22a044" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-20" x2="0" y2="-25"/>
      <line x1="0" y1="20" x2="0" y2="25"/>
      <line x1="-20" y1="0" x2="-25" y2="0"/>
      <line x1="20" y1="0" x2="25" y2="0"/>
    </g>
  </g>
  <!-- copo de nieve -->
  <g transform="translate(320,112)" stroke="#1a4d30" stroke-width="3" stroke-linecap="round">
    <line x1="0" y1="-16" x2="0" y2="16"/>
    <line x1="-14" y1="-8" x2="14" y2="8"/>
    <line x1="-14" y1="8" x2="14" y2="-8"/>
  </g>

  <!-- ===== UNIDAD EXTERIOR ===== -->
  <rect x="424" y="196" width="146" height="98" rx="12" fill="#ffffff" stroke="#1a4d30" stroke-width="4"/>
  <g stroke="#a8c4b0" stroke-width="4.5" stroke-linecap="round">
    <line x1="440" y1="220" x2="470" y2="220"/>
    <line x1="440" y1="234" x2="470" y2="234"/>
    <line x1="440" y1="248" x2="470" y2="248"/>
  </g>
  <circle cx="518" cy="245" r="34" fill="#f7f7f5" stroke="#1a4d30" stroke-width="3"/>
  <g transform="translate(518,245)" fill="#a8c4b0" stroke="#1a4d30" stroke-width="1.5" stroke-linejoin="round">
    <path d="M0,0 C5,-9 2,-22 -5,-28 C1,-17 -2,-8 0,0 Z" transform="rotate(10)"/>
    <path d="M0,0 C5,-9 2,-22 -5,-28 C1,-17 -2,-8 0,0 Z" transform="rotate(130)"/>
    <path d="M0,0 C5,-9 2,-22 -5,-28 C1,-17 -2,-8 0,0 Z" transform="rotate(250)"/>
  </g>
  <circle cx="518" cy="245" r="7" fill="#22a044" stroke="#1a4d30" stroke-width="1.5"/>
  <g stroke="#1a4d30" stroke-width="5" stroke-linecap="round">
    <line x1="448" y1="294" x2="448" y2="304"/>
    <line x1="546" y1="294" x2="546" y2="304"/>
  </g>

  <!-- ===== CONEXIÓN ===== -->
  <path d="M360,168 C396,168 404,196 424,214" fill="none" stroke="#1a4d30" stroke-width="7" stroke-linecap="round"/>
  <path d="M360,168 C396,168 404,196 424,214" fill="none" stroke="#a8c4b0" stroke-width="3.5" stroke-linecap="round"/>

  <!-- ===== SUELO ===== -->
  <line x1="150" y1="304" x2="580" y2="304" stroke="#a8c4b0" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== ETIQUETA ===== -->
  <line x1="306" y1="344" x2="334" y2="344" stroke="#22a044" stroke-width="4" stroke-linecap="round"/>
  <text x="320" y="378" fill="#1a4d30" font-size="26" font-weight="800" letter-spacing="5" text-anchor="middle">AIRE-AIRE</text>
</svg>
