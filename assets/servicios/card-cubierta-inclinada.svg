<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="cubierta-title cubierta-desc" font-family="Manrope, -apple-system, sans-serif">
  <title id="cubierta-title">Aislamiento de cubierta inclinada con paneles rígidos</title>
  <desc id="cubierta-desc">Sección de una vivienda con paneles rígidos de aislamiento instalados bajo los rampantes de una cubierta inclinada.</desc>

  <!-- ===== FONDO + ESCENARIO ===== -->
  <rect width="640" height="420" fill="#f7f7f5"/>
  <circle cx="320" cy="180" r="150" fill="#e9f2ec"/>

  <!-- ===== CASA (sección) ===== -->
  <!-- espacio habitable -->
  <path d="M196,190 L196,298 L444,298 L444,190" fill="#ffffff" stroke="#1a4d30" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- forjado / suelo -->
  <line x1="196" y1="190" x2="444" y2="190" stroke="#1a4d30" stroke-width="4" stroke-linecap="round"/>

  <!-- ===== PANELES RÍGIDOS BAJO RAMPANTES ===== -->
  <!-- vertiente izquierda -->
  <g stroke="#1a4d30" stroke-width="2.5" stroke-linejoin="round">
    <path d="M295.91,115.39 L269.07,135.14 L282.11,152.86 L308.95,133.11 Z" fill="#a8c4b0"/>
    <path d="M265.84,137.52 L239.01,157.27 L252.05,174.99 L278.88,155.24 Z" fill="#a8c4b0"/>
    <path d="M235.78,159.64 L208.93,179.41 L221.97,197.13 L248.82,177.36 Z" fill="#a8c4b0"/>
  </g>
  <g stroke="#22a044" stroke-width="3" stroke-linecap="round">
    <line x1="298.28" y1="118.61" x2="271.44" y2="138.36"/>
    <line x1="268.21" y1="140.74" x2="241.38" y2="160.49"/>
    <line x1="238.15" y1="162.86" x2="211.30" y2="182.63"/>
  </g>
  <!-- vertiente derecha -->
  <g stroke="#1a4d30" stroke-width="2.5" stroke-linejoin="round">
    <path d="M344.09,115.39 L370.93,135.14 L357.89,152.86 L331.05,133.11 Z" fill="#a8c4b0"/>
    <path d="M374.16,137.52 L400.99,157.27 L387.95,174.99 L361.12,155.24 Z" fill="#a8c4b0"/>
    <path d="M404.22,159.64 L431.07,179.41 L418.03,197.13 L391.18,177.36 Z" fill="#a8c4b0"/>
  </g>
  <g stroke="#22a044" stroke-width="3" stroke-linecap="round">
    <line x1="341.72" y1="118.61" x2="368.56" y2="138.36"/>
    <line x1="371.79" y1="140.74" x2="398.62" y2="160.49"/>
    <line x1="401.85" y1="162.86" x2="428.70" y2="182.63"/>
  </g>

  <!-- ===== CUBIERTA (por encima de los paneles) ===== -->
  <path d="M168,190 L320,84 L472,190" fill="none" stroke="#1a4d30" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ===== SUELO ===== -->
  <line x1="150" y1="300" x2="490" y2="300" stroke="#a8c4b0" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== ETIQUETA ===== -->
  <line x1="306" y1="344" x2="334" y2="344" stroke="#22a044" stroke-width="4" stroke-linecap="round"/>
  <text x="320" y="378" fill="#1a4d30" font-size="26" font-weight="800" letter-spacing="5" text-anchor="middle">CUBIERTA</text>
</svg>
