<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="desvan-title desvan-desc" font-family="Manrope, -apple-system, sans-serif">
  <title id="desvan-title">Aislamiento de desván no habitable por insuflación</title>
  <desc id="desvan-desc">Sección de una vivienda: lana mineral insuflada por soplado que forma una manta aislante sobre el suelo del desván no habitable.</desc>

  <!-- ===== FONDO + ESCENARIO ===== -->
  <rect width="640" height="420" fill="#f7f7f5"/>
  <circle cx="320" cy="180" r="150" fill="#e9f2ec"/>

  <!-- ===== CASA (sección) ===== -->
  <!-- espacio habitable -->
  <path d="M196,190 L196,298 L444,298 L444,190" fill="#ffffff" stroke="#1a4d30" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- forjado / suelo del desván -->
  <line x1="196" y1="190" x2="444" y2="190" stroke="#1a4d30" stroke-width="4" stroke-linecap="round"/>
  <!-- cubierta -->
  <path d="M168,190 L320,84 L472,190" fill="none" stroke="#1a4d30" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ===== MANTA DE LANA MINERAL INSUFLADA ===== -->
  <path d="M206,190 C206,178 224,168 244,167 C262,166 268,160 288,160 C306,160 312,166 330,166 C350,166 358,159 378,160 C398,161 420,176 434,190 Z" fill="#a8c4b0" stroke="#1a4d30" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- textura -->
  <g fill="#1a4d30" opacity="0.22">
    <circle cx="232" cy="182" r="2"/>
    <circle cx="252" cy="176" r="2.2"/>
    <circle cx="276" cy="180" r="1.8"/>
    <circle cx="300" cy="176" r="2.2"/>
    <circle cx="322" cy="182" r="2"/>
    <circle cx="344" cy="177" r="2.2"/>
    <circle cx="368" cy="181" r="1.8"/>
    <circle cx="392" cy="184" r="2"/>
    <circle cx="288" cy="184" r="1.8"/>
    <circle cx="356" cy="185" r="1.8"/>
  </g>

  <!-- ===== MANGUERA DE INSUFLACIÓN ===== -->
  <path d="M508,146 C478,146 450,150 430,156 C416,160 406,158 398,158" fill="none" stroke="#1a4d30" stroke-width="11" stroke-linecap="round"/>
  <path d="M508,146 C478,146 450,150 430,156 C416,160 406,158 398,158" fill="none" stroke="#a8c4b0" stroke-width="5" stroke-linecap="round"/>
  <!-- boquilla -->
  <line x1="405" y1="151" x2="390" y2="166" stroke="#1a4d30" stroke-width="12" stroke-linecap="round"/>

  <!-- ===== COPOS SOPLADOS ===== -->
  <g>
    <circle cx="384" cy="170" r="4" fill="#22a044"/>
    <circle cx="373" cy="174" r="5" fill="#a8c4b0"/>
    <circle cx="362" cy="171" r="3" fill="#22a044"/>
    <circle cx="352" cy="177" r="4" fill="#a8c4b0"/>
    <circle cx="342" cy="173" r="4" fill="#a8c4b0"/>
    <circle cx="333" cy="179" r="3" fill="#22a044"/>
    <circle cx="360" cy="182" r="4" fill="#a8c4b0"/>
    <circle cx="348" cy="185" r="3" fill="#22a044"/>
    <circle cx="325" cy="176" r="3" fill="#a8c4b0"/>
  </g>

  <!-- ===== SUELO ===== -->
  <line x1="150" y1="300" x2="490" y2="300" stroke="#a8c4b0" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== ETIQUETA ===== -->
  <line x1="306" y1="344" x2="334" y2="344" stroke="#22a044" stroke-width="4" stroke-linecap="round"/>
  <text x="320" y="378" fill="#1a4d30" font-size="26" font-weight="800" letter-spacing="5" text-anchor="middle">DESVÁN</text>
</svg>
