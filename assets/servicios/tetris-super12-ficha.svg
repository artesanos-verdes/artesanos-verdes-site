<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="cf-title cf-desc" font-family="Manrope, -apple-system, sans-serif">
  <title id="cf-title">Ficha de producto del aislante reflectante alveolar TETRIS SUPER 12</title>
  <desc id="cf-desc">Ficha del aislante reflectante alveolar flexible TETRIS SUPER 12, tecnología TRIPLEX del Groupe ORION. Aislante dos en uno que combina aislamiento térmico y estanqueidad al aire. Composición con films de baja emisividad y núcleo alveolar de aire. Resistencia térmica R igual a 6,13 metros cuadrados kelvin por vatio según la norma EN 16012, refleja hasta el 95 por ciento de la radiación infrarroja, barrera de vapor integrada con Sd superior a 60 metros, estanco al aire, calidad del aire interior A+ y marcado CE según EN 13984 de 2013.</desc>

  <defs>
    <linearGradient id="cf-foil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4f3"/>
      <stop offset="0.5" stop-color="#c2cfce"/>
      <stop offset="1" stop-color="#e2eae8"/>
    </linearGradient>
  </defs>

  <!-- ===== FONDO ===== -->
  <rect width="1200" height="520" fill="#f7f7f5"/>

  <!-- ===== BARRA SUPERIOR ===== -->
  <rect x="0" y="0" width="1200" height="70" fill="#1a4d30"/>
  <text x="60" y="30" fill="#a8c4b0" font-size="11" font-weight="700" letter-spacing="2.5">FICHA DE PRODUCTO · AISLANTE REFLECTANTE ALVEOLAR</text>
  <text x="60" y="55" fill="#ffffff" font-size="22" font-weight="700">TETRIS SUPER 12 · tecnología TRIPLEX (Groupe ORION)</text>
  <g transform="translate(1035, 20)">
    <rect x="0" y="0" width="105" height="30" rx="15" fill="#245c3b"/>
    <text x="52" y="20" fill="#c1d9cc" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">CAE · RES010</text>
  </g>

  <!-- ===== ILUSTRACIÓN: COMPOSICIÓN 2 EN 1 ===== -->
  <rect x="60" y="92" width="510" height="396" rx="16" fill="#ffffff" stroke="#ece8dd" stroke-width="1.5"/>
  <text x="315" y="124" fill="#1a4d30" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1.2">COMPOSICIÓN · 2 EN 1</text>
  <text x="315" y="144" fill="#8a9c90" font-size="12" font-weight="600" text-anchor="middle">aislamiento térmico + estanqueidad al aire</text>

  <!-- IR chip -->
  <g transform="translate(222,156)">
    <rect x="0" y="0" width="156" height="24" rx="12" fill="#fdf3ea" stroke="#e2c3ad" stroke-width="1.2"/>
    <circle cx="17" cy="12" r="4" fill="#c07856"/>
    <text x="30" y="16" fill="#b0623f" font-size="11.5" font-weight="800">Refleja hasta 95 % IR</text>
  </g>
  <!-- rayos IR incidente/reflejado -->
  <g fill="none" stroke="#c07856" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 300 186 L 356 214"/>
    <path d="M 356 214 L 412 186"/>
    <path d="M 405 186 L 412 186 L 410 193"/>
  </g>

  <!-- rollo (flexible) -->
  <g transform="translate(150,236)">
    <circle cx="0" cy="0" r="30" fill="url(#cf-foil)" stroke="#9fb3ac" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="19" fill="none" stroke="#9fb3ac" stroke-width="1" opacity="0.7"/>
    <circle cx="0" cy="0" r="8" fill="#d8e8de" stroke="#9fb3ac" stroke-width="1"/>
  </g>
  <!-- lámina desenrollada -->
  <rect x="180" y="212" width="340" height="12" fill="url(#cf-foil)" stroke="#9fb3ac" stroke-width="0.6"/>
  <rect x="180" y="224" width="340" height="36" fill="#d8e8de"/>
  <g fill="#eef7f1" stroke="#a8c4b0" stroke-width="0.8">
    <circle cx="205" cy="234" r="5"/><circle cx="235" cy="234" r="5"/><circle cx="265" cy="234" r="5"/><circle cx="295" cy="234" r="5"/><circle cx="325" cy="234" r="5"/><circle cx="355" cy="234" r="5"/><circle cx="385" cy="234" r="5"/><circle cx="415" cy="234" r="5"/><circle cx="445" cy="234" r="5"/><circle cx="475" cy="234" r="5"/><circle cx="505" cy="234" r="5"/>
    <circle cx="205" cy="250" r="5"/><circle cx="235" cy="250" r="5"/><circle cx="265" cy="250" r="5"/><circle cx="295" cy="250" r="5"/><circle cx="325" cy="250" r="5"/><circle cx="355" cy="250" r="5"/><circle cx="385" cy="250" r="5"/><circle cx="415" cy="250" r="5"/><circle cx="445" cy="250" r="5"/><circle cx="475" cy="250" r="5"/><circle cx="505" cy="250" r="5"/>
  </g>
  <rect x="180" y="260" width="340" height="12" fill="url(#cf-foil)" stroke="#9fb3ac" stroke-width="0.6"/>
  <text x="315" y="296" fill="#3f6b53" font-size="12" font-weight="700" text-anchor="middle">Flexible · se coloca en lés con solape</text>

  <!-- divisor -->
  <line x1="100" y1="316" x2="530" y2="316" stroke="#ece8dd" stroke-width="1.4"/>

  <!-- leyenda de capas -->
  <g transform="translate(110,334)">
    <rect x="0" y="0" width="28" height="20" rx="4" fill="url(#cf-foil)" stroke="#9fb3ac" stroke-width="1"/>
    <text x="40" y="15" fill="#1a4d30" font-size="12.5" font-weight="700">Film de baja emisividad · reflectante</text>
  </g>
  <g transform="translate(110,372)">
    <rect x="0" y="0" width="28" height="20" rx="4" fill="#d8e8de" stroke="#a8c4b0" stroke-width="1"/>
    <text x="40" y="15" fill="#1a4d30" font-size="12.5" font-weight="700">Núcleo alveolar · capas de aire</text>
  </g>
  <g transform="translate(110,410)">
    <rect x="0" y="0" width="28" height="20" rx="4" fill="url(#cf-foil)" stroke="#9fb3ac" stroke-width="1"/>
    <text x="40" y="15" fill="#1a4d30" font-size="12.5" font-weight="700">Film exterior · barrera de vapor (Sd &gt; 60 m)</text>
  </g>
  <text x="124" y="462" fill="#8a9c90" font-size="11.5" font-weight="600">Colocación: clavado, grapado o accesorio ISOCLIP</text>

  <!-- ===== R HERO ===== -->
  <g transform="translate(600,92)">
    <rect x="0" y="0" width="560" height="76" rx="14" fill="#1a4d30"/>
    <rect x="0" y="0" width="7" height="76" rx="3.5" fill="#22a044"/>
    <text x="28" y="47" fill="#ffffff" font-size="32" font-weight="800">R = 6,13 m²·K/W</text>
    <text x="330" y="34" fill="#a8c4b0" font-size="12.5" font-weight="700">Resistencia térmica</text>
    <text x="330" y="52" fill="#a8c4b0" font-size="12.5" font-weight="700">declarada · norma EN 16012</text>
  </g>

  <!-- ===== TARJETAS 2x3 ===== -->
  <!-- 1 Refleja 95% IR -->
  <g transform="translate(600,182)">
    <rect x="0" y="0" width="270" height="92" rx="12" fill="#ffffff" stroke="#ece8dd" stroke-width="1.5"/>
    <rect x="18" y="20" width="40" height="40" rx="10" fill="#e8f5ee" stroke="#a8c4b0" stroke-width="1.4"/>
    <line x1="27" y1="49" x2="49" y2="49" stroke="#1a4d30" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M32,29 L38,48" fill="none" stroke="#c07856" stroke-width="2" stroke-linecap="round"/>
    <path d="M38,48 L44,29 M44,29 l-4,1.5 M44,29 l0.5,4" fill="none" stroke="#22a044" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="40" fill="#1a4d30" font-size="14" font-weight="800">Refleja hasta 95 % IR</text>
    <text x="20" y="76" fill="#5c6b62" font-size="11.5" font-weight="600">Confort en verano e invierno</text>
  </g>
  <!-- 2 Barrera de vapor -->
  <g transform="translate(890,182)">
    <rect x="0" y="0" width="270" height="92" rx="12" fill="#ffffff" stroke="#ece8dd" stroke-width="1.5"/>
    <rect x="18" y="20" width="40" height="40" rx="10" fill="#e8f5ee" stroke="#a8c4b0" stroke-width="1.4"/>
    <path d="M38,28 C46,37 43,46 38,49 C33,46 31,39 38,32 C39,35 40,33 38,28 Z" fill="none" stroke="#1a4d30" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="26" y1="53" x2="50" y2="53" stroke="#22a044" stroke-width="2.4" stroke-linecap="round"/>
    <text x="70" y="36" fill="#1a4d30" font-size="14" font-weight="800">Barrera de vapor</text>
    <text x="20" y="62" fill="#5c6b62" font-size="11.5" font-weight="600">Integrada · Sd &gt; 60 m</text>
    <text x="20" y="80" fill="#5c6b62" font-size="11.5" font-weight="600">(según EN 13984)</text>
  </g>
  <!-- 3 Estanco al aire -->
  <g transform="translate(600,286)">
    <rect x="0" y="0" width="270" height="92" rx="12" fill="#ffffff" stroke="#ece8dd" stroke-width="1.5"/>
    <rect x="18" y="20" width="40" height="40" rx="10" fill="#e8f5ee" stroke="#a8c4b0" stroke-width="1.4"/>
    <line x1="47" y1="26" x2="47" y2="54" stroke="#1a4d30" stroke-width="2.4" stroke-linecap="round"/>
    <g fill="none" stroke="#22a044" stroke-width="2" stroke-linecap="round">
      <path d="M26,34 l12,0"/><path d="M26,46 l12,0"/>
    </g>
    <path d="M40,40 l4,-4 M40,40 l4,4" fill="none" stroke="#c07856" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="40" fill="#1a4d30" font-size="14" font-weight="800">Estanco al aire</text>
    <text x="20" y="76" fill="#5c6b62" font-size="11.5" font-weight="600">Frena infiltraciones y convección</text>
  </g>
  <!-- 4 Calidad aire A+ -->
  <g transform="translate(890,286)">
    <rect x="0" y="0" width="270" height="92" rx="12" fill="#ffffff" stroke="#ece8dd" stroke-width="1.5"/>
    <rect x="18" y="20" width="40" height="40" rx="10" fill="#e8f5ee" stroke="#a8c4b0" stroke-width="1.4"/>
    <path d="M30,50 C30,36 44,30 52,30 C52,44 40,52 30,50 Z" fill="#22a044"/>
    <path d="M34,47 Q42,40 50,34" stroke="#ffffff" stroke-width="1.4" fill="none"/>
    <text x="70" y="40" fill="#1a4d30" font-size="14" font-weight="800">Calidad aire interior A+</text>
    <text x="20" y="76" fill="#5c6b62" font-size="11.5" font-weight="600">Sin fibras ni polvo irritante</text>
  </g>
  <!-- 5 Flexible en lés -->
  <g transform="translate(600,390)">
    <rect x="0" y="0" width="270" height="92" rx="12" fill="#ffffff" stroke="#ece8dd" stroke-width="1.5"/>
    <rect x="18" y="20" width="40" height="40" rx="10" fill="#e8f5ee" stroke="#a8c4b0" stroke-width="1.4"/>
    <circle cx="34" cy="40" r="10" fill="none" stroke="#1a4d30" stroke-width="2"/>
    <circle cx="34" cy="40" r="3.5" fill="#22a044"/>
    <path d="M44,40 q8,-8 12,0 t12,0" fill="none" stroke="#22a044" stroke-width="2" stroke-linecap="round"/>
    <text x="70" y="40" fill="#1a4d30" font-size="14" font-weight="800">Flexible, en lés</text>
    <text x="20" y="76" fill="#5c6b62" font-size="11.5" font-weight="600">Clavado, grapado o ISOCLIP</text>
  </g>
  <!-- 6 Marcado CE -->
  <g transform="translate(890,390)">
    <rect x="0" y="0" width="270" height="92" rx="12" fill="#ffffff" stroke="#ece8dd" stroke-width="1.5"/>
    <rect x="18" y="20" width="40" height="40" rx="10" fill="#e8f5ee" stroke="#a8c4b0" stroke-width="1.4"/>
    <circle cx="38" cy="40" r="13" fill="none" stroke="#1a4d30" stroke-width="1.8"/>
    <text x="38" y="45" fill="#1a4d30" font-size="12" font-weight="800" text-anchor="middle">CE</text>
    <text x="70" y="40" fill="#1a4d30" font-size="14" font-weight="800">Marcado CE</text>
    <text x="20" y="76" fill="#5c6b62" font-size="11.5" font-weight="600">Según EN 13984:2013</text>
  </g>

  <!-- ===== FOOTER ===== -->
  <text x="60" y="508" fill="#a09a8a" font-size="11" font-weight="600">Aislante reflectante alveolar flexible · tecnología TRIPLEX (Groupe ORION) · sistema CAE, financiación privada · Los Artesanos Verdes</text>
</svg>
