<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ah-title ah-desc" font-family="Manrope, -apple-system, sans-serif">
  <title id="ah-title">Aerotermia — bomba de calor de Los Artesanos Verdes</title>
  <desc id="ah-desc">Ilustración de una vivienda con una bomba de calor aerotérmica: la unidad exterior capta la energía del aire y alimenta los emisores de calefacción y el agua caliente sanitaria del interior.</desc>

  <defs>
    <radialGradient id="ah-warm" cx="50%" cy="58%" r="65%">
      <stop offset="0%" stop-color="#fbeede"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </radialGradient>
  </defs>

  <!-- ========== BACKGROUND ========== -->
  <rect width="1200" height="630" fill="#f7f7f5"/>

  <!-- ========== TOP BRAND BAR ========== -->
  <rect x="0" y="0" width="1200" height="110" fill="#1a4d30"/>
  <text x="60" y="48" fill="#a8c4b0" font-size="13" font-weight="700" letter-spacing="3.5">LOS ARTESANOS VERDES · CLIMATIZACIÓN EFICIENTE</text>
  <text x="60" y="86" fill="#ffffff" font-size="32" font-weight="700">Aerotermia — bomba de calor</text>
  <text x="1140" y="44" fill="#ffffff" font-size="15" font-weight="700" text-anchor="end">Aire-agua · Aire-aire</text>
  <text x="1140" y="68" fill="#a8c4b0" font-size="12" font-weight="600" letter-spacing="1" text-anchor="end">Ficha CAE · RES060</text>

  <!-- ========== SUN (energía del entorno) ========== -->
  <g opacity="0.9">
    <circle cx="150" cy="180" r="26" fill="#e0a878"/>
    <g stroke="#e0a878" stroke-width="3" stroke-linecap="round">
      <line x1="150" y1="132" x2="150" y2="144"/>
      <line x1="150" y1="216" x2="150" y2="228"/>
      <line x1="102" y1="180" x2="114" y2="180"/>
      <line x1="186" y1="180" x2="198" y2="180"/>
      <line x1="116" y1="146" x2="125" y2="155"/>
      <line x1="175" y1="205" x2="184" y2="214"/>
      <line x1="184" y1="146" x2="175" y2="155"/>
      <line x1="125" y1="205" x2="116" y2="214"/>
    </g>
  </g>

  <!-- ========== AIRE EXTERIOR — captación ========== -->
  <g fill="none" stroke="#22a044" stroke-width="3" stroke-linecap="round">
    <path d="M 40 388 Q 130 372 205 400"/>
    <path d="M 40 428 Q 130 416 200 432"/>
    <path d="M 40 468 Q 130 456 205 452"/>
    <!-- arrow heads pointing to the unit -->
    <path d="M 194 392 L 208 400 L 193 409"/>
    <path d="M 190 424 L 203 432 L 189 441"/>
    <path d="M 194 444 L 208 452 L 194 461"/>
  </g>
  <text x="60" y="352" fill="#2d7a4e" font-size="14" font-weight="800">Energía del aire</text>
  <text x="60" y="370" fill="#666" font-size="11" font-weight="600">fuente renovable</text>

  <!-- ========== UNIDAD EXTERIOR (bomba de calor) ========== -->
  <g transform="translate(215, 360)">
    <!-- feet -->
    <rect x="18" y="118" width="20" height="12" rx="2" fill="#1a4d30"/>
    <rect x="152" y="118" width="20" height="12" rx="2" fill="#1a4d30"/>
    <!-- body -->
    <rect x="0" y="0" width="190" height="120" rx="10" fill="#ffffff" stroke="#1a4d30" stroke-width="3"/>
    <!-- header strip -->
    <path d="M 0 30 L 0 10 Q 0 0 10 0 L 180 0 Q 190 0 190 10 L 190 30 Z" fill="#1a4d30"/>
    <text x="95" y="20" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">UNIDAD EXTERIOR</text>
    <!-- intake grille -->
    <g stroke="#cddbd2" stroke-width="3" stroke-linecap="round">
      <line x1="20" y1="55" x2="80" y2="55"/>
      <line x1="20" y1="70" x2="80" y2="70"/>
      <line x1="20" y1="85" x2="80" y2="85"/>
      <line x1="20" y1="100" x2="80" y2="100"/>
    </g>
    <!-- fan -->
    <circle cx="132" cy="78" r="33" fill="#e8f5ee" stroke="#2d7a4e" stroke-width="2"/>
    <g stroke="#2d7a4e" stroke-width="3" stroke-linecap="round">
      <line x1="132" y1="78" x2="132" y2="50"/>
      <line x1="132" y1="78" x2="156" y2="92"/>
      <line x1="132" y1="78" x2="108" y2="92"/>
    </g>
    <g fill="none" stroke="#a8c4b0" stroke-width="2">
      <path d="M 114 60 A 24 24 0 0 1 154 66"/>
      <path d="M 152 98 A 24 24 0 0 1 110 94"/>
    </g>
    <circle cx="132" cy="78" r="5" fill="#2d7a4e"/>
  </g>
  <text x="310" y="512" fill="#1a4d30" font-size="14" font-weight="800" text-anchor="middle">Unidad exterior</text>
  <text x="310" y="530" fill="#666" font-size="11" font-weight="600" text-anchor="middle">Bomba de calor aerotérmica</text>

  <!-- ========== PIPE unit -> house (aire-agua) ========== -->
  <path d="M 405 465 H 445 V 500 H 995" fill="none" stroke="#2d7a4e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 405 465 H 445 V 500 H 995" fill="none" stroke="#a8c4b0" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
  <g transform="translate(486, 476)">
    <rect x="0" y="0" width="74" height="20" rx="10" fill="#1a4d30"/>
    <text x="37" y="14" fill="#ffffff" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">AIRE-AGUA</text>
  </g>

  <!-- ========== HOUSE ========== -->
  <!-- roof -->
  <path d="M 555 292 L 830 172 L 1105 292 Z" fill="#cfe0d5" stroke="#1a4d30" stroke-width="3" stroke-linejoin="round"/>
  <!-- room (cutaway) -->
  <rect x="580" y="290" width="500" height="230" fill="url(#ah-warm)" stroke="#1a4d30" stroke-width="3"/>
  <!-- floor band -->
  <rect x="583" y="505" width="494" height="14" fill="#e8e4d8"/>
  <!-- suelo radiante subtle waves -->
  <path d="M 600 512 q 15 -8 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0"
        fill="none" stroke="#22a044" stroke-width="2" opacity="0.45"/>

  <!-- EMISOR / radiador -->
  <g transform="translate(636, 432)">
    <rect x="-4" y="-6" width="93" height="8" rx="4" fill="#c07856"/>
    <rect x="-4" y="66" width="93" height="8" rx="4" fill="#c07856"/>
    <g fill="#e7c3ac" stroke="#c07856" stroke-width="1.5">
      <rect x="0" y="-2" width="10" height="70" rx="4"/>
      <rect x="15" y="-2" width="10" height="70" rx="4"/>
      <rect x="30" y="-2" width="10" height="70" rx="4"/>
      <rect x="45" y="-2" width="10" height="70" rx="4"/>
      <rect x="60" y="-2" width="10" height="70" rx="4"/>
      <rect x="75" y="-2" width="10" height="70" rx="4"/>
    </g>
    <!-- heat waves -->
    <g fill="none" stroke="#c07856" stroke-width="2" stroke-linecap="round" opacity="0.65">
      <path d="M 20 -18 q 6 -8 0 -16"/>
      <path d="M 42 -18 q 6 -8 0 -16"/>
      <path d="M 64 -18 q 6 -8 0 -16"/>
    </g>
  </g>
  <text x="676" y="542" fill="#1a4d30" font-size="13" font-weight="800" text-anchor="middle">Emisores de calor</text>

  <!-- SOFA (confort) -->
  <g transform="translate(775, 452)">
    <rect x="0" y="20" width="120" height="34" rx="8" fill="#a8c4b0" stroke="#2d7a4e" stroke-width="2"/>
    <rect x="-2" y="0" width="124" height="26" rx="8" fill="#2d7a4e"/>
    <rect x="-8" y="18" width="16" height="36" rx="6" fill="#2d7a4e"/>
    <rect x="114" y="18" width="16" height="36" rx="6" fill="#2d7a4e"/>
    <rect x="30" y="12" width="26" height="18" rx="5" fill="#e7c3ac"/>
    <rect x="66" y="12" width="26" height="18" rx="5" fill="#c07856"/>
  </g>

  <!-- ACS TANK -->
  <g transform="translate(955, 358)">
    <rect x="0" y="12" width="76" height="140" rx="16" fill="#ffffff" stroke="#1a4d30" stroke-width="2.5"/>
    <ellipse cx="38" cy="16" rx="38" ry="9" fill="#e8f5ee" stroke="#1a4d30" stroke-width="2.5"/>
    <rect x="0" y="70" width="76" height="10" fill="#e8f5ee"/>
    <!-- water droplet -->
    <path d="M 38 44 C 26 60 26 74 38 74 C 50 74 50 60 38 44 Z" fill="#22a044"/>
    <text x="38" y="110" fill="#1a4d30" font-size="15" font-weight="800" text-anchor="middle">ACS</text>
  </g>
  <text x="993" y="542" fill="#1a4d30" font-size="13" font-weight="800" text-anchor="middle">Agua caliente · ACS</text>

  <!-- ========== BOTTOM BAR ========== -->
  <rect x="0" y="570" width="1200" height="60" fill="#1a4d30"/>
  <text x="60" y="595" fill="#a8c4b0" font-size="11" font-weight="700" letter-spacing="2">AEROTERMIA · SUSTITUCIÓN DE CALDERA</text>
  <text x="60" y="616" fill="#ffffff" font-size="15" font-weight="700">Sustituye tu caldera de gas o gasóleo por una bomba de calor</text>
  <g transform="translate(842, 583)">
    <rect x="0" y="0" width="298" height="34" rx="17" fill="#22a044"/>
    <text x="149" y="22" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Prima CAE descontada del presupuesto</text>
  </g>
</svg>
