<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="cc-title cc-desc" font-family="Manrope, -apple-system, sans-serif">
  <title id="cc-title">Sección constructiva de la cubierta inclinada con aislante reflectante TETRIS SUPER 12</title>
  <desc id="cc-desc">Sección de una cubierta inclinada, del exterior al interior: teja, rastreles, lámina de aire ventilada, chevron o vigueta, aislante reflectante flexible TETRIS SUPER 12 colocado en lés, rail metálico de 70 mm y placa de acabado interior. Resistencia térmica del sistema R igual a 6,13 metros cuadrados kelvin por vatio según la norma EN 16012.</desc>

  <defs>
    <linearGradient id="cc-foil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4f3"/>
      <stop offset="0.5" stop-color="#c2cfce"/>
      <stop offset="1" stop-color="#e2eae8"/>
    </linearGradient>
  </defs>

  <!-- ===== FONDO ===== -->
  <rect width="1200" height="520" fill="#f7f7f5"/>

  <!-- ===== BARRA SUPERIOR ===== -->
  <rect x="0" y="0" width="1200" height="70" fill="#1a4d30"/>
  <text x="60" y="30" fill="#a8c4b0" font-size="11" font-weight="700" letter-spacing="2.5">SECCIÓN CONSTRUCTIVA · CUBIERTA INCLINADA</text>
  <text x="60" y="55" fill="#ffffff" font-size="22" font-weight="700">Rampante aislado con TETRIS SUPER 12 (en lés)</text>

  <!-- ===== EXTERIOR: sol + reflexión IR ===== -->
  <text x="238" y="104" fill="#a09a8a" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">EXTERIOR</text>
  <!-- (la reflexión IR se dibuja sobre la cubierta, tras la sección) -->

  <!-- ===== SECCIÓN INCLINADA (rotada) ===== -->
  <g transform="translate(150 190) rotate(-12)">
    <!-- 1 Teja -->
    <rect x="0" y="0" width="520" height="34" fill="#b7c4ba" stroke="#93a89b" stroke-width="1.2"/>
    <g stroke="#93a89b" stroke-width="1" opacity="0.5">
      <line x1="65" y1="0" x2="65" y2="34"/><line x1="130" y1="0" x2="130" y2="34"/><line x1="195" y1="0" x2="195" y2="34"/><line x1="260" y1="0" x2="260" y2="34"/><line x1="325" y1="0" x2="325" y2="34"/><line x1="390" y1="0" x2="390" y2="34"/><line x1="455" y1="0" x2="455" y2="34"/>
    </g>
    <!-- 2 Rastreles -->
    <rect x="0" y="34" width="520" height="24" fill="#e7ded0"/>
    <g fill="#b99a6e" stroke="#9c8154" stroke-width="0.8">
      <rect x="60" y="37" width="20" height="18"/><rect x="180" y="37" width="20" height="18"/><rect x="300" y="37" width="20" height="18"/><rect x="420" y="37" width="20" height="18"/>
    </g>
    <!-- 3 Lámina de aire ventilada -->
    <rect x="0" y="58" width="520" height="34" fill="#eef4f3" stroke="#d3ddda" stroke-width="0.8"/>
    <g fill="none" stroke="#8fb0bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <path d="M 120 75 l 22 0 M 138 70 l 6 5 l -6 5"/>
      <path d="M 250 75 l 22 0 M 268 70 l 6 5 l -6 5"/>
      <path d="M 380 75 l 22 0 M 398 70 l 6 5 l -6 5"/>
    </g>
    <!-- 4 Chevron / vigueta -->
    <rect x="0" y="92" width="520" height="48" fill="#efece3"/>
    <g fill="#a07d4f" stroke="#7d5f3a" stroke-width="0.8">
      <rect x="35" y="95" width="30" height="42"/><rect x="150" y="95" width="30" height="42"/><rect x="265" y="95" width="30" height="42"/><rect x="380" y="95" width="30" height="42"/><rect x="470" y="95" width="30" height="42"/>
    </g>
    <!-- 5 TETRIS SUPER 12 (aislante reflectante flexible) -->
    <rect x="0" y="140" width="520" height="8" fill="url(#cc-foil)" stroke="#9fb3ac" stroke-width="0.6"/>
    <rect x="0" y="148" width="520" height="40" fill="#d8e8de"/>
    <g fill="#eef7f1" stroke="#a8c4b0" stroke-width="0.8">
      <circle cx="210" cy="159" r="6"/><circle cx="238" cy="159" r="6"/><circle cx="266" cy="159" r="6"/><circle cx="294" cy="159" r="6"/><circle cx="322" cy="159" r="6"/><circle cx="350" cy="159" r="6"/><circle cx="378" cy="159" r="6"/><circle cx="406" cy="159" r="6"/><circle cx="434" cy="159" r="6"/><circle cx="462" cy="159" r="6"/><circle cx="490" cy="159" r="6"/>
      <circle cx="210" cy="177" r="6"/><circle cx="238" cy="177" r="6"/><circle cx="266" cy="177" r="6"/><circle cx="294" cy="177" r="6"/><circle cx="322" cy="177" r="6"/><circle cx="350" cy="177" r="6"/><circle cx="378" cy="177" r="6"/><circle cx="406" cy="177" r="6"/><circle cx="434" cy="177" r="6"/><circle cx="462" cy="177" r="6"/><circle cx="490" cy="177" r="6"/>
    </g>
    <rect x="0" y="188" width="520" height="8" fill="url(#cc-foil)" stroke="#9fb3ac" stroke-width="0.6"/>
    <line x1="270" y1="140" x2="270" y2="196" stroke="#9fb3ac" stroke-width="0.9" opacity="0.7" stroke-dasharray="3 3"/>
    <text x="14" y="164" fill="#1a4d30" font-size="14" font-weight="800">TETRIS SUPER 12</text>
    <text x="14" y="181" fill="#3f6b53" font-size="10.5" font-weight="700">aislante reflectante · en lés</text>
    <!-- 6 Rail metálico 70 mm -->
    <rect x="0" y="196" width="520" height="26" fill="#cfd3d6" stroke="#a9afb3" stroke-width="0.8"/>
    <line x1="0" y1="209" x2="520" y2="209" stroke="#b9bec1" stroke-width="1"/>
    <g fill="#8b9195"><circle cx="60" cy="209" r="2.2"/><circle cx="180" cy="209" r="2.2"/><circle cx="300" cy="209" r="2.2"/><circle cx="420" cy="209" r="2.2"/></g>
    <text x="14" y="213" fill="#5a6266" font-size="9.5" font-weight="700">rail metálico 70 mm</text>
    <!-- 7 Placa de acabado interior -->
    <rect x="0" y="222" width="520" height="26" fill="#f3f1e9" stroke="#d7d2c6" stroke-width="0.8"/>
    <line x1="260" y1="222" x2="260" y2="248" stroke="#d7d2c6" stroke-width="0.8"/>

    <!-- Números de capa sobre la cara de corte -->
    <g font-weight="800" text-anchor="middle">
      <line x1="-16" y1="17" x2="4" y2="17" stroke="#1a4d30" stroke-width="1"/>
      <line x1="-16" y1="46" x2="4" y2="46" stroke="#1a4d30" stroke-width="1"/>
      <line x1="-16" y1="75" x2="4" y2="75" stroke="#1a4d30" stroke-width="1"/>
      <line x1="-16" y1="116" x2="4" y2="116" stroke="#1a4d30" stroke-width="1"/>
      <line x1="-16" y1="168" x2="4" y2="168" stroke="#22a044" stroke-width="1.4"/>
      <line x1="-16" y1="209" x2="4" y2="209" stroke="#1a4d30" stroke-width="1"/>
      <line x1="-16" y1="235" x2="4" y2="235" stroke="#1a4d30" stroke-width="1"/>
      <g transform="translate(-30 17) rotate(12)"><circle r="11" fill="#1a4d30"/><text y="4" fill="#fff" font-size="12">1</text></g>
      <g transform="translate(-30 46) rotate(12)"><circle r="11" fill="#1a4d30"/><text y="4" fill="#fff" font-size="12">2</text></g>
      <g transform="translate(-30 75) rotate(12)"><circle r="11" fill="#1a4d30"/><text y="4" fill="#fff" font-size="12">3</text></g>
      <g transform="translate(-30 116) rotate(12)"><circle r="11" fill="#1a4d30"/><text y="4" fill="#fff" font-size="12">4</text></g>
      <g transform="translate(-30 168) rotate(12)"><circle r="12" fill="#22a044"/><text y="4" fill="#fff" font-size="12">5</text></g>
      <g transform="translate(-30 209) rotate(12)"><circle r="11" fill="#1a4d30"/><text y="4" fill="#fff" font-size="12">6</text></g>
      <g transform="translate(-30 235) rotate(12)"><circle r="11" fill="#1a4d30"/><text y="4" fill="#fff" font-size="12">7</text></g>
    </g>
  </g>

  <!-- ===== SOL + REFLEXIÓN IR (sobre la cubierta) ===== -->
  <g transform="translate(318,110)">
    <circle cx="0" cy="0" r="14" fill="#e8caa9" stroke="#c07856" stroke-width="1.6"/>
    <g stroke="#c07856" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-23" x2="0" y2="-18"/><line x1="-16" y1="-16" x2="-12" y2="-12"/>
      <line x1="-23" y1="0" x2="-18" y2="0"/><line x1="-16" y1="16" x2="-12" y2="12"/>
    </g>
  </g>
  <g fill="none" stroke="#c07856" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 350 100 L 430 131"/>
    <path d="M 430 131 L 510 100"/>
    <path d="M 502 100 L 510 100 L 508 108"/>
  </g>
  <g transform="translate(398,72)">
    <rect x="0" y="0" width="162" height="26" rx="13" fill="#fdf3ea" stroke="#e2c3ad" stroke-width="1.2"/>
    <circle cx="18" cy="13" r="4.5" fill="#c07856"/>
    <text x="32" y="18" fill="#b0623f" font-size="12" font-weight="800">Refleja hasta 95 % IR</text>
  </g>

  <!-- ===== INTERIOR ===== -->
  <g transform="translate(206,452)">
    <path d="M-13,4 L0,-9 L13,4 L13,15 L-13,15 Z" fill="none" stroke="#1a4d30" stroke-width="2" stroke-linejoin="round"/>
    <path d="M-5,15 L-5,6 L5,6 L5,15" fill="none" stroke="#22a044" stroke-width="2"/>
  </g>
  <text x="262" y="462" fill="#a09a8a" font-size="12" font-weight="700" letter-spacing="2">INTERIOR</text>

  <!-- ===== COLUMNA DERECHA: R hero + leyenda ===== -->
  <g transform="translate(740,96)">
    <rect x="0" y="0" width="420" height="80" rx="14" fill="#1a4d30"/>
    <rect x="0" y="0" width="7" height="80" rx="3.5" fill="#22a044"/>
    <text x="26" y="46" fill="#ffffff" font-size="29" font-weight="800">R = 6,13 m²·K/W</text>
    <text x="26" y="68" fill="#a8c4b0" font-size="12.5" font-weight="700">Resistencia térmica del sistema · norma EN 16012</text>
  </g>

  <g transform="translate(740,200)">
    <text x="0" y="0" fill="#1a4d30" font-size="12" font-weight="800" letter-spacing="1.5">CAPAS DEL SISTEMA · EXTERIOR → INTERIOR</text>

    <!-- fila -->
    <g transform="translate(0,18)">
      <circle cx="12" cy="12" r="11" fill="#1a4d30"/><text x="12" y="16" fill="#fff" font-size="12" font-weight="800" text-anchor="middle">1</text>
      <rect x="30" y="1" width="22" height="22" rx="4" fill="#b7c4ba" stroke="#93a89b" stroke-width="1"/>
      <text x="62" y="11" fill="#1a4d30" font-size="13" font-weight="800">Teja</text>
      <text x="62" y="26" fill="#5c6b62" font-size="11" font-weight="600">Cubierta existente, se conserva</text>
    </g>
    <g transform="translate(0,57)">
      <circle cx="12" cy="12" r="11" fill="#1a4d30"/><text x="12" y="16" fill="#fff" font-size="12" font-weight="800" text-anchor="middle">2</text>
      <rect x="30" y="1" width="22" height="22" rx="4" fill="#b99a6e" stroke="#9c8154" stroke-width="1"/>
      <text x="62" y="11" fill="#1a4d30" font-size="13" font-weight="800">Rastreles</text>
      <text x="62" y="26" fill="#5c6b62" font-size="11" font-weight="600">Listones de fijación de la teja</text>
    </g>
    <g transform="translate(0,96)">
      <circle cx="12" cy="12" r="11" fill="#1a4d30"/><text x="12" y="16" fill="#fff" font-size="12" font-weight="800" text-anchor="middle">3</text>
      <rect x="30" y="1" width="22" height="22" rx="4" fill="#eef4f3" stroke="#cddbd2" stroke-width="1"/>
      <text x="62" y="11" fill="#1a4d30" font-size="13" font-weight="800">Lámina de aire ventilada</text>
      <text x="62" y="26" fill="#5c6b62" font-size="11" font-weight="600">Cámara que evacúa la humedad</text>
    </g>
    <g transform="translate(0,135)">
      <circle cx="12" cy="12" r="11" fill="#1a4d30"/><text x="12" y="16" fill="#fff" font-size="12" font-weight="800" text-anchor="middle">4</text>
      <rect x="30" y="1" width="22" height="22" rx="4" fill="#a07d4f" stroke="#7d5f3a" stroke-width="1"/>
      <text x="62" y="11" fill="#1a4d30" font-size="13" font-weight="800">Chevron / vigueta</text>
      <text x="62" y="26" fill="#5c6b62" font-size="11" font-weight="600">Estructura de madera del faldón</text>
    </g>
    <g transform="translate(0,174)">
      <circle cx="12" cy="12" r="12" fill="#22a044"/><text x="12" y="16" fill="#fff" font-size="12" font-weight="800" text-anchor="middle">5</text>
      <rect x="30" y="1" width="22" height="22" rx="4" fill="url(#cc-foil)" stroke="#1a4d30" stroke-width="1.4"/>
      <text x="62" y="11" fill="#1a4d30" font-size="13" font-weight="800">TETRIS SUPER 12</text>
      <text x="62" y="26" fill="#3f6b53" font-size="11" font-weight="700">Aislante reflectante flexible, en lés</text>
    </g>
    <g transform="translate(0,213)">
      <circle cx="12" cy="12" r="11" fill="#1a4d30"/><text x="12" y="16" fill="#fff" font-size="12" font-weight="800" text-anchor="middle">6</text>
      <rect x="30" y="1" width="22" height="22" rx="4" fill="#cfd3d6" stroke="#a9afb3" stroke-width="1"/>
      <text x="62" y="11" fill="#1a4d30" font-size="13" font-weight="800">Rail metálico 70 mm</text>
      <text x="62" y="26" fill="#5c6b62" font-size="11" font-weight="600">Soporte clavado bajo los chevrons</text>
    </g>
    <g transform="translate(0,252)">
      <circle cx="12" cy="12" r="11" fill="#1a4d30"/><text x="12" y="16" fill="#fff" font-size="12" font-weight="800" text-anchor="middle">7</text>
      <rect x="30" y="1" width="22" height="22" rx="4" fill="#f3f1e9" stroke="#d7d2c6" stroke-width="1"/>
      <text x="62" y="11" fill="#1a4d30" font-size="13" font-weight="800">Placa de acabado interior</text>
      <text x="62" y="26" fill="#5c6b62" font-size="11" font-weight="600">Terminación vista del desván</text>
    </g>
  </g>

  <!-- ===== FOOTER ===== -->
  <text x="60" y="506" fill="#a09a8a" font-size="11" font-weight="600">Sección esquemática · aislante reflectante alveolar (tecnología TRIPLEX, Groupe ORION) · sistema CAE, financiación privada · ficha RES010</text>
</svg>
