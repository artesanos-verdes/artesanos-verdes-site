<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="aero-title aero-desc" font-family="Manrope, -apple-system, sans-serif">
  <title id="aero-title">Aerotermia · bomba de calor</title>
  <desc id="aero-desc">Unidad exterior de aerotermia junto a la vivienda, con ondas de calor y confort y las conexiones a la casa.</desc>

  <!-- ===== FONDO + ESCENARIO ===== -->
  <rect width="640" height="420" fill="#f7f7f5"/>
  <circle cx="320" cy="180" r="150" fill="#e9f2ec"/>

  <!-- ===== ESQUINA DE LA VIVIENDA ===== -->
  <rect x="176" y="176" width="76" height="122" fill="#ffffff" stroke="#1a4d30" stroke-width="4" stroke-linejoin="round"/>
  <path d="M168,176 L214,138 L260,176" fill="none" stroke="#1a4d30" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- ventana -->
  <rect x="196" y="206" width="36" height="40" rx="4" fill="#a8c4b0" stroke="#1a4d30" stroke-width="3"/>
  <line x1="214" y1="206" x2="214" y2="246" stroke="#1a4d30" stroke-width="2"/>
  <line x1="196" y1="226" x2="232" y2="226" stroke="#1a4d30" stroke-width="2"/>

  <!-- ===== CONEXIONES (tuberías) ===== -->
  <path d="M288,214 C270,214 260,224 252,232" fill="none" stroke="#1a4d30" stroke-width="8" stroke-linecap="round"/>
  <path d="M288,214 C270,214 260,224 252,232" fill="none" stroke="#a8c4b0" stroke-width="4" stroke-linecap="round"/>

  <!-- ===== ONDAS DE CALOR / CONFORT ===== -->
  <g fill="none" stroke-linecap="round">
    <path d="M372,170 q11,-13 0,-26 q-11,-13 0,-26" stroke="#a8c4b0" stroke-width="3.5"/>
    <path d="M402,168 q12,-14 0,-28 q-12,-14 0,-28" stroke="#22a044" stroke-width="4"/>
    <path d="M432,170 q11,-13 0,-26 q-11,-13 0,-26" stroke="#a8c4b0" stroke-width="3.5"/>
  </g>

  <!-- ===== UNIDAD EXTERIOR ===== -->
  <rect x="288" y="176" width="180" height="112" rx="14" fill="#ffffff" stroke="#1a4d30" stroke-width="4"/>
  <!-- lamas -->
  <g stroke="#a8c4b0" stroke-width="5" stroke-linecap="round">
    <line x1="306" y1="206" x2="352" y2="206"/>
    <line x1="306" y1="220" x2="352" y2="220"/>
    <line x1="306" y1="234" x2="352" y2="234"/>
    <line x1="306" y1="248" x2="352" y2="248"/>
  </g>
  <!-- ventilador -->
  <circle cx="402" cy="232" r="44" fill="#f7f7f5" stroke="#1a4d30" stroke-width="3"/>
  <g transform="translate(402,232)" fill="#a8c4b0" stroke="#1a4d30" stroke-width="1.5" stroke-linejoin="round">
    <path d="M0,0 C6,-12 3,-28 -6,-36 C1,-22 -3,-10 0,0 Z" transform="rotate(10)"/>
    <path d="M0,0 C6,-12 3,-28 -6,-36 C1,-22 -3,-10 0,0 Z" transform="rotate(130)"/>
    <path d="M0,0 C6,-12 3,-28 -6,-36 C1,-22 -3,-10 0,0 Z" transform="rotate(250)"/>
  </g>
  <circle cx="402" cy="232" r="32" fill="none" stroke="#1a4d30" stroke-width="1.2" opacity="0.4"/>
  <circle cx="402" cy="232" r="8" fill="#22a044" stroke="#1a4d30" stroke-width="1.5"/>
  <!-- patas -->
  <g stroke="#1a4d30" stroke-width="5" stroke-linecap="round">
    <line x1="316" y1="288" x2="316" y2="300"/>
    <line x1="440" y1="288" x2="440" y2="300"/>
  </g>

  <!-- ===== SUELO ===== -->
  <line x1="150" y1="300" x2="490" y2="300" stroke="#a8c4b0" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== ETIQUETA ===== -->
  <line x1="306" y1="344" x2="334" y2="344" stroke="#22a044" stroke-width="4" stroke-linecap="round"/>
  <text x="320" y="378" fill="#1a4d30" font-size="26" font-weight="800" letter-spacing="5" text-anchor="middle">AEROTERMIA</text>
</svg>
